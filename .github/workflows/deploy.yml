# Ships main to production once ci passes on it: builds every image for that commit (the game, migrate and web
# ship together, all at one tag), uploads infra/ as the release bundle, and has the host deploy it through SSM Run Command.
# Run it by hand to redeploy or roll back to a commit whose images ECR still keeps. It needs the repository
# variables Terraform outputs (infra/terraform/gh-variables.sh) and does nothing until they exist.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to deploy; empty for the head of main.
        type: string
        required: false

# One deploy at a time, and a queued one never cancels a deploy halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # A pushed main that passed ci, or a hand run; not a pull request whose branch happens to be called main.
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      version: ${{ steps.rev.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          fetch-depth: 0 # the tags, for the version git describe gives the binaries, as make up does
      - id: rev
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --always --abbrev=12)" >> "$GITHUB_OUTPUT"

  server:
    needs: prepare
    strategy:
      matrix:
        image: [finga, migrate] # stages of server/Dockerfile
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      repository: finga/${{ matrix.image }}
      tag: ${{ needs.prepare.outputs.sha }}
      context: server
      target: ${{ matrix.image }}
      build-args: |
        VERSION=${{ needs.prepare.outputs.version }}
      aws-region: ${{ vars.AWS_REGION }}
      role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}

  web:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      repository: finga/web
      tag: ${{ needs.prepare.outputs.sha }}
      context: web
      build-contexts: |
        gamedata=server/data
        errors=server/testdata/errors
        proto=server/api/proto
        edge=infra/nginx
      aws-region: ${{ vars.AWS_REGION }}
      role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}

  bundle:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # The committed infra/ alone (git archive keeps the scripts' executable bits); the host needs no Terraform.
      - name: upload the release bundle
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/$SHA.tar.gz" HEAD -- infra ':(exclude)infra/terraform'
          tar -tzvf "$RUNNER_TEMP/$SHA.tar.gz"
          aws s3 cp --only-show-errors "$RUNNER_TEMP/$SHA.tar.gz" "s3://$BUCKET/releases/$SHA.tar.gz"

  deploy:
    needs: [prepare, server, web, bundle]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # SSM keeps the first 24,000 characters of the output; the whole log is on the host under /opt/finga/logs.
      - name: deploy on the host
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          INSTANCE: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: |
          params=$(jq -nc --arg cmd "/usr/local/bin/compose-release $SHA" '{commands: [$cmd], executionTimeout: ["1800"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA:0:12}" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $id on $INSTANCE"
          status=Pending
          for _ in $(seq 1 360); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in Pending | InProgress | Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query StandardErrorContent --output text)
          if [ -n "$err" ] && [ "$err" != None ]; then echo "$err" >&2; fi
          echo "status: $status"
          [ "$status" = Success ]
