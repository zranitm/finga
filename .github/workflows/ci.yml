name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the previous commit, for buf breaking
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0   # built with Go 1.27, matching server/go.mod; an older build refuses the target version
          args: --help   # install only; `make lint` runs it below with the repo's settings
      - run: make lint-go
      # The gRPC code in server/api/gen is committed; regenerating it with
      # the generators pinned in go.mod must change nothing.
      - name: generated gRPC code is current
        run: cd server && go tool buf generate && git diff --exit-code -- api/gen
      # The internal contracts against the previous commit: a change that
      # breaks a caller (a field's number or type, a removed RPC) fails here.
      - name: no breaking change to the gRPC contracts
        run: make breaking BREAKING_AGAINST=HEAD~1
      # The Go half of make test, crash test included: it builds every
      # service, runs each as its own process over a Testcontainers Postgres,
      # kills the world and the item service mid-pickup while the gateway
      # keeps the sockets, restarts them, and checks the item invariants. The
      # client half of test, lint and cover runs in the node job.
      - run: make test-go
      - run: make cover-go

  # Each service builds and passes its own tests on its own, without the
  # rest of the module's tests (Low-level design, page 10).
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, account, character, item, world, social]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make test-service SERVICE=${{ matrix.service }}

  # The client: page 7's toolchain, with the lockfile as the cache key.
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  # The packaging step: the images build, `make up` brings the whole Stage 1
  # game up from a clean clone (Postgres, migrate, the six services and the
  # client on nginx), and a test client signs up, enters the world and moves,
  # once against the gateway and once through nginx as a browser would.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make up
      - name: wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - run: make smoke
      - name: the client and the smoke test through nginx
        run: |
          curl -fsS http://localhost:4173/ | grep -q '<title>Finga</title>'
          make smoke SMOKE_URL=http://localhost:4173
      - if: always()
        run: make down
