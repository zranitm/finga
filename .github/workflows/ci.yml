name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the previous commit, for buf breaking
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0   # built with Go 1.27: an older build refuses server/go.mod's version
          args: --help   # install only; `make lint` runs it below with the repo's settings
      - run: make lint-go
      - name: generated Go code is current
        run: cd server && go tool buf generate && git diff --exit-code -- api/gen
      - name: no breaking change to the contracts
        run: make breaking BREAKING_AGAINST=HEAD~1
      # Includes the crash test: the world and item service die mid-pickup and restart.
      - run: make test-go
      - run: make cover-go

  # Each service builds and passes its own tests on its own.
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, account, character, item, world, social]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make test-service SERVICE=${{ matrix.service }}

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  # From a clean clone: build the images, bring the game up, smoke-test it directly and through nginx.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make up
      - name: wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - run: make smoke
      - name: the client and the smoke test through nginx
        run: |
          curl -fsS http://localhost:4173/ | grep -q '<title>Finga</title>'
          make smoke SMOKE_URL=http://localhost:4173
      # Last: it uses up the runner's login allowance at nginx for a minute.
      - name: limits per client address at nginx, none at the gateway
        run: make edge
      - if: always()
        run: make down
