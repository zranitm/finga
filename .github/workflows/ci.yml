name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: buf breaking compares with the commit before the push or the PR's base
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0   # built with Go 1.27: an older build refuses server/go.mod's version
          args: --help   # install only; `make lint` runs it below with the repo's settings
      - name: the commits this run checks
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push has no commit before it; a force push's is gone, so its whole history is read.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "BASE=HEAD~1" >> "$GITHUB_ENV"; echo "MESSAGES=HEAD~1..HEAD" >> "$GITHUB_ENV"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "BASE=$BEFORE" >> "$GITHUB_ENV"; echo "MESSAGES=$BEFORE..HEAD" >> "$GITHUB_ENV"
          else
            echo "BASE=HEAD~1" >> "$GITHUB_ENV"; echo "MESSAGES=HEAD" >> "$GITHUB_ENV"
          fi
      - name: no Claude links in the commits or the files
        run: |
          git log --format=%B "$MESSAGES" > "$RUNNER_TEMP/messages"   # fails the step when the range can't be read
          if grep -niE 'claude[.]ai|claude[-]session' "$RUNNER_TEMP/messages"; then echo "a commit message links to a Claude session"; exit 1; fi
          if git grep -niE 'claude[.]ai|claude[-]session'; then echo "a file links to a Claude session"; exit 1; fi
      - run: make lint-go
      - name: generated Go code is current
        run: cd server && go tool buf generate && git diff --exit-code -- api/gen && go tool sqlc diff
      - name: no breaking change to the contracts
        run: make breaking BREAKING_AGAINST="$BASE"
      # Every test once, with the race detector, the crash test included: the world and item service die mid-pickup and restart.
      - run: make cover-go

  # Each service builds and passes its own tests on its own.
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, account, character, item, world, social]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make test-service SERVICE=${{ matrix.service }}

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

  # From a clean clone: build the images, bring the game up, smoke-test it directly and through nginx.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: make up
      - name: wait for the gateway
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:9100/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs
          exit 1
      - run: make smoke
      - name: the client and the smoke test through nginx
        run: |
          curl -fsS http://localhost:4173/ | grep -q '<title>Finga</title>'
          make smoke SMOKE_URL=http://localhost:4173
      # Last: it uses up the runner's login allowance at nginx for a minute.
      - name: limits per client address at nginx, none at the gateway
        run: make edge
      - if: always()
        run: make down
