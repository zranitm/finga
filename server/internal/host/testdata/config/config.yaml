# A made-up server's file, where Start looks for it: config/. Two modules, each run as its own process.
shutdown_grace: 1s
log:
  level: info
  format: json
shop:
  grpc:
    listen: "127.0.0.1:0"
  ops:
    addr: "127.0.0.1:0"
  stock: 3
edge: # serves no gRPC, as the gateway
  ops:
    addr: "127.0.0.1:0"
