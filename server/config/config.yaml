# The server's committed defaults, nothing secret: the shared sections, then one per module.
# FINGA_<KEY_PATH> overrides a key (FINGA_DATABASE_URL, FINGA_WORLD_TICK_RATE_HZ), and CONFIG_PATH or a git-ignored config.local.yaml beside this file replaces it.

http:                    # where the gateway serves players: REST under /api and the WebSocket at /ws
  addr: ":8080"
  cors_origins: []      # browser origins allowed for REST and WebSocket; empty: same origin only
ops:                     # /healthz, /readyz and /metrics
  addr: ":9100"
admin:                   # the private admin API make testers writes through; never public, and pinned off in prod
  addr: "127.0.0.1:9200"
  enabled: false
shutdown_grace: 10s
log:
  level: info
  format: json            # or console: coloured lines for a terminal
  source: false           # add each call's file:line
  sampling:               # each message at each level per second: the first 100, then every 100th
    initial: 100
    thereafter: 100
tracing:
  otlp_endpoint: ""      # host:port of an OTLP gRPC collector; empty keeps trace IDs for the logs only
database:                # one Postgres; each module with tables keeps to its own
  url: postgres://finga:finga@localhost:5432/finga?sslmode=disable
  max_conns: 60           # cmd/finga's one pool, for account, character and item; Postgres allows 100
  statement_timeout: 5s             # a statement that runs longer is cancelled
  lock_timeout: 2s                  # so is one that waits longer for a lock
  idle_in_transaction_timeout: 10s  # and a session left idle in a transaction is ended
data_dir: data           # the game data, relative to server/, loaded once per process

gateway:
  ws:
    hello_timeout: 5s     # a connection that sends no Hello in this long is closed
    command_queue: 64     # a connection's commands waiting their turn; one more answers rate_limited
  sessions:
    join_timeout: 5s      # a Hello's or a rejoin's whole join, retries included
    check_interval: 1m    # how often every session is checked with the account module

account:
  password:               # the Argon2id cost of a password hash; raise it as the hardware allows, and each account follows at its next login
    time: 1
    memory_kib: 65536
    threads: 4
    concurrent: 4         # hashes at once, 64 MiB each; a login past them waits, then answers rate_limited
    wait: 1s
  sessions:               # a session that ended, revoked or expired, is deleted keep after it ended
    keep: 720h            # 30 days
    prune_every: 1h       # how often older ones are deleted
    prune_batch: 1000     # sessions per DELETE, so none holds its locks long
    prune_gap: 100ms      # the pause between batches, so other writers get the table in between

item:
  idempotency_keys:       # a retry within keep replays the first answer; after it, the command runs again
    keep: 24h             # far past any caller's retries, which last seconds
    prune_every: 10m      # how often older keys are deleted
    prune_batch: 1000     # keys per DELETE, so none holds its locks long
    prune_gap: 100ms      # the pause between batches, so other writers get the table in between
  outbox:                 # the events a change writes, for Stage 2's relay to publish
    published_keep: 24h   # a published row is deleted this long after published_at
    unpublished_keep: 168h  # Stage 1 only: no relay publishes, so a row this old is deleted unsent. Set 0 (off) when Stage 2's relay arrives, or its pending events are lost
    prune_every: 10m      # how often older rows are deleted
    prune_batch: 1000     # rows per DELETE, so none holds its locks long
    prune_gap: 100ms      # the pause between batches, so other writers get the table in between

world:
  tick_rate_hz: 20        # a whole number of movement steps per tick (data/movement.yaml dt); the gateway admits 30 inputs a second
  checkpoint_interval: 30s
  flush_timeout: 10s      # the last saves on shutdown, all together; after shutdown_grace
  item_calls:
    workers: 8            # the pool that runs the calls to the item module off the tick
    batch_max: 32         # drops one grant call may carry, at most the item module's 32

social:
  members:                # a member offline and in no party is forgotten keep after going offline
    keep: 1h              # well past a gateway's 30 s grace, so one that comes back finds what the world reported
    prune_every: 5m       # how often older ones are forgotten
    prune_batch: 1000     # members per pass, so none holds the store's lock long
    prune_gap: 100ms      # the pause between batches, so other writers get the store in between
