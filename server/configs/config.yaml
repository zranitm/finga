# configs/config.yaml: committed defaults for local runs and docker-compose.
# Any key can be overridden as FINGA_<KEY_PATH>, e.g. FINGA_SERVER_ADDR.
# Nothing here is secret. A value that ever is would come from the environment
# or from config.local.yaml, which is git-ignored.

server:
  addr: ":8080"
  cors_origins: []          # browser origins allowed for REST and WebSocket; empty: same origin only
  shutdown_grace: 10s

database:
  url: postgres://finga:finga@localhost:5432/finga?sslmode=disable
  max_conns: 20

world:
  tick_rate_hz: 20
  checkpoint_interval: 30s  # TD-02
  data_dir: data

economy:
  workers: 8

telemetry:
  log_level: info

# The internal services (Low-level design, page 10): where each serves gRPC
# (listen), where callers dial it (addr; Compose sets the service's name),
# and its /healthz, /readyz and /metrics (ops). Stage 1 runs one node each.
services:
  account:   { listen: ":9001", addr: "localhost:9001", ops: ":9101" }
  character: { listen: ":9002", addr: "localhost:9002", ops: ":9102" }
  item:      { listen: ":9003", addr: "localhost:9003", ops: ":9103" }
  world:     { listen: ":9004", addr: "localhost:9004", ops: ":9104" }
  social:    { listen: ":9005", addr: "localhost:9005", ops: ":9105" }
