# Mob types, with stats, the damage type of their contact attack, patrol behavior and drop tables whose entries roll independently: four mobs for the forest (levels 1 to 10) and the cave (10 to 20).
# HP and attack are set so a character who spends its points by its class's split, in the gear of the mob's level, needs about as many hits to kill it, and survives about as many of its touches, as before the stat system; a bat's magic touch meets the low magic defense most builds have, so it hits for less.
# The cave drops the gear of levels 20 to 29 rarely, until a map has mobs that high.
mobs:
  - id: green_slime
    name: Green Slime
    level: 1
    hp: 34
    attack: 6
    damage: physical
    physical_defense: 2
    magic_defense: 1
    accuracy: 8
    evasion: 2
    exp: 5
    speed: 40
    width: 32
    height: 28
    behavior: patrol
    drops:
      - {item: slime_gel, chance: 0.6, min: 1, max: 2}
      - {item: red_potion, chance: 0.15, min: 1, max: 1}
  - id: orange_mushroom
    name: Orange Mushroom
    level: 4
    hp: 72
    attack: 12
    damage: physical
    physical_defense: 5
    magic_defense: 3
    accuracy: 12
    evasion: 4
    exp: 14
    speed: 50
    width: 36
    height: 40
    behavior: patrol
    drops:
      - {item: mushroom_cap, chance: 0.6, min: 1, max: 2}
      - {item: red_potion, chance: 0.2, min: 1, max: 1}
      - {item: leather_cap, chance: 0.05, min: 1, max: 1}
