# Mob types (page 5): stats, patrol behavior, and drop tables where each
# entry rolls independently. Four mobs for the two hunting maps: the forest
# (levels 1 to 10) and the cave (10 to 20).
mobs:
  - id: green_slime
    name: Green Slime
    level: 1
    hp: 30
    attack: 6
    defense: 2
    accuracy: 8
    evasion: 2
    exp: 5
    speed: 40
    width: 32
    height: 28
    behavior: patrol
    drops:
      - {item: slime_gel, chance: 0.6, min: 1, max: 2}
      - {item: red_potion, chance: 0.15, min: 1, max: 1}
  - id: orange_mushroom
    name: Orange Mushroom
    level: 4
    hp: 70
    attack: 12
    defense: 5
    accuracy: 12
    evasion: 4
    exp: 14
    speed: 50
    width: 36
    height: 40
    behavior: patrol
    drops:
      - {item: mushroom_cap, chance: 0.6, min: 1, max: 2}
      - {item: red_potion, chance: 0.2, min: 1, max: 1}
      - {item: leather_cap, chance: 0.05, min: 1, max: 1}
  - id: wild_boar
    name: Wild Boar
    level: 10
    hp: 180
    attack: 28
    defense: 12
    accuracy: 20
    evasion: 8
    exp: 45
    speed: 90
    width: 56
    height: 40
    behavior: patrol
    drops:
      - {item: boar_tusk, chance: 0.5, min: 1, max: 1}
      - {item: red_potion, chance: 0.25, min: 1, max: 2}
      - {item: leather_vest, chance: 0.06, min: 1, max: 1}
      - {item: iron_sword, chance: 0.03, min: 1, max: 1}
      - {item: hunting_bow, chance: 0.03, min: 1, max: 1}
  - id: cave_bat
    name: Cave Bat
    level: 14
    hp: 150
    attack: 34
    defense: 8
    accuracy: 26
    evasion: 18
    exp: 62
    speed: 110
    width: 40
    height: 32
    behavior: patrol
    drops:
      - {item: bat_wing, chance: 0.55, min: 1, max: 2}
      - {item: blue_potion, chance: 0.25, min: 1, max: 1}
