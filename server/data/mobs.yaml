# Mob types, with stats, the damage type of their attacks, patrol behavior and drop tables whose entries roll independently: the green region, Willowmere (levels 1 to 14, its areas' new mobs and bosses beside the first slimes and mushrooms) with the cave (10 to 14) and the sunken shrine's fish (9 to 11) below it, then two per new map, a normal mob and its elite.
# HP and attack are set so a character who spends its points by its class's split, in the gear of the mob's level, needs as many hits to kill it, and survives as many of its hits, as its region's targets in the world's balance test; a magic attack meets the low magic defense most builds have, so it hits for less.
# Each map drops its own band's gear at normal rates and the next band's rarely; the cave bat's rare finds are the gear of levels 20 to 24, and only the keep drops the level 30 ★6 and ★7 pieces.
# attacks name the table's by family: slimes hop, snails charge, mice bite and flies spit, and each fish as it hunts; an elite's reach is 1.5 times as far, a boss's about twice, and a boss adds a slam it alternates with.
# speed is in m/s, and radius and height are the mob's cylinder in metres.
# look is the client's art: a model where one is mapped, an optional tint and an optional scale. elite: true marks a map's bigger mob, with 2 to 3 times its normal mob's hits and EXP and about twice its drops; a map with an elite has a normal mob too.
# boss: true marks a hunting map's field boss, which kills on the map bring to the spot its boss layer sets: two levels above the map's top, 3 times the size, twice the attack and 40 times the EXP of its top normal mob, which it drops the gear of at 10 times the chance, with potions. Its HP makes a fight alone about 3 minutes, and both its attacks' cooldowns, the table's times the smallest factor that does, each rounded up to a quarter second, keep a melee player in reach within 30 of the band's potion over it.
# super_armor: true, on every elite and boss, keeps a mob from flinching, being pushed or knocked down, and its attacks go on whatever hits it.
hit_guard: 500ms # after a mob's hit or MISS, no mob's attack hits the player for this long, longer than a knockback's hop; a hit blinks for it
provoke: 5s # how long a mob a player hits follows them
sight: 9.375 # metres in any direction across the ground within which a mob sees a player whose feet are from 1 m below its own to 3 m above; it comes after them, and keeps them until they're out of sight for 1 s
leash: 16 # metres: a mob whose target is farther than this from its spawn circle's edge drops them and walks home
engage: [0ms, 400ms] # each time someone comes into a mob's reach, after nobody was, it waits a time rolled in this before a windup, so mobs that reach a player together don't attack as one
patrol: {speed_jitter: 0.15, pause: [600ms, 1400ms]} # each mob walks, chases and rushes at its own pace, 1 ± up to speed_jitter of its speed rolled at its spawn, and pauses at each spot it wanders to for a time rolled in pause, so mobs that meet drift apart
react: {flinch: 300ms, push: 0.25, down_hits: 3, down_window: 1500ms, down: 1s, armor_after: 1s} # a blow that lands stops a mob without super armor and pushes it push metres away from the attacker; down_hits of them, each within down_window of the last, knock it down, and it gets up with super armor
attacks: # the attacks mobs use, lengths in metres and speeds in m/s: a windup, the act (travel long), then recover; the cooldown counts from the start; power times the mob's attack. A mob names its own and may change any value but the kind.
  bite: {kind: front, windup: 600ms, reach: 0.75, recover: 300ms, cooldown: 2s, power: 1}
  hop: {kind: leap, windup: 600ms, distance: 2.25, travel: 400ms, spread: 0.375, recover: 300ms, cooldown: 2500ms, power: 1}
  charge: {kind: rush, windup: 800ms, distance: 4, travel: 400ms, recover: 600ms, cooldown: 3s, power: 1}
  spit: {kind: shot, windup: 600ms, range: 7.5, speed: 9.375, size: 0.375, recover: 300ms, cooldown: 2500ms, power: 1}
  slam: {kind: around, windup: 1000ms, spread: 1.5, recover: 600ms, cooldown: 5s, power: 1.5, status: {id: stun, time: 1s}, unblockable: true} # only field bosses slam; a block doesn't stop it
field_boss:
  respawn: 5m # a beaten boss is back at its spot this long after
  drop_share: 0.01 # the share of its HP a player's damage, or their party's, must reach for a drop roll
