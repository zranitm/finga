# Mob types, with stats, the damage type of their attacks, patrol behavior and drop tables whose entries roll independently: the forest (levels 1 to 4) and the cave (10 to 14), then two per new map, a normal mob and its elite.
# HP and attack are set so a character who spends its points by its class's split, in the gear of the mob's level, needs as many hits to kill it, and survives as many of its hits, as its region's targets in the world's balance test; a magic attack meets the low magic defense most builds have, so it hits for less.
# Each map drops its own band's gear at normal rates and the next band's rarely; the cave bat's rare finds are the gear of levels 20 to 24, and only the keep drops the level 30 ★6 and ★7 pieces.
# attacks name the table's by family: slimes hop, the snail sprites charge, the mouse sprites bite and the fly sprites spit; an elite's reach is 1.5 times as far, a boss's about twice, and a boss adds a slam it alternates with.
# look is the client's art: a sprite from its table, an optional tint and an optional scale. elite: true marks a map's bigger mob, with 2 to 3 times its normal mob's hits and EXP and about twice its drops; a map with an elite has a normal mob too.
# boss: true marks a hunting map's field boss, which kills on the map bring to the spot its boss layer sets: two levels above the map's top, 3 times the size, twice the attack and 40 times the EXP of its top normal mob, which it drops the gear of at 10 times the chance, with potions. Its HP makes a fight alone about 3 minutes, and its family attack's cooldown, the table's or the shortest quarter second over it that does, keeps a melee player in reach within 30 of the band's potion over it.
# super_armor: true, on every elite and boss, keeps a mob from flinching, being pushed or knocked down, and its attacks go on whatever hits it.
hit_guard: 1500ms # after a mob's hit or MISS, no mob's attack hits the player for this long; a hit blinks for it
provoke: 5s # how long a mob a player hits follows them
sight: 300 # px either way a mob sees a player whose feet are level with its own or up to 96 px above; it comes after them, and keeps them until they're out of sight for 1 s
engage: [0ms, 400ms] # each time someone comes into a mob's reach, after nobody was, it waits a time rolled in this before a windup, so mobs that reach a player together don't attack as one
patrol: {speed_jitter: 0.15, pause: [600ms, 1400ms]} # each mob walks, chases and rushes at its own pace, 1 ± up to speed_jitter of its speed rolled at its spawn, and pauses at an edge for a time rolled in pause, so mobs that meet drift apart
react: {flinch: 300ms, push: 8, down_hits: 3, down_window: 1500ms, down: 1s, armor_after: 1s} # a blow that lands stops a mob without super armor and pushes it away; down_hits of them, each within down_window of the last, knock it down, and it gets up with super armor
attacks: # the attacks mobs use: a windup, the act (travel long), then recover; the cooldown counts from the start; power times the mob's attack. A mob names its own and may change any value but the kind.
  bite: {kind: front, windup: 600ms, reach: 24, recover: 300ms, cooldown: 2s, power: 1}
  hop: {kind: leap, windup: 600ms, distance: 72, travel: 400ms, spread: 12, recover: 300ms, cooldown: 2500ms, power: 1}
  charge: {kind: rush, windup: 800ms, distance: 128, travel: 400ms, recover: 600ms, cooldown: 3s, power: 1}
  spit: {kind: shot, windup: 600ms, range: 240, speed: 300, size: 12, recover: 300ms, cooldown: 2500ms, power: 1}
  slam: {kind: around, windup: 1000ms, spread: 48, recover: 600ms, cooldown: 5s, power: 1.5}
field_boss:
  life: 10m # a boss nobody beats leaves this long after it appears
  drop_share: 0.01 # the share of its HP a player's damage, or their party's, must reach for a drop roll
