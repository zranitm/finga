# Movement constants, which the client reads too; the vectors in testdata/movement pin them.
dt: 0.016666666666666666   # one sub-step: 1/60 s
walk_speed: 160            # px/s
jump_velocity: 395         # px/s
gravity: 1216              # px/s²
max_fall_speed: 720        # px/s
climb_speed: 112           # px/s
drop_through: 0.3125       # s a dropped-through platform is ignored
width: 24                  # character box, px
height: 56
casting_speed: 0.5         # walking and climbing while using a skill, as a share of the usual speed
