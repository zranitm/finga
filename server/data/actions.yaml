# How basic attacks and skills follow each other. An action keeps its player busy for its length; the other kind may cut it off from its cancel point on.
cancel: 0.3   # where an action's cancel point falls, as a share of its length, unless the action names its own: just after the strike
ready: 1      # where its look is back to ready, as a share of its length, unless the action names its own; the world ignores it
energy: {max: 10, per_attack: 2, per_block: 2}  # what skills cost: a basic attack that reaches a mob gives per_attack, and a block use's first blocked attack per_block, up to max
block: {arc: 180}  # what a block skill covers: the degrees round its user, centred on its aim
combat: 5s    # how long a player stays in combat after their last hit, miss, dodge or damage over time, dealt or taken; never in a town
