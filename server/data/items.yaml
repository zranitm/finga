# Item templates: tab is also the inventory tab (equip never stacks, use and etc stack to 100); every item has stars (1 to 7) and a description, and equipment names a slot kind, may need a class and a level, and gives a range per stat that each copy rolls once, when it drops (rates in tenths of a percent).
equip_slots: # the ten slots a character wears, in the character window's order; a kind fills every slot of that kind
  - {id: weapon, name: Weapon, kind: weapon}
  - {id: hat, name: Hat, kind: hat}
  - {id: top, name: Top, kind: top}
  - {id: bottom, name: Bottom, kind: bottom}
  - {id: gloves, name: Gloves, kind: gloves}
  - {id: shoes, name: Shoes, kind: shoes}
  - {id: necklace, name: Necklace, kind: necklace}
  - {id: earrings, name: Earrings, kind: earrings}
  - {id: ring_1, name: Ring, kind: ring}
  - {id: ring_2, name: Ring, kind: ring}
