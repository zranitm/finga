# The art kit as regions use it (large-regions.md section 3).
# grounds: the colours a region's ground is painted with, by name; the client's ground table is generated from them (npm run gen).
# models: each model's solid, which a scattered or set piece stands with: a cylinder or a box, its height above the ground at its centre; {} is looks only.
grounds:
  brick: '#9c5d4b'
  dirt: '#a88b62'
  grass: '#8cc265'
  sand: '#e2cf9a'
  snow: '#eef2f6'
  stone: '#6f6a63'
  water: '#5b8fc7'
models:
  boulder: {cylinder: {radius: 2.52, height: 2.31}}
  bush_round: {}
  cactus_flowering: {}
  cactus_flowers: {}
  cactus_round: {}
