# The wardrobe's pieces (docs/tech/outfits.md section 3): looks only, never stats. A piece's look is a key in the client's look table.
# A boss source puts the piece's item, piece.<id>, on that boss's drops, rolled on each eligible player's own roll.
# A rank source grants the piece outright, the first time the account reaches that rank in a rated mode; no item holds it.
# A quest source grants it outright with the quest's hand-in, as its rewards; no item holds it.
# The starter catalogue; the full one is designed with the user from the preview sheet (section 8).
pieces:
