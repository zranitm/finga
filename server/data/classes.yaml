# The class tree. The first class is its root: every character starts as one, with its base_stats and starter_items, and a promotion moves them to a class whose parent is theirs.
# look is the client's art: a model and an optional tint. attack is the basic attack's shape (skills.yaml), damage type and length (actions.yaml);
# it may name where its hit, cancel point and ready point fall, as shares of the length.
# skills are the ones it teaches (skills.yaml); a character learns those of its class and every class above it.
# chains are its skill chains (C18): a root's key turns into the first follow-up whose condition holds, `after` a root's hit, while the lock is
# `controlled` by a hard status or `far`, or `dodged` after a mob's attack passed through a dodge, or `blocked` after a block stopped one. A promoted class's chains replace the Beginner's.
# auto_assign is the split the Auto-assign button and setting spend a level's points by; the root has none, so a Beginner spends their own.
# promotion is what a character of the parent class needs, met at the trainer: a level, own stats without gear, points in skills and finished quests. The trainer then hands over weapon, the class's first.
classes:
  - id: beginner
    name: Beginner
    description: "Tries a bit of everything: a short swing, a thrown stone, a spark of magic."
    look: {model: barbarian}
    attack: {kind: arc, damage: physical, radius: 1.875, angle: 120, height: 1.5, length: 1050ms, ready: 0.85}
    base_stats: {str: 7, dex: 7, int: 7, agi: 7, vit: 7}
    starter_items:
      - {item: wooden_club, quantity: 1}
      - {item: red_potion, quantity: 5}
    skills: [strike, throw, spark, second_wind, lunge, roll_back, break_free, guard]
    chains:
      - {root: strike, follow: [{skill: lunge, when: {far: 3}}]}
      - {root: guard, follow: [{skill: strike, when: {blocked: 1500ms}}]}
      - {root: roll_back, follow: [{skill: break_free, when: {controlled_self: true}}, {skill: lunge, when: {dodged: 1500ms}}]}
  - id: warrior
    name: Warrior
    description: "Fights up close with a sword: tough, hard-hitting and hard to put down."
    parent: beginner
    look: {model: knight}
    attack: {kind: arc, damage: physical, radius: 2.375, angle: 120, height: 1.75, length: 900ms, ready: 0.85}
    auto_assign: {str: 3, vit: 2}
    skills: [slash_blast, iron_body, charge, ground_slam, war_cry, taunt, toughness, unyielding, bastion]
    chains:
      - root: strike
        follow:
          - {skill: ground_slam, when: {controlled: [stun, freeze]}}
          - {skill: charge, when: {far: 3}}
      - {root: roll_back, follow: [{skill: unyielding, when: {controlled_self: true}}, {skill: lunge, when: {dodged: 1500ms}}]}
      - {root: war_cry, follow: [{skill: iron_body, when: {after: 3s}}]}
      - {root: bastion, follow: [{skill: ground_slam, when: {blocked: 1500ms}}]}
    promotion: {trainer: warrior_trainer, level: 10, stats: {str: 30}, skills: {strike: 10}, quests: [warriors_trial], weapon: wooden_sword}
  - id: thief
    name: Thief
    description: "Fights up close with daggers: quick strikes, and dodges what comes back."
    parent: beginner
    look: {model: rogue, tint: 0x9a70d8}
    attack: {kind: arc, damage: physical, radius: 1.875, angle: 120, height: 1.5, length: 650ms, ready: 0.85}
    auto_assign: {str: 1, agi: 3, vit: 1}
    skills: [double_stab, haste, shadow_step, smoke_bomb, flurry, poison_blade, keen_edge, vanish, parry]
    chains:
      - root: double_stab
        follow:
          - {skill: flurry, when: {after: 2s}}
          - {skill: shadow_step, when: {far: 3}}
      - {root: smoke_bomb, follow: [{skill: vanish, when: {controlled_self: true}}, {skill: shadow_step, when: {dodged: 1500ms}}]}
      - {root: poison_blade, follow: [{skill: haste, when: {after: 3s}}]}
      - {root: parry, follow: [{skill: flurry, when: {blocked: 1500ms}}]}
    promotion: {trainer: thief_trainer, level: 10, stats: {agi: 30}, skills: {strike: 10}, quests: [thiefs_trial], weapon: rusty_dagger}
  - id: bowman
    name: Bowman
    description: "Fights from afar with a bow: long shots that land true."
    parent: beginner
    look: {model: rogue_hooded}
    attack: {kind: shot, damage: physical, range: 13.125, width: 0.6, length: 1050ms, ready: 0.85}
    auto_assign: {str: 2, dex: 2, agi: 1}
    skills: [power_shot, focus, disengage, pinning_shot, arrow_rain, eagle_eye, archery, recoil, deflect]
    chains:
      - {root: power_shot, follow: [{skill: arrow_rain, when: {controlled: [stun, freeze, pin, knockdown]}}]}
      - {root: disengage, follow: [{skill: recoil, when: {controlled_self: true}}, {skill: power_shot, when: {dodged: 1500ms}}]}
      - {root: focus, follow: [{skill: eagle_eye, when: {after: 3s}}]}
      - {root: deflect, follow: [{skill: power_shot, when: {blocked: 1500ms}}]}
    promotion: {trainer: bowman_trainer, level: 10, stats: {dex: 30}, skills: {throw: 10}, quests: [bowmans_trial], weapon: short_bow}
  - id: magician
    name: Magician
    description: "Fights from afar with magic: strong spells that hit hard."
    parent: beginner
    look: {model: mage, tint: 0xf0c060}
    attack: {kind: shot, damage: magic, range: 11.25, width: 0.6, length: 1250ms, ready: 0.85}
    auto_assign: {int: 3, dex: 1, vit: 1}
    skills: [fire_arrow, heal, blink, frost_nova, barrier, meteor, arcane_mind, arcane_release, ward]
    chains:
      - {root: fire_arrow, follow: [{skill: meteor, when: {controlled: [stun, freeze, pin, knockdown]}}]}
      - {root: frost_nova, follow: [{skill: meteor, when: {controlled: [stun, freeze]}}]}
      - {root: blink, follow: [{skill: arcane_release, when: {controlled_self: true}}, {skill: fire_arrow, when: {dodged: 1500ms}}]}
      - {root: heal, follow: [{skill: barrier, when: {after: 3s}}]}
      - {root: ward, follow: [{skill: frost_nova, when: {blocked: 1500ms}}]}
    promotion: {trainer: magician_trainer, level: 10, stats: {int: 30}, skills: {spark: 10}, quests: [magicians_trial], weapon: oak_wand}
