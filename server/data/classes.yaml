# Playable classes (Thief and Magician come in Stage 2): the attack's shape and damage type, auto_assign is the split the Auto-assign button and setting spend a level's points by, and starter_items are granted once, after the character is created.
classes:
  - id: warrior
    name: Warrior
    attack: {kind: melee, damage: physical, width: 64, height: 56, cooldown: 600ms}
    base_stats: {str: 7, dex: 7, int: 7, agi: 7, vit: 7}
    auto_assign: {str: 3, vit: 2}
    starter_items:
      - {item: wooden_sword, quantity: 1}
      - {item: red_potion, quantity: 5}
  - id: bowman
    name: Bowman
    attack: {kind: ranged, damage: physical, range: 420, cooldown: 800ms}
    base_stats: {str: 7, dex: 7, int: 7, agi: 7, vit: 7}
    auto_assign: {str: 2, dex: 2, agi: 1}
    starter_items:
      - {item: short_bow, quantity: 1}
      - {item: red_potion, quantity: 5}
