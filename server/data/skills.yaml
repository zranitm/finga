# Every skill. A class lists the skills it teaches in classes.yaml; a character learns those of its class and of every class above it.
# An active skill costs energy (actions.yaml) and has a cooldown; damage hits its shape's targets for power × the attack of its damage type, by the combat rules.
# A shape starts at the user's feet toward its aim, in metres: an arc of radius and angle (degrees) up to height above the feet, a shot's lane of width up to range, or an area of radius about the user.
# Using one keeps its player busy for its length (actions.yaml). It may name where its hit, cancel point and ready point fall,
# as shares of the length, and cancelable lets a basic attack cut it off from its cancel point.
# The cancelable ones name 0.45, so an attack cuts their second at 450 ms; movement stays free.
# A passive one adds its bonus, in the units items.yaml uses: rates in tenths of a percent, regen in tenths of a point a second.
# Each value is base + per_point × the points invested, once there is one.
# stages are the evolutions: the first at 0 points, the totals rising; a stage changes only what it names.
# icon is a game-icons.net path, author/name, whose SVG is in web/public/icons/skills; a stage may name its own.
skills:
  - id: strike
    icon: lorc/sword-wound
    kind: active
    effect: damage
    damage: physical
    shape: {kind: arc, radius: 2.375, angle: 120, height: 1.75}
    energy: 2
    cooldown: 4500ms
    length: 1000ms
    cancelable: true
    cancel: 0.45
    power: {base: 1.5, per_point: 0.05}
    stages:
      - {at: 0, name: Strike, description: "A strong swing at whatever stands in front."}
      - {at: 10, name: Heavy Strike, description: "A wider, harder swing.", power: {base: 2.2}, shape: {kind: arc, radius: 2.875, angle: 120, height: 1.75}, icon: lorc/sword-slice}
      - {at: 25, name: Crushing Blow, description: "A blow that crushes up to three foes at once.", power: {base: 3.0}, targets: 3, icon: lorc/hammer-drop}
  - id: throw
    icon: delapouite/throwing-ball
    kind: active
    effect: damage
    damage: physical
    shape: {kind: shot, range: 9.375, width: 0.6}
    energy: 2
    cooldown: 4500ms
    length: 1000ms
    cancelable: true
    cancel: 0.45
    power: {base: 1.3, per_point: 0.05}
    stages:
      - {at: 0, name: Throw, description: "Hurls a stone at the nearest foe ahead."}
      - {at: 10, name: Sling, description: "A slung stone that flies farther and lands harder.", power: {base: 1.9}, shape: {kind: shot, range: 11.875, width: 0.6}, icon: delapouite/slingshot}
      - {at: 25, name: Volley, description: "A spray of stones that strikes up to three foes.", power: {base: 2.5}, targets: 3, icon: lorc/thrown-charcoal}
  - id: spark
    icon: lorc/circle-sparks
    kind: active
    effect: damage
    damage: magic
    shape: {kind: shot, range: 6.875, width: 0.6}
    energy: 2
    cooldown: 5625ms
    length: 1000ms
    cancelable: true
    cancel: 0.45
    power: {base: 1.6, per_point: 0.06}
    stages:
      - {at: 0, name: Spark, description: "A crackle of magic at a foe close by."}
      - {at: 10, name: Bolt, description: "A bolt that reaches farther and hits harder.", power: {base: 2.3}, shape: {kind: shot, range: 9.375, width: 0.6}, icon: lorc/focused-lightning}
      - {at: 25, name: Arc, description: "Lightning that leaps across up to three foes.", power: {base: 3.0}, targets: 3, icon: lorc/lightning-branches}
