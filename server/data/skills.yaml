# Every skill. A class lists the skills it teaches in classes.yaml; a character learns those of its class and of every class above it.
# An active skill costs mp and has a cooldown; damage hits its shape's targets for power × the attack of its damage type, by the combat rules.
# Using one keeps its player busy for its length (actions.yaml); attack speed doesn't change it. It may name where its hit and cancel point fall,
# as shares of the length, and cancelable lets a basic attack cut it off from its cancel point.
# A passive one adds its bonus, in the units items.yaml uses: rates in tenths of a percent, regen in tenths of a point a second.
# Each value is base + per_point × the points invested, once there is one.
# stages are the evolutions: the first at 0 points, the totals rising; a stage changes only what it names.
skills:
  - id: strike
    kind: active
    effect: damage
    damage: physical
    shape: {kind: melee, width: 64, height: 56}
    mp: {base: 4, per_point: 0.2}
    cooldown: 4500ms
    length: 1500ms
    cancelable: true
    power: {base: 1.5, per_point: 0.05}
    stages:
      - {at: 0, name: Strike, description: "A strong swing at whatever stands in front."}
      - {at: 10, name: Heavy Strike, description: "A wider, harder swing.", power: {base: 2.2}, shape: {kind: melee, width: 80, height: 56}}
      - {at: 25, name: Crushing Blow, description: "A blow that crushes up to three foes at once.", power: {base: 3.0}, targets: 3}
  - id: throw
    kind: active
    effect: damage
    damage: physical
    shape: {kind: ranged, range: 300}
    mp: {base: 4, per_point: 0.2}
    cooldown: 4500ms
    length: 1500ms
    cancelable: true
    power: {base: 1.3, per_point: 0.05}
    stages:
      - {at: 0, name: Throw, description: "Hurls a stone at the nearest foe ahead."}
      - {at: 10, name: Sling, description: "A slung stone that flies farther and lands harder.", power: {base: 1.9}, shape: {kind: ranged, range: 380}}
      - {at: 25, name: Volley, description: "A spray of stones that strikes up to three foes.", power: {base: 2.5}, targets: 3}
  - id: spark
    kind: active
    effect: damage
    damage: magic
    shape: {kind: ranged, range: 220}
    mp: {base: 6, per_point: 0.3}
    cooldown: 5625ms
    length: 1500ms
    cancelable: true
    power: {base: 1.6, per_point: 0.06}
    stages:
      - {at: 0, name: Spark, description: "A crackle of magic at a foe close by."}
      - {at: 10, name: Bolt, description: "A bolt that reaches farther and hits harder.", power: {base: 2.3}, shape: {kind: ranged, range: 300}}
      - {at: 25, name: Arc, description: "Lightning that leaps across up to three foes.", power: {base: 3.0}, targets: 3}
  - id: second_wind
    kind: passive
    effect: bonus
    bonus: {hp_regen: {base: 5, per_point: 1}, mp_regen: {base: 5, per_point: 1}}
    stages:
      - {at: 0, name: Second Wind, description: "Catches breath faster: more HP and MP back every second."}
      - {at: 10, name: Deep Breath, description: "Breathes deeper still.", bonus: {hp_regen: {base: 10, per_point: 1}, mp_regen: {base: 10, per_point: 1}}}
  # Two placeholder skills per first class, learned after promotion, until the real sets are designed.
  # Each damage skill starts, at one point, about level with the Beginner form its promotion asks for at ten: another angle, never a step down.
  - id: slash_blast
    kind: active
    effect: damage
    damage: physical
    shape: {kind: melee, width: 96, height: 56}
    mp: {base: 6, per_point: 0.3}
    cooldown: 6750ms
    length: 1500ms
    cancelable: true
    power: {base: 1.4, per_point: 0.04}
    targets: 3
    stages:
      - {at: 0, name: Slash Blast, description: "A sweeping slash at up to three foes in front."}
  - id: iron_body
    kind: active
    effect: buff
    shape: {kind: area, radius: 48}
    mp: {base: 10, per_point: 0.5}
    cooldown: 60s
    length: 1500ms
    duration: 30s
    bonus: {physical_defense: {base: 20, per_point: 2}}
    stages:
      - {at: 0, name: Iron Body, description: "Hardens the body: more physical defense for a while."}
  - id: double_stab
    kind: active
    effect: damage
    damage: physical
    shape: {kind: melee, width: 56, height: 48}
    mp: {base: 5, per_point: 0.25}
    cooldown: 3375ms
    length: 1500ms
    cancelable: true
    power: {base: 2.0, per_point: 0.06}
    stages:
      - {at: 0, name: Double Stab, description: "Two quick stabs at the foe in front."}
  - id: haste
    kind: active
    effect: buff
    shape: {kind: area, radius: 48}
    mp: {base: 10, per_point: 0.5}
    cooldown: 40s
    length: 1500ms
    duration: 20s
    bonus: {attack_speed: {base: 80, per_point: 5}, evasion: {base: 10, per_point: 1}}
    stages:
      - {at: 0, name: Haste, description: "Moves quicker: faster attacks and more evasion for a while."}
  - id: power_shot
    kind: active
    effect: damage
    damage: physical
    shape: {kind: ranged, range: 460}
    mp: {base: 6, per_point: 0.3}
    cooldown: 4500ms
    length: 1500ms
    cancelable: true
    power: {base: 2.4, per_point: 0.06}
    stages:
      - {at: 0, name: Power Shot, description: "A drawn-back shot that flies far and hits hard."}
  - id: focus
    kind: active
    effect: buff
    shape: {kind: area, radius: 48}
    mp: {base: 10, per_point: 0.5}
    cooldown: 60s
    length: 1500ms
    duration: 30s
    bonus: {accuracy: {base: 20, per_point: 2}, crit_rate: {base: 50, per_point: 5}}
    stages:
      - {at: 0, name: Focus, description: "Steadies the aim: more accuracy and crit rate for a while."}
  - id: fire_arrow
    kind: active
    effect: damage
    damage: magic
    shape: {kind: ranged, range: 380}
    mp: {base: 9, per_point: 0.4}
    cooldown: 4500ms
    length: 1500ms
    cancelable: true
    power: {base: 2.8, per_point: 0.08}
    stages:
      - {at: 0, name: Fire Arrow, description: "A bolt of fire at the nearest foe ahead."}
  - id: heal
    kind: active
    effect: heal
    shape: {kind: area, radius: 150}
    mp: {base: 10, per_point: 0.5}
    cooldown: 4500ms
    length: 1500ms
    power: {base: 1.5, per_point: 0.05}
    targets: 3
    stages:
      - {at: 0, name: Heal, description: "Heals the caster and up to two hurt party members nearby."}
