# NPCs: each stands where one map's npcs list places it (maps/*.yaml). look is the client's art key, and lines are what it says when talked to; gives and takes list the quests it hands out and takes back, and must agree with quests.yaml. A trainer names the class it promotes to, whose promotion names it back, and gives that class's trial.
talk_reach: 1.875 # metres from the NPC's point to the player's middle
npcs:
  - id: town_guide
    name: Town Guide
    look: guide
    gives: [slime_cleanup, sticky_samples, meet_the_trainers, ready_for_the_wilds]
    takes: [slime_cleanup, sticky_samples, meet_the_trainers, ready_for_the_wilds]
  - id: warrior_trainer
    name: Warrior Trainer
    look: trainer_warrior
    trainer: warrior
    gives: [warriors_trial]
    takes: [warriors_trial]
  - id: magician_trainer
    name: Magician Trainer
    look: trainer_magician
    trainer: magician
    gives: [magicians_trial]
    takes: [magicians_trial]
  - id: bowman_trainer
    name: Bowman Trainer
    look: trainer_bowman
    trainer: bowman
    gives: [bowmans_trial]
    takes: [bowmans_trial]
  - id: thief_trainer
    name: Thief Trainer
    look: trainer_thief
    trainer: thief
    gives: [thiefs_trial]
    takes: [thiefs_trial]
  - id: oasis_guide
    name: Oasis Guide
    look: guide
    lines:
      - "Welcome to Palmwater. The spring here has never run dry."
      - "South, the river cuts the Sporewood Gorge, and a hollow full of moths opens under it."
      - "The dunes run east past the buttes, and the mesa stands north. Something old sleeps in the ruins beneath it."
      - "If you fall out there, you'll wake at the nearest waypoint."
  - id: mountain_guide
    name: Mountain Guide
    look: guide
    lines:
      - "Welcome to Emberhold. Warm your hands; the climb is cold."
      - "The Frost Trail circles the mountain's foot. The Icefall's cliffs are the way up."
      - "Past the glacier, Last Hearth keeps a fire for climbers. Above it stands the Fallen Keep, and few come back."
      - "If you fall out there, you'll wake at the nearest waypoint."
  - id: hearth_keeper
    name: Hearth Keeper
    look: guide
    lines:
      - "Come in from the wind. This is the last fire on the mountain."
      - "The keep's lord still walks his hall. Go up ready, or don't go up."
      - "The rime rats chew anything left outside. Keep your packs close."
