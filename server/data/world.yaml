# Each map's place on the world chart: x across and y down, 0 to 100. Links are drawn from the maps' portals.
# The towns sit near the middle: the first maps arc from the start town round to the crossroads, and its two roads go east, the desert's south of the snow's, the levels rising outward.
places:
  town:              [36, 66]
  forest:            [24, 60]
  cave:              [16, 46]
  shroom_grove:      [20, 32]
  spore_hollow:      [32, 22]
  toadstool_heights: [46, 30]
  crossroads:        [50, 50]
  dune_road:         [64, 58]
  sandstone_cliffs:  [76, 66]
  sunken_ruins:      [88, 74]
  frost_trail:       [64, 38]
  icefall:           [74, 28]
  glacier_peak:      [84, 20]
  fallen_keep:       [92, 10]

# The interest cell, in metres (large-regions.md section 5): a map's bodies are bucketed in squares this wide, so a mob reads only those near it.
interest:
  cell: 32

# A teleport from the world map channels this long before it takes the player; moving, acting or a landed hit cancels it. Over 0, at most 10s.
teleport:
  channel: 3s
