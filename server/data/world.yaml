# Each map's place on the world chart: x across and y down, 0 to 100. Links are drawn from the maps' portals.
# The three large regions, the levels rising from the south-west to the north-east: Willowmere, Sunreach beyond its north pass, and Hoarfell beyond Sunreach's east pass.
places:
  willowmere:        [26, 56]
  sunreach:          [38, 32]
  hoarfell:          [60, 26]

# The interest cells (large-regions.md section 5): a map is cut in squares cell metres wide, by which its bodies are bucketed, so a mob reads only those near it,
# and each player is sent the block of cells round theirs: rows behind (south) and ahead (north), as the camera always faces north, and columns to each side.
# From anywhere in their cell a player sees at least side × cell metres to each side (96), ahead × cell ahead (96) and behind × cell behind (32).
# No sight, attack, shot or skill may reach farther than the rows behind cover.
# Where more than crowd players stand in a cell and the eight round it, a player's steps of motion alone go every second tick (crowd × 4/5 or fewer to go back).
interest:
  cell: 32
  behind: 1
  ahead: 3
  side: 3
  crowd: 60

# A teleport from the world map channels this long before it takes the player; moving, acting or a landed hit cancels it. Over 0, at most 10s.
teleport:
  channel: 3s
