# Designed in 3D: a sandy road east between banks too steep to climb, from the crossroads' way in past the mice's rocks, between dunes every mob walks, through the Dune Baron's open basin and the scarabs' pillars to the way up to the sandstone cliffs.
name: Dune Road
kind: hunting
town: crossroads
levels: [21, 22]
look: {ground: sand, sky: desert}
size: [80, 36]
terrain:
  cell: 0.5
  hills:
    # dunes: no slope steeper than a walk, so mice, scarabs and the Baron climb them as players do
    - {at: [24, 27], radius: 6.5, height: 2.2}
    - {at: [34, 8.5], radius: 6, height: 2}
    - {at: [62, 26.5], radius: 5.5, height: 1.6}
  mesas:
    # the banks: sand too steep to climb
    - {area: [-5, 31, 90, 10], height: 3, edge: 0.5}
    - {area: [-5, -6, 90, 10], height: 3, edge: 0.5}
    # the ways in and out
    - {area: [-5, 4, 8, 10], height: 3, edge: 0.5}
    - {area: [-5, 22, 8, 9], height: 3, edge: 0.5}
    - {area: [77, 4, 8, 10], height: 3, edge: 0.5}
    - {area: [77, 22, 8, 9], height: 3, edge: 0.5}
solids:
  # rocks set into the banks, centred on the foot so each meets the bank square: a sharper corner hides a player from a scarab
  - {cylinder: [12, 30.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [48, 30.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [70, 30.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [22, 4.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [52, 4.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [70, 4.5], radius: 2.33, height: 3.52, model: sandstone_wall}
  # pillars on the road, too tall to stand on, each more than the Baron's 5.25 m from anything else
  - {cylinder: [29, 17.5], radius: 1.6, height: 4.5, model: sandstone_pillar}
  - {cylinder: [60, 18], radius: 1.6, height: 4.5, model: sandstone_pillar}
  # the west, beyond every scarab's leash and the Baron's: a boulder past standing on, and two rocks to stand on
  - {cylinder: [16, 9], radius: 2.52, height: 2.31, model: sandstone_boulder}
  - {cylinder: [8, 26], radius: 0.7, height: 1.13, model: sandstone_small}
  - {cylinder: [17, 24], radius: 0.7, height: 1.13, model: sandstone_small}
