  - {cylinder: [30, 66], radius: 2.33, height: 3.52, model: rock_wall}
  - {cylinder: [110, 66], radius: 2.33, height: 3.52, model: rock_wall}
  # the middle point's four columns, every gap wider than three bodies
  - {cylinder: [63, 38], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [77, 38], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [63, 52], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [77, 52], radius: 1.6, height: 4.5, model: pillar}
