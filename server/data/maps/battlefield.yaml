# The 15v15 battle's map (docs/tech/pvp.md sections 3 and 7): 140 m by 90 m, each side's base in a cliff-walled bay at its end, shut by a gate during prep, and three points along the middle: west, middle and east, 10 m across.
# West and east mirror each other about x = 70, so no point is nearer one base than the other. Hills and ruins of the keep's and the desert's art break the lines between them.
name: Battlefield
kind: pvp
look: {ground: sand, sky: day}
size: [140, 90]
terrain:
  cell: 0.5
  hills:
    # low rises on the flanks, walked over, that hide a body behind them; a shallow mound by the middle point
    - {at: [50, 16], radius: 14, height: 2.5}
    - {at: [90, 16], radius: 14, height: 2.5}
    - {at: [50, 74], radius: 14, height: 2.5}
    - {at: [90, 74], radius: 14, height: 2.5}
    - {at: [60, 45], radius: 7, height: 1}
    - {at: [80, 45], radius: 7, height: 1}
  mesas:
    # each base's bay, 30 m across: cliffs north and south of it from the map's end to the gate, too steep to climb and higher than a jump, and low enough that the camera, looking north, sees the whole base over the south one
    - {area: [-5, -5, 29, 35], height: 3, edge: 0.5}
    - {area: [116, -5, 29, 35], height: 3, edge: 0.5}
    - {area: [-5, 60, 29, 35], height: 3, edge: 0.5}
    - {area: [116, 60, 29, 35], height: 3, edge: 0.5}
solids:
  # the west point's ruin: a fallen tower's columns and a boulder, kept out of the point's circle, and its mirror
  - {cylinder: [33, 38], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [107, 38], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [43, 52], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [97, 52], radius: 1.6, height: 4.5, model: pillar}
  - {cylinder: [45, 37], radius: 2.52, height: 2.31, model: boulder}
  - {cylinder: [95, 37], radius: 2.52, height: 2.31, model: boulder}
  # the walls between the points, cover for a side crossing the open middle, and its mirror
  - {cylinder: [55, 29], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [85, 29], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [55, 61], radius: 2.33, height: 3.52, model: sandstone_wall}
  - {cylinder: [85, 61], radius: 2.33, height: 3.52, model: sandstone_wall}
