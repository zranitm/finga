# The desert region's plan (large-regions.md step 9), wet in the south-west and dry in the north-east, as the user agreed on 2026-11-28.
# You arrive from Willowmere's north pass into the Sporewood Gorge, a shaded river valley of giant mushrooms (the old mushroom woods' mobs), with Spore Hollow below it.
# The river comes down from the western mountains along the foot of the ledges and south through the gorge; Palmwater, the main town in the middle, sits by a spring-fed oasis lake. Up on the west terraces are the Toadstool Ledges; east are the Amber Dunes; north is the Sandstone mesa, with the Sunken Ruins under it and the pass on to the Crossroads.
# Mobs keep their looks and attacks and move down to the levels below. Areas sit on 4 m lines; the interior is 72 to 952 on both axes.
