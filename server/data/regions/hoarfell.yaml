# The snow region's plan (large-regions.md step 9): a mountain climbed from the south-west to the Fallen Keep on its summit in the north-east.
# You arrive from Sunreach's East Pass into Emberhold, the village at the mountain's foot. The Frost Trail's pines and snowfields wrap the south and west;
# the Icefall is a terrace 12 m up, its cliffs blue ice; the Glacier is 12 m higher again, with the Last Hearth lodge at its top; the Keep's summit is 10 m above that.
# The old snow maps' mobs and the keep's keep their levels from the desert build: 23 to 30, then 31 to 35 in the keep. Areas sit on 4 m lines; the interior is 72 to 952.
