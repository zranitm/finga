# Committed defaults, nothing secret: FINGA_<KEY_PATH> (FINGA_GATEWAY) overrides a key, and CONFIG_PATH or a git-ignored config.local.yaml beside this file replaces it.
# make testers runs it in the stack's own network, where infra/docker-compose.yml points these at the services.

data_dir: data
gateway: http://localhost:8080
remote: false            # true allows a gateway that isn't loopback or a Compose service
password: testers-only   # every test account's; README lists them
dependencies:            # the services the seed writes through where no player path exists
  account: localhost:9001
  character: localhost:9002
  item: localhost:9003
