# The smallest region a bake makes: one map tile, four chunks, a road and some trees.
name: Tiny
size: [128, 128]
cell: 2
seed: 3
look: {sky: day}
ground: {noise: {scale: 60, amplitude: 2, octaves: 2}}
edge: {width: 12, height: [6, 9], biome: meadow}
colour: {slope: 0.25, high: 20}
features:
  - {road: {path: [[20, 64], [108, 64]], width: 4}}
areas:
  - {id: field, name: Field, area: [[10, 10], [118, 10], [118, 118], [10, 118]], levels: [1, 2], biome: meadow, kind: hunting,
     boss: {at: [64, 90], radius: 4, mob: king_slime}}
waypoints:
  - {id: field, name: Field, at: [30, 64]}
start: {at: [30, 60], yaw: 0}
biomes:
  meadow:
    colours: {flat: grass, slope: dirt, steep: stone, high: snow}
    scatter:
      - {model: tree_oak, spacing: 8, away: {road: 2}}
