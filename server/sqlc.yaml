# sqlc: one entry per service with tables. Each service's queries live in
# its repository layer's queries/ folder (services/<service>/internal/repository/,
# page 11; services/<service>/internal/<module>/ until the service moves) and
# generate into the repository's internal/db package, which Go lets only the
# repository import. `make gen` runs it.
# Each entry's schema is its own service's migrations (goose files; sqlc
# ignores the Down sections), so a query is checked against the real tables
# and cannot read another service's (Low-level design, page 10).
version: "2"
sql:
  - engine: postgresql
    schema: services/account/migrations
    queries: services/account/internal/repository/queries
    gen:
      go:
        package: db
        out: services/account/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: services/character/migrations
    queries: services/character/internal/repository/queries
    gen:
      go:
        package: db
        out: services/character/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: services/item/migrations
    queries: services/item/internal/repository/queries
    gen:
      go:
        package: db
        out: services/item/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
