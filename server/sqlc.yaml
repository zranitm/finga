# One entry per module with tables, generating into its repository's internal/db; each schema is only that module's files of the one migration sequence, so a query cannot read another's tables, and internal/migration's tests hold the lists to the files.
version: "2"
sql:
  - engine: postgresql
    schema:
      - internal/migration/00001_account.sql
    queries: internal/repository/account/queries
    gen:
      go:
        package: db
        out: internal/repository/account/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
          - column: "*.created_at"
            go_type: finga/pkg/dbx.Stamp
          - column: "*.updated_at"
            go_type: finga/pkg/dbx.Stamp
  - engine: postgresql
    schema:
      - internal/migration/00002_character.sql
      - internal/migration/00003_character_skill_bar.sql
      - internal/migration/00004_character_skill_timers.sql
      - internal/migration/00005_character_energy.sql
      - internal/migration/00006_character_z_and_yaw.sql
      - internal/migration/00010_character_skill_traits.sql
      - internal/migration/00011_character_skill_bar_eight.sql
    queries: internal/repository/character/queries
    gen:
      go:
        package: db
        out: internal/repository/character/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema:
      - internal/migration/00007_item.sql
      - internal/migration/00008_item_no_attack_speed.sql
      - internal/migration/00009_item_no_mp.sql
      - internal/migration/00013_item_outfit.sql
    queries: internal/repository/item/queries
    gen:
      go:
        package: db
        out: internal/repository/item/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema:
      - internal/migration/00012_pvp.sql
      - internal/migration/00014_pvp_builds.sql
    queries: internal/repository/pvp/queries
    gen:
      go:
        package: db
        out: internal/repository/pvp/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
