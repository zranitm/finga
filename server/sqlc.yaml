# One entry per service with tables, generating into its repository's internal/db; each schema is only that service's migrations, so a query cannot read another's tables.
version: "2"
sql:
  - engine: postgresql
    schema: modules/account/migrations
    queries: modules/account/internal/repository/queries
    gen:
      go:
        package: db
        out: modules/account/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
          - column: "*.created_at"
            go_type: finga/pkg/dbx.Stamp
          - column: "*.updated_at"
            go_type: finga/pkg/dbx.Stamp
  - engine: postgresql
    schema: modules/character/migrations
    queries: modules/character/internal/repository/queries
    gen:
      go:
        package: db
        out: modules/character/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: modules/item/migrations
    queries: modules/item/internal/repository/queries
    gen:
      go:
        package: db
        out: modules/item/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
