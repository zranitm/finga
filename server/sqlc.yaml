# sqlc: one entry per module. Each module's queries live in its queries/
# folder (internal/application/<module>/ until the module moves to its
# service, services/<service>/internal/<module>/ after) and generate into
# that module's internal/db package, which Go lets only the module import. `make gen` runs it.
# Each entry's schema is its own service's migrations (goose files; sqlc
# ignores the Down sections), so a query is checked against the real tables
# and cannot read another service's (Low-level design, page 10).
version: "2"
sql:
  - engine: postgresql
    schema: services/account/migrations
    queries: services/account/internal/account/queries
    gen:
      go:
        package: db
        out: services/account/internal/account/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
  - engine: postgresql
    schema: services/character/migrations
    queries: internal/application/character/queries
    gen:
      go:
        package: db
        out: internal/application/character/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: services/item/migrations
    queries: services/item/internal/item/queries
    gen:
      go:
        package: db
        out: services/item/internal/item/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
