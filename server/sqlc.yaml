# One entry per module with tables, generating into its repository's internal/db; each schema is only that module's migrations, so a query cannot read another's tables.
version: "2"
sql:
  - engine: postgresql
    schema: internal/modules/account/migrations
    queries: internal/modules/account/internal/repository/queries
    gen:
      go:
        package: db
        out: internal/modules/account/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
          - column: "*.created_at"
            go_type: finga/pkg/dbx.Stamp
          - column: "*.updated_at"
            go_type: finga/pkg/dbx.Stamp
  - engine: postgresql
    schema: internal/modules/character/migrations
    queries: internal/modules/character/internal/repository/queries
    gen:
      go:
        package: db
        out: internal/modules/character/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
  - engine: postgresql
    schema: internal/modules/item/migrations
    queries: internal/modules/item/internal/repository/queries
    gen:
      go:
        package: db
        out: internal/modules/item/internal/repository/internal/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides: *overrides
