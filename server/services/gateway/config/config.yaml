# Committed defaults, nothing secret. Override a key as FINGA_<KEY_PATH> (FINGA_HTTP_ADDR);
# CONFIG_PATH or a git-ignored config.local.yaml beside this file replaces it.

http:
  addr: ":8080"
  cors_origins: []      # browser origins allowed for REST and WebSocket; empty: same origin only
shutdown_grace: 10s
log:
  level: info
  format: json            # or console: coloured lines for a terminal
  source: false           # add each call's file:line
  sampling:               # each message at each level per second: the first 100, then every 100th
    initial: 100
    thereafter: 100
dependencies:            # where this service dials the ones it calls
  account: localhost:9001
  character: localhost:9002
  item: localhost:9003
  world: localhost:9004
  social: localhost:9005
