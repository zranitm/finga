# Committed defaults, nothing secret: FINGA_<KEY_PATH> (FINGA_DEPENDENCIES_ITEM) overrides a key, and CONFIG_PATH or a git-ignored config.local.yaml beside this file replaces it.

grpc:
  listen: ":9004"
ops:
  addr: ":9104"         # /healthz, /readyz, /metrics
shutdown_grace: 10s
log:
  level: info
  format: json            # or console: coloured lines for a terminal
  source: false           # add each call's file:line
  sampling:               # each message at each level per second: the first 100, then every 100th
    initial: 100
    thereafter: 100
tracing:
  otlp_endpoint: ""      # host:port of an OTLP gRPC collector; empty keeps trace IDs for the logs only
data_dir: data           # the game data, relative to server/
tick_rate_hz: 20         # a whole number of movement steps per tick (data/movement.yaml dt); the gateway admits 30 inputs a second
checkpoint_interval: 30s
flush_timeout: 10s       # the last saves on shutdown, all together; after shutdown_grace
item_calls:
  workers: 8             # the pool that runs the calls to the item service off the tick
  batch_max: 32          # drops one grant call may carry, at most the item service's 32
dependencies:            # where this service dials the ones it calls
  character: localhost:9002
  item: localhost:9003
  social: localhost:9005
