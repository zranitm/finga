# Committed defaults, nothing secret. Override a key as FINGA_<KEY_PATH> (FINGA_LOG_LEVEL);
# CONFIG_PATH or a git-ignored config.local.yaml beside this file replaces it.

grpc:
  listen: ":9005"
ops:
  addr: ":9105"         # /healthz, /readyz, /metrics
shutdown_grace: 10s
log:
  level: info
  format: json            # or console: coloured lines for a terminal
  source: false           # add each call's file:line
  sampling:               # each message at each level per second: the first 100, then every 100th
    initial: 100
    thereafter: 100
tracing:
  otlp_endpoint: ""      # host:port of an OTLP gRPC collector; empty keeps trace IDs for the logs only
