# golangci-lint v2; `make lint` runs it.
version: "2"

linters:
  default: standard
  enable:
    - depguard     # import direction: composition roots -> services -> the shared kernel -> pkg
    - errorlint
    - forbidigo    # every UUID is minted by pkg/uuidv7
    - gochecksumtype # a type switch over a //sumtype:decl interface names every case
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        below-cmd:
          files: ["**/internal/**", "**/pkg/**"]
          deny:
            - pkg: finga/cmd
              desc: only a binary and the tests import its composition root
            - pkg: finga/modules/gateway/app
              desc: only a binary and the tests import the gateway's composition root
        pkg:
          files: ["**/pkg/**"]
          deny:
            - pkg: finga/internal
              desc: pkg never imports internal
            - pkg: finga/modules
              desc: pkg never imports a service
        # Test support, the *test packages: only tests import it, and cmd/pgtest, the tool that runs a test run's Postgres.
        test-support:
          files: ["$all", "!$test", "!**/cmd/pgtest/**"]
          deny:
            - pkg: finga/pkg/pgtest
              desc: test support; only tests import it
            - pkg: finga/pkg/runner/runnertest
              desc: test support; only tests import it
            - pkg: finga/pkg/copytest
              desc: test support; only tests import it
            - pkg: finga/pkg/observability/metrics/promtest
              desc: test support; only tests import it
            - pkg: finga/modules/item/itemtest
              desc: test support; only tests import it
            - pkg: finga/modules/world/worldtest
              desc: test support; only tests import it
            - pkg: finga/pkg/outbox/outboxpg/outboxpgtest
              desc: test support; only tests import it
            - pkg: finga/pkg/idempotency/idempotencypg/idempotencypgtest
              desc: test support; only tests import it
        # The shared kernel: code several services run, below every service and never sent between them.
        kernel:
          files: ["**/internal/kernel/**", "**/internal/gamedata/**", "**/internal/sim/**", "**/internal/progression/**"]
          deny:
            - pkg: finga/modules
              desc: the shared kernel is below every service
            - pkg: finga/api/gen
              desc: the shared kernel is code both sides run, never a contract type
            - pkg: finga/internal/protocol
              desc: the shared kernel is below protocol
            - pkg: github.com/prometheus/client_golang
              desc: the shared kernel records no metrics; the services and the libraries' observers do
            - pkg: finga/internal/host
              desc: the shared kernel takes plain values, never configuration or the host
            - pkg: net/http
              desc: the shared kernel knows no transport
            - pkg: github.com/jackc/pgx
              desc: the shared kernel knows no database
            - pkg: finga/pkg/dbx
              desc: the shared kernel knows no database
        # A module's inner layers are business logic; only the gateway's handler speaks a contract, and HTTP.
        modules:
          files: ["**/modules/*/internal/**", "!**/modules/*/internal/handler/**", "!**/modules/*/internal/metrics/**", "!**/modules/*/internal/local/*_test.go"] # an in-process adapter's test builds the module it adapts on a host
          deny:
            - pkg: net/http
              desc: a module knows no transport; the gateway's handler speaks HTTP and gives each failure its status
            - pkg: finga/modules/gateway/internal/metrics
              desc: a module declares observer interfaces; its service's metrics implement them
            - pkg: finga/modules/world/internal/metrics
              desc: a module declares observer interfaces; its service's metrics implement them
            - pkg: finga/modules/account/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/modules/gateway/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/modules/item/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/modules/social/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/modules/world/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/internal/host
              desc: a module knows nothing of how its process runs
        modules-no-contracts:
          files: ["**/modules/*/internal/**", "!**/modules/*/internal/handler/**"]
          deny:
            - pkg: finga/api/gen
              desc: a module returns its own types; the gateway's handler turns them into the client protocol's
        services-no-client-protocol:
          files: ["**/modules/**", "!**/modules/gateway/**"]
          deny:
            - pkg: finga/api/gen/client
              desc: only the gateway speaks the client protocol
            - pkg: finga/internal/protocol
              desc: only the gateway speaks the client protocol
        # The gateway's model and use cases know no socket and no HTTP; the handlers adapt both.
        gateway-application:
          files: ["**/modules/gateway/internal/model/**", "**/modules/gateway/internal/application/**"]
          deny:
            - pkg: finga/pkg/wsconn
              desc: the WebSocket handler adapts the socket to the application's Conn
            - pkg: finga/pkg/wsrouter
              desc: the WebSocket handler routes messages to the use cases; the application exposes the use cases
            - pkg: golang.org/x/time/rate
              desc: per-message rate limits are the WebSocket handler's
            - pkg: finga/modules/gateway/internal/handler
              desc: the handler calls the application, never the reverse
            - pkg: finga/internal/protocol
              desc: the client protocol is the WebSocket handler's alone; the model has its own views
        # The world's domains (mobs, loot, party, itemcalls) know no map actor; the actor knows no World.
        world-domains:
          files: ["**/modules/world/internal/application/mobs/**", "**/modules/world/internal/application/loot/**", "**/modules/world/internal/application/party/**", "**/modules/world/internal/application/itemcalls/**"]
          deny:
            - pkg: finga/modules/world/internal/application/instance
              desc: a domain runs inside a map; the map's actor calls it, never the reverse
            - pkg: finga/modules/world/internal/application/world
              desc: a domain runs inside a map; the World is above both
        world-instance:
          files: ["**/modules/world/internal/application/instance/**"]
          deny:
            - pkg: finga/modules/world/internal/application/world
              desc: the World runs the maps; a map knows only its Mover
        # Only a service's repository layer and sqlc's output talk to the database.
        services-no-sql:
          files: ["**/modules/*/internal/**", "!**/internal/repository/**", "!**/internal/db/**", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: only the repository layer talks to the database
            - pkg: finga/pkg/dbx
              desc: only the repository layer opens transactions
        # A service's layers import inward, to model; depguard has no wildcard, so each rule names every service.
        layer-model:
          files: ["**/modules/*/internal/model/**"]
          deny:
            - pkg: finga/modules/account/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/character/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/gateway/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/item/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/social/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/world/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/modules/account/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/character/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/gateway/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/item/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/social/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/world/internal/repository
              desc: model knows no storage
            - pkg: finga/modules/gateway/internal/handler
              desc: model knows no transport
        layer-application:
          files: ["**/modules/*/internal/application/**"]
          deny:
            - pkg: finga/modules/account/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/character/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/gateway/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/item/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/social/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/world/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/modules/gateway/internal/handler
              desc: the handler calls application, never the reverse
        layer-repository:
          files: ["**/modules/*/internal/repository/**"]
          deny:
            - pkg: finga/modules/gateway/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/api/gen
              desc: the repository maps rows to model's types, never to the contract's
        # A handler's tests may wire the real application and adapters over fake modules.
        layer-handler:
          files: ["**/modules/*/internal/handler/**", "!$test"]
          deny:
            - pkg: finga/modules/account/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/modules/character/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/modules/gateway/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/modules/item/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/modules/social/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/modules/world/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: github.com/jackc/pgx
              desc: the handler never touches the database
            - pkg: finga/pkg/dbx
              desc: the handler never touches the database
        gateway-no-database:
          files: ["**/modules/gateway/**"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: the gateway holds no database
            - pkg: finga/pkg/dbx
              desc: the gateway holds no database
            - pkg: finga/pkg/outbox
              desc: the gateway holds no database
            - pkg: finga/pkg/idempotency
              desc: the gateway holds no database
            - pkg: finga/pkg/pgtest
              desc: the gateway's tests need no database
        # Go's internal/ rule covers a module's internals; these keep another module to its facade (its config and app too).
        gateway-alone:
          files: ["**/modules/gateway/**"]
          deny:
            - pkg: finga/modules/account/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/character/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/item/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/social/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/world/
              desc: a module meets another at its facade, the root package, never below it
        account-alone:
          files: ["**/modules/account/**"]
          deny:
            - pkg: finga/modules/character/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/gateway/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/item/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/social/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/world/
              desc: a module meets another at its facade, the root package, never below it
        character-alone:
          files: ["**/modules/character/**"]
          deny:
            - pkg: finga/modules/account/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/gateway/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/item/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/social/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/world/
              desc: a module meets another at its facade, the root package, never below it
        item-alone:
          files: ["**/modules/item/**"]
          deny:
            - pkg: finga/modules/account/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/character/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/gateway/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/social/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/world/
              desc: a module meets another at its facade, the root package, never below it
        world-alone:
          files: ["**/modules/world/**"]
          deny:
            - pkg: finga/modules/account/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/character/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/gateway/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/item/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/social/
              desc: a module meets another at its facade, the root package, never below it
        social-alone:
          files: ["**/modules/social/**"]
          deny:
            - pkg: finga/modules/account/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/character/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/gateway/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/item/
              desc: a module meets another at its facade, the root package, never below it
            - pkg: finga/modules/world/
              desc: a module meets another at its facade, the root package, never below it
        # Only a module's in-process adapters, internal/local, call another module, and the gateway's app wires them; depguard has no wildcard, so each rule names every other.
        gateway-facades:
          files: ["**/modules/gateway/**", "!**/modules/gateway/internal/local/**", "!**/modules/gateway/app/**", "!**/modules/gateway/internal/handler/**/*_test.go"] # a handler test fakes the modules behind the production adapters
          deny:
            - pkg: finga/modules/account
              desc: only internal/local, the in-process adapters, and app call another module
            - pkg: finga/modules/character
              desc: only internal/local, the in-process adapters, and app call another module
            - pkg: finga/modules/item
              desc: only internal/local, the in-process adapters, and app call another module
            - pkg: finga/modules/world
              desc: only internal/local, the in-process adapters, and app call another module
            - pkg: finga/modules/social
              desc: only internal/local, the in-process adapters, and app call another module
        account-facades:
          files: ["**/modules/account/**", "!**/modules/account/internal/local/**"]
          deny:
            - pkg: finga/modules/character
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/item
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/world
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/social
              desc: only internal/local, the in-process adapters, calls another module
        character-facades:
          files: ["**/modules/character/**", "!**/modules/character/internal/local/**"]
          deny:
            - pkg: finga/modules/account
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/item
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/world
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/social
              desc: only internal/local, the in-process adapters, calls another module
        item-facades:
          files: ["**/modules/item/**", "!**/modules/item/internal/local/**"]
          deny:
            - pkg: finga/modules/account
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/character
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/world
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/social
              desc: only internal/local, the in-process adapters, calls another module
        world-facades:
          files: ["**/modules/world/**", "!**/modules/world/internal/local/**"]
          deny:
            - pkg: finga/modules/account
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/character
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/item
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/social
              desc: only internal/local, the in-process adapters, calls another module
        social-facades:
          files: ["**/modules/social/**", "!**/modules/social/internal/local/**"]
          deny:
            - pkg: finga/modules/account
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/character
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/item
              desc: only internal/local, the in-process adapters, calls another module
            - pkg: finga/modules/world
              desc: only internal/local, the in-process adapters, calls another module
        # The modules meet in process; gRPC is left only inside the OTLP exporter's transport.
        no-grpc:
          files: ["$all"]
          deny:
            - pkg: google.golang.org/grpc
              desc: the modules meet in process, through their facades
        support:
          files: ["**/internal/protocol/**", "**/internal/host/**"]
          deny:
            - pkg: finga/modules
              desc: support packages never import a service
        gin-at-the-edge:
          files: ["$all", "!**/modules/gateway/internal/handler/**", "!**/modules/gateway/app/**"]
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: Gin stays in the gateway's handlers and composition root
        zap-behind-slog:
          files: ["$all", "!**/pkg/observability/logger/**"]
          deny:
            - pkg: go.uber.org/zap
              desc: everything logs through log/slog; zap is pkg/observability/logger's backend
        # The configuration is its keys and checks: the host's sections, the database's and the log's, and the root file's modules' sections.
        config:
          list-mode: strict
          files: ["**/modules/*/config/**", "**/cmd/migrate/config/**", "**/server/config/**", "!$test"]
          allow:
            - $gostd
            - finga/internal/host
            - finga/modules/account/config
            - finga/modules/gateway/config
            - finga/modules/item/config
            - finga/modules/social/config
            - finga/modules/world/config
            - finga/pkg/dbx
            - finga/pkg/idempotency
            - finga/pkg/observability/logger
            - finga/pkg/observability/tracing
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^uuid\.New
          pkg: ^github\.com/google/uuid$
          msg: mint UUIDs with finga/pkg/uuidv7, so every ID is a UUIDv7
    sloglint:
      static-msg: true
      kv-only: true
      no-global: all
      context: scope
      key-naming-case: snake
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]
      - path: pkg/uuidv7/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
