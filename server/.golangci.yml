# golangci-lint v2; `make lint` runs it.
version: "2"

linters:
  default: standard
  enable:
    - depguard     # import direction: composition roots -> modules -> the shared kernel -> pkg
    - errorlint
    - forbidigo    # every UUID is minted by pkg/uuidv7
    - gochecksumtype # a type switch over a //sumtype:decl interface names every case
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        below-cmd:
          files: ["**/internal/shared/**", "**/internal/application/*/*/**", "**/internal/application/{account,character,item,pvp,social}/*.go", "!**/internal/application/account/account.go", "!**/internal/application/character/character.go", "!**/internal/application/item/item.go", "!**/internal/application/pvp/pvp.go", "!**/internal/application/social/social.go", "**/internal/model/**", "**/internal/repository/**", "**/internal/handler/**", "**/internal/metrics/**", "**/internal/adapter/**", "**/cmd/internal/**", "**/pkg/**"]
          deny:
            - pkg: finga/cmd
              desc: only a binary and the tests import its composition root
            - pkg: finga/internal/dependencies
              desc: only a binary and the tests import the wiring
        pkg:
          files: ["**/pkg/**"]
          deny:
            - pkg: finga/internal
              desc: pkg never imports the game's code
            - pkg: finga/config
              desc: pkg never imports the game's configuration
        # Test support, the *test packages: only tests import it, and cmd/pgtest, the tool that runs a test run's Postgres; e2etest builds on the others.
        test-support:
          files: ["$all", "!$test", "!**/cmd/pgtest/**", "!**/server/test/e2etest/**", "!**/internal/repository/dbtest/**"]
          deny:
            - pkg: finga/pkg/pgtest
              desc: test support; only tests import it
            - pkg: finga/pkg/runner/runnertest
              desc: test support; only tests import it
            - pkg: finga/pkg/copytest
              desc: test support; only tests import it
            - pkg: finga/pkg/observability/metrics/promtest
              desc: test support; only tests import it
            - pkg: finga/internal/repository/item/itemtest
              desc: test support; only tests import it
            - pkg: finga/internal/application/world/worldtest
              desc: test support; only tests import it
            - pkg: finga/pkg/outbox/outboxpg/outboxpgtest
              desc: test support; only tests import it
            - pkg: finga/pkg/idempotency/idempotencypg/idempotencypgtest
              desc: test support; only tests import it
            - pkg: finga/test/e2etest
              desc: test support; only tests import it
        # The shared kernel: code several modules run, below every module and never sent between them.
        kernel:
          files: ["**/internal/shared/kernel/**", "**/internal/shared/gamedata/**", "**/internal/shared/sim/**", "**/internal/shared/progression/**"]
          deny:
            - pkg: finga/internal/application
              desc: the shared kernel is below every module
            - pkg: finga/internal/model
              desc: the shared kernel is below every module
            - pkg: finga/internal/repository
              desc: the shared kernel is below every module
            - pkg: finga/internal/handler
              desc: the shared kernel is below every module
            - pkg: finga/internal/metrics
              desc: the shared kernel is below every module
            - pkg: finga/internal/adapter
              desc: the shared kernel is below every module
            - pkg: finga/internal/dependencies
              desc: the shared kernel is below every module
            - pkg: finga/internal/migration
              desc: the shared kernel is below every module
            - pkg: finga/config
              desc: the shared kernel takes plain values, never configuration
            - pkg: finga/api/gen
              desc: the shared kernel is code both sides run, never a contract type
            - pkg: finga/internal/shared/protocol
              desc: the shared kernel is below protocol
            - pkg: github.com/prometheus/client_golang
              desc: the shared kernel records no metrics; the modules and the libraries' observers do
            - pkg: finga/internal/shared/host
              desc: the shared kernel takes plain values, never configuration or the host
            - pkg: net/http
              desc: the shared kernel knows no transport
            - pkg: github.com/jackc/pgx
              desc: the shared kernel knows no database
            - pkg: finga/pkg/dbx
              desc: the shared kernel knows no database
        # A module's inner layers, below its facade, are business logic; an adapter's test builds the module it adapts on a host.
        modules:
          files: ["**/internal/application/*/*/**", "**/internal/application/{account,character,item,pvp,social}/*.go", "!**/internal/application/account/account.go", "!**/internal/application/character/character.go", "!**/internal/application/item/item.go", "!**/internal/application/pvp/pvp.go", "!**/internal/application/social/social.go", "**/internal/model/**", "**/internal/repository/**", "**/internal/adapter/**", "!**/internal/adapter/*/*_test.go", "!**/internal/application/*/errortable_test.go"]
          deny:
            - pkg: net/http
              desc: a module knows no transport; its handler speaks HTTP and gives each failure its status
            - pkg: finga/internal/metrics
              desc: a module declares observer interfaces; its own metrics package implements them
            - pkg: finga/config
              desc: a module takes option structs; its facade is given its section, and the wiring fills it from configuration
            - pkg: finga/internal/shared/host
              desc: a module knows nothing of how its process runs
        modules-no-contracts:
          files: ["**/internal/application/*/*/**", "**/internal/application/{account,character,item,pvp,social}/*.go", "!**/internal/application/account/account.go", "!**/internal/application/character/character.go", "!**/internal/application/item/item.go", "!**/internal/application/pvp/pvp.go", "!**/internal/application/social/social.go", "**/internal/model/**", "**/internal/repository/**", "**/internal/metrics/**", "**/internal/adapter/**"]
          deny:
            - pkg: finga/api/gen
              desc: a module returns its own types; its handler turns them into the client protocol's
        modules-no-client-protocol:
          files: ["**/internal/application/**", "**/internal/model/**", "**/internal/repository/**", "**/internal/handler/**", "**/internal/metrics/**", "**/internal/adapter/**", "**/internal/migration/**", "!**/internal/handler/{account,character,item,pvp,social,world,transport}/**"]
          deny:
            - pkg: finga/api/gen/client
              desc: only the handlers speak the client protocol
            - pkg: finga/internal/shared/protocol
              desc: only the handlers speak the client protocol
        # The account's model and use cases know no socket and no HTTP; the handlers adapt both.
        account-no-socket:
          files: ["**/internal/model/account/**", "**/internal/application/account/**"]
          deny:
            - pkg: finga/pkg/wsconn
              desc: the WebSocket handler adapts the socket to the application's Conn
            - pkg: finga/pkg/wsrouter
              desc: the WebSocket handler routes messages to the use cases; the application exposes the use cases
            - pkg: golang.org/x/time/rate
              desc: per-message rate limits are the WebSocket handler's
            - pkg: finga/internal/handler
              desc: the handler calls the application, never the reverse
            - pkg: finga/internal/shared/protocol
              desc: the client protocol is the handlers' alone; the model has its own views
        # The world's domains (mobs, loot, party, itemcalls) know no map actor; the actor knows no World.
        world-domains:
          files: ["**/internal/application/world/mobs/**", "**/internal/application/world/loot/**", "**/internal/application/world/party/**", "**/internal/application/world/itemcalls/**"]
          deny:
            - pkg: finga/internal/application/world/instance
              desc: a domain runs inside a map; the map's actor calls it, never the reverse
            - pkg: finga/internal/application/world/world$
              desc: a domain runs inside a map; the World is above both
        world-instance:
          files: ["**/internal/application/world/instance/**"]
          deny:
            - pkg: finga/internal/application/world/world$
              desc: the World runs the maps; a map knows only its Mover
        # Only a module's repository layer and sqlc's output talk to the database.
        # The tests that run a module's use cases on Postgres (a file ending _pg_test.go in its root) build its repository, which a use case never imports.
        modules-no-sql:
          files: ["**/internal/application/*/*/**", "**/internal/application/{account,character,item,pvp,social}/*.go", "!**/internal/application/account/account.go", "!**/internal/application/character/character.go", "!**/internal/application/item/item.go", "!**/internal/application/pvp/pvp.go", "!**/internal/application/social/social.go", "**/internal/model/**", "**/internal/handler/**", "**/internal/metrics/**", "**/internal/adapter/**", "!$test", "!**/internal/application/*/*_pg_test.go"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: only the repository layer talks to the database
            - pkg: finga/pkg/dbx
              desc: only the repository layer opens transactions
        # A module's layers import inward, to model.
        layer-model:
          files: ["**/internal/model/**"]
          deny:
            - pkg: finga/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/internal/repository
              desc: model knows no storage
            - pkg: finga/internal/handler
              desc: model knows no transport
        # A module's use cases: account, character, item, pvp and social keep theirs in the root beside the facade, whose Module and New are the file named for the module; world's are its subpackages;
        layer-application:
          files: ["**/internal/application/*/*/**", "**/internal/application/{account,character,item,pvp,social}/*.go", "!**/internal/application/account/account.go", "!**/internal/application/character/character.go", "!**/internal/application/item/item.go", "!**/internal/application/pvp/pvp.go", "!**/internal/application/social/social.go", "!**/internal/application/social/main_test.go", "!**/internal/application/*/*_pg_test.go"]
          deny:
            - pkg: finga/internal/repository
              desc: application declares its Store; the repository implements it, and the wiring connects them
            - pkg: finga/internal/handler
              desc: the handler calls application, never the reverse
        layer-repository:
          files: ["**/internal/repository/**"]
          deny:
            - pkg: finga/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/api/gen
              desc: the repository maps rows to model's types, never to the contract's
        # A handler's tests may wire the real application and adapters over fake modules.
        layer-handler:
          files: ["**/internal/handler/**", "!$test"]
          deny:
            - pkg: finga/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: github.com/jackc/pgx
              desc: the handler never touches the database
            - pkg: finga/pkg/dbx
              desc: the handler never touches the database
        handlers-no-database:
          files: ["**/internal/handler/{account,character,item,pvp,social,world,transport}/**", "**/internal/metrics/transport/**", "**/server/config/gateway.go", "**/internal/dependencies/gateway.go"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: the handlers hold no database
            - pkg: finga/pkg/dbx
              desc: the handlers hold no database
            - pkg: finga/pkg/outbox
              desc: the handlers hold no database
            - pkg: finga/pkg/idempotency
              desc: the handlers hold no database
            - pkg: finga/pkg/pgtest
              desc: the handlers' tests need no database
        # A module's layers below its facade are its own: only its layers and the wiring, internal/dependencies, import them; the end-to-end tests have their own rule.
        # The transport's tests drive every module's handler together, as the wiring does.
        account-private:
          files: ["$all", "!**/internal/application/account/**", "!**/internal/model/account/**", "!**/internal/repository/account/**", "!**/internal/handler/account/**", "!**/internal/metrics/account/**", "!**/internal/adapter/account/**", "!**/internal/dependencies/**", "!**/server/test/**", "!**/internal/handler/{character,item,pvp,social,world,transport}/**"]
          deny:
            - pkg: finga/internal/application/account/
              desc: only the account module's own layers and the wiring import below its facade
            - pkg: finga/internal/model/account
              desc: only the account module's own layers and the wiring import below its facade
            - pkg: finga/internal/repository/account
              desc: only the account module's own layers and the wiring import below its facade
            - pkg: finga/internal/handler/account
              desc: only the account module's own layers and the wiring import below its facade
            - pkg: finga/internal/metrics/account
              desc: only the account module's own layers and the wiring import below its facade
            - pkg: finga/internal/adapter/account
              desc: only the account module's own layers and the wiring import below its facade
        character-private:
          files: ["$all", "!**/internal/application/character/**", "!**/internal/model/character/**", "!**/internal/repository/character/**", "!**/internal/handler/character/**", "!**/internal/metrics/character/**", "!**/internal/adapter/character/**", "!**/internal/dependencies/**", "!**/server/test/**", "!**/internal/handler/transport/*_test.go"]
          deny:
            - pkg: finga/internal/application/character/
              desc: only the character module's own layers and the wiring import below its facade
            - pkg: finga/internal/model/character
              desc: only the character module's own layers and the wiring import below its facade
            - pkg: finga/internal/repository/character
              desc: only the character module's own layers and the wiring import below its facade
            - pkg: finga/internal/handler/character
              desc: only the character module's own layers and the wiring import below its facade
            - pkg: finga/internal/metrics/character
              desc: only the character module's own layers and the wiring import below its facade
            - pkg: finga/internal/adapter/character
              desc: only the character module's own layers and the wiring import below its facade
        item-private:
          files: ["$all", "!**/internal/application/item/**", "!**/internal/model/item/**", "!**/internal/repository/item/**", "!**/internal/handler/item/**", "!**/internal/metrics/item/**", "!**/internal/adapter/item/**", "!**/internal/dependencies/**", "!**/server/test/**", "!**/internal/handler/transport/*_test.go"]
          deny:
            - pkg: finga/internal/application/item/
              desc: only the item module's own layers and the wiring import below its facade
            - pkg: finga/internal/model/item
              desc: only the item module's own layers and the wiring import below its facade
            - pkg: finga/internal/repository/item
              desc: only the item module's own layers and the wiring import below its facade
            - pkg: finga/internal/handler/item
              desc: only the item module's own layers and the wiring import below its facade
            - pkg: finga/internal/metrics/item
              desc: only the item module's own layers and the wiring import below its facade
            - pkg: finga/internal/adapter/item
              desc: only the item module's own layers and the wiring import below its facade
        social-private:
          files: ["$all", "!**/internal/application/social/**", "!**/internal/model/social/**", "!**/internal/repository/social/**", "!**/internal/handler/social/**", "!**/internal/metrics/social/**", "!**/internal/adapter/social/**", "!**/internal/dependencies/**", "!**/server/test/**", "!**/internal/adapter/account/social_test.go", "!**/internal/handler/transport/*_test.go"]
          deny:
            - pkg: finga/internal/application/social/
              desc: only the social module's own layers and the wiring import below its facade
            - pkg: finga/internal/model/social
              desc: only the social module's own layers and the wiring import below its facade
            - pkg: finga/internal/repository/social
              desc: only the social module's own layers and the wiring import below its facade
            - pkg: finga/internal/handler/social
              desc: only the social module's own layers and the wiring import below its facade
            - pkg: finga/internal/metrics/social
              desc: only the social module's own layers and the wiring import below its facade
            - pkg: finga/internal/adapter/social
              desc: only the social module's own layers and the wiring import below its facade
        world-private:
          files: ["$all", "!**/internal/application/world/**", "!**/internal/model/world/**", "!**/internal/repository/world/**", "!**/internal/handler/world/**", "!**/internal/metrics/world/**", "!**/internal/adapter/world/**", "!**/internal/dependencies/**", "!**/server/test/**", "!**/internal/handler/transport/*_test.go"]
          deny:
            - pkg: finga/internal/application/world/
              desc: only the world module's own layers and the wiring import below its facade
            - pkg: finga/internal/model/world
              desc: only the world module's own layers and the wiring import below its facade
            - pkg: finga/internal/repository/world
              desc: only the world module's own layers and the wiring import below its facade
            - pkg: finga/internal/handler/world
              desc: only the world module's own layers and the wiring import below its facade
            - pkg: finga/internal/metrics/world
              desc: only the world module's own layers and the wiring import below its facade
            - pkg: finga/internal/adapter/world
              desc: only the world module's own layers and the wiring import below its facade
        # The end-to-end tests reach no module below its facade, but for item's database checks, itemtest.
        # The harness's own builder of the item module alone gives it the repository, as the wiring does; its tests drive the game through the API.
        e2e-private:
          files: ["**/server/test/**", "!**/server/test/e2etest/e2e.go"]
          deny:
            - pkg: finga/internal/application/account/
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/model/account
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/repository/account
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/handler/account
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/metrics/account
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/adapter/account
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/application/character/
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/model/character
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/repository/character
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/handler/character
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/metrics/character
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/adapter/character
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/handler
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/application/item/
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/model/item
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/repository/item$
              desc: an end-to-end test drives the game through its API; itemtest alone is for its checks
            - pkg: finga/internal/repository/item/internal/
              desc: an end-to-end test drives the game through its API; itemtest alone is for its checks
            - pkg: finga/internal/handler/item
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/metrics/item
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/adapter/item
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/application/social/
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/model/social
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/repository/social
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/handler/social
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/metrics/social
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/adapter/social
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/application/world/
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/model/world
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/repository/world
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/handler/world
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/metrics/world
              desc: an end-to-end test drives the game through its API and the wiring
            - pkg: finga/internal/adapter/world
              desc: an end-to-end test drives the game through its API and the wiring
        # Only a module's in-process adapters, internal/adapter/<module>, call another module, and the wiring connects them; a handler's test fakes the modules behind the production adapters.
        account-facades:
          files: ["**/internal/application/account/**", "**/internal/model/account/**", "**/internal/repository/account/**", "**/internal/handler/account/**", "**/internal/metrics/account/**", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/character
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/item
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/social
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/world
              desc: only the module's adapters call another module's facade
        character-facades:
          files: ["**/internal/application/character/**", "**/internal/model/character/**", "**/internal/repository/character/**", "**/internal/metrics/character/**", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/account
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/item
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/social
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/world
              desc: only the module's adapters call another module's facade
        # A module's admin routes (receive_admin*.go) call the facades of the modules they write through, as the admin API's handler did; they sit in the lowest module whose graph covers them.
        # The handlers reach the others through the account's Commands and Lobby, which the account's facade serves; they call no other facade.
        handlers-facades:
          files: ["**/internal/handler/{account,character,item,pvp,social,world,transport}/**", "!**/internal/handler/*/*_test.go", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/character
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/item
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/social
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/world
              desc: only the module's adapters call another module's facade
        item-facades:
          files: ["**/internal/application/item/**", "**/internal/model/item/**", "**/internal/repository/item/**", "**/internal/metrics/item/**", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/account
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/character
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/social
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/world
              desc: only the module's adapters call another module's facade
        social-facades:
          files: ["**/internal/application/social/**", "**/internal/model/social/**", "**/internal/repository/social/**", "**/internal/metrics/social/**", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/account
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/character
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/item
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/world
              desc: only the module's adapters call another module's facade
        world-facades:
          files: ["**/internal/application/world/**", "**/internal/model/world/**", "**/internal/repository/world/**", "**/internal/metrics/world/**", "!**/internal/handler/*/receive_admin*.go"]
          deny:
            - pkg: finga/internal/application/account
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/character
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/item
              desc: only the module's adapters call another module's facade
            - pkg: finga/internal/application/social
              desc: only the module's adapters call another module's facade
        # The modules meet in process; gRPC is left only inside the OTLP exporter's transport.
        no-grpc:
          files: ["$all"]
          deny:
            - pkg: google.golang.org/grpc
              desc: the modules meet in process, through their facades
        support:
          files: ["**/internal/shared/protocol/**", "**/internal/shared/host/**"]
          deny:
            - pkg: finga/internal/application
              desc: support packages never import a module
            - pkg: finga/internal/model
              desc: support packages never import a module
            - pkg: finga/internal/repository
              desc: support packages never import a module
            - pkg: finga/internal/handler
              desc: support packages never import a module
            - pkg: finga/internal/metrics
              desc: support packages never import a module
            - pkg: finga/internal/adapter
              desc: support packages never import a module
            - pkg: finga/internal/dependencies
              desc: support packages never import a module
            - pkg: finga/internal/migration
              desc: support packages never import a module
        support-no-config:
          files: ["**/internal/shared/protocol/**", "**/internal/shared/host/**", "!$test"]
          deny:
            - pkg: finga/config
              desc: support packages never import the game's configuration; the host's tests load it
        # The wiring and the migrations sit at the top: only what runs them imports them.
        wiring:
          files: ["$all", "!**/cmd/**", "!**/internal/dependencies/**", "!**/server/test/**"]
          deny:
            - pkg: finga/internal/dependencies
              desc: only a binary and the end-to-end tests import the wiring
        migration:
          files: ["$all", "!**/internal/migration/**", "!**/cmd/migrate/**", "!**/internal/repository/*/*_test.go", "!**/internal/repository/dbtest/**", "!**/server/test/**"]
          deny:
            - pkg: finga/internal/migration
              desc: only cmd/migrate applies the migrations, and the tests that need a migrated database
        migration-below:
          files: ["**/internal/migration/**"]
          deny:
            - pkg: finga/internal/application
              desc: the migrations know no code above them
            - pkg: finga/internal/model
              desc: the migrations know no code above them
            - pkg: finga/internal/repository
              desc: the migrations know no code above them
            - pkg: finga/internal/handler
              desc: the migrations know no code above them
            - pkg: finga/internal/metrics
              desc: the migrations know no code above them
            - pkg: finga/internal/adapter
              desc: the migrations know no code above them
            - pkg: finga/internal/dependencies
              desc: the migrations know no code above them
            - pkg: finga/config
              desc: the migrations know no code above them
            - pkg: finga/cmd
              desc: the migrations know no code above them
        gin-at-the-edge:
          files: ["$all", "!**/internal/handler/{account,character,item,pvp,social,world,transport}/**", "!**/internal/dependencies/gateway.go"]
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: Gin stays in the gateway's handlers and its wiring
        zap-behind-slog:
          files: ["$all", "!**/pkg/observability/logger/**"]
          deny:
            - pkg: go.uber.org/zap
              desc: everything logs through log/slog; zap is pkg/observability/logger's backend
        # The configuration is its keys and checks: the host's sections, the database's and the log's, and a section per module.
        config:
          list-mode: strict
          files: ["**/cmd/migrate/config/**", "**/server/config/**", "!$test"]
          allow:
            - $gostd
            - finga/internal/shared/host
            - finga/pkg/dbx
            - finga/pkg/idempotency
            - finga/pkg/observability/logger
            - finga/pkg/observability/tracing

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^uuid\.New
          pkg: ^github\.com/google/uuid$
          msg: mint UUIDs with finga/pkg/uuidv7, so every ID is a UUIDv7
        # regiongen builds the same region on every CPU (large-regions.md section 3): these differ between assembly and pure Go, or between versions; the exclusions below keep them to it.
        # The lists name what's denied, so on each Go bump re-read the exports of math and math/rand/v2 for new ones.
        - pattern: ^math\.(Sin|Cos|Tan|Sincos|Asin|Acos|Atan|Atan2|Sinh|Cosh|Tanh|Asinh|Acosh|Atanh|Exp|Exp2|Expm1|Log|Log2|Log10|Log1p|Logb|Ilogb|Pow|Pow10|Hypot|Cbrt|Gamma|Lgamma|Erf|Erfc|Erfinv|Erfcinv|J0|J1|Jn|Y0|Y1|Yn|FMA|Ldexp|Frexp|Mod|Modf|Remainder)$
          pkg: ^math$
          msg: "regiongen: exactly rounded math only (+ − × ÷, Sqrt, Floor, Ceil, Trunc, Abs, Min, Max), so every CPU builds the same region"
        - pattern: ^rand\.
          pkg: ^math/rand$
          msg: "regiongen: randomness only from a seeded math/rand/v2 PCG's Uint64"
        - pattern: ^rand\.(New|NewChaCha8|NewZipf|Int|Int32|Int64|IntN|Int32N|Int64N|N|Uint|Uint32|Uint64|UintN|Uint32N|Uint64N|Float32|Float64|ExpFloat64|NormFloat64|Perm|Shuffle)$
          pkg: ^math/rand/v2$
          msg: "regiongen: randomness only from a seeded math/rand/v2 PCG's Uint64"
    sloglint:
      static-msg: true
      kv-only: true
      no-global: all
      context: scope
      key-naming-case: snake
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]
      - path: pkg/uuidv7/
        linters: [forbidigo]
      - path-except: internal/shared/regiongen/
        linters: [forbidigo]
        text: "regiongen: "

formatters:
  enable:
    - gofmt
    - goimports
