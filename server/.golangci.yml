# golangci-lint v2. `make lint` runs it; CI would too.
version: "2"

linters:
  default: standard
  enable:
    - depguard     # import direction (LLD page 1): cmd -> handler -> application -> the shared kernel -> pkg
    - errorlint    # errors.Is/As and %w, never == or type switches on errors
    - gocritic
    - misspell
    - nolintlint
    - revive
    - sloglint     # constant log messages, data in attributes, no global logger
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        # cmd is the top: each binary's main and its composition root
        # (cmd/gameserver/app). Nothing below imports it.
        below-cmd:
          files: ["**/internal/**", "**/pkg/**"]
          deny:
            - pkg: finga/cmd
              desc: only a binary and the tests import its composition root
        # pkg is generic: it never knows the game exists.
        pkg:
          files: ["**/pkg/**"]
          deny:
            - pkg: finga/internal
              desc: pkg never imports internal
        # The shared kernel: model's value types, and the game data, movement
        # simulation and progression rules more than one service runs. It sits
        # below every module and transport.
        kernel:
          files: ["**/internal/model/**", "**/internal/gamedata/**", "**/internal/sim/**", "**/internal/progression/**"]
          deny:
            - pkg: finga/internal/application
              desc: the shared kernel is below every module
            - pkg: finga/internal/handler
              desc: the shared kernel is below the handlers
            - pkg: finga/internal/protocol
              desc: the shared kernel is below protocol
            - pkg: finga/internal/telemetry
              desc: the shared kernel is below telemetry
            - pkg: finga/internal/config
              desc: the shared kernel takes plain values, never configuration
        # application is business logic: no transport, wiring, telemetry or configuration.
        application:
          files: ["**/internal/application/**"]
          deny:
            - pkg: finga/internal/handler
              desc: application never imports handler
            - pkg: finga/internal/protocol
              desc: application returns its own result types; the gateway maps them to protocol messages
            - pkg: finga/internal/telemetry
              desc: application declares observer interfaces; telemetry implements them
            - pkg: finga/internal/config
              desc: application takes option structs; the composition root fills them from configuration
        # services never see a transaction: pgx and pkg/dbx are for repository.go, sqlc output, the composition root, and tests.
        # invariants.go (page 6) is SQL by nature: whole-table checks that the tests and, later, the auditor run.
        application-no-sql:
          files: ["**/internal/application/**", "!**/repository.go", "!**/invariants.go", "!**/internal/db/**", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: only repository.go talks to the database
            - pkg: finga/pkg/dbx
              desc: only the module store (repository.go) opens transactions
        # handlers speak the transport and call services; never a repository or its generated code.
        handler:
          files: ["**/internal/handler/**"]
          deny:
            - pkg: finga/internal/application/*/internal/db
              desc: a handler never calls a repository or its generated code
            - pkg: github.com/jackc/pgx
              desc: a handler never talks to the database
            - pkg: finga/pkg/dbx
              desc: a handler never opens a transaction
        # telemetry, protocol and config sit beside application; they never reach up into handlers.
        support:
          files: ["**/internal/telemetry/**", "**/internal/protocol/**", "**/internal/config/**"]
          deny:
            - pkg: finga/internal/handler
              desc: support packages never import handler
    sloglint:
      static-msg: true
      kv-only: true
      no-global: all
      context: scope
      key-naming-case: snake
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
    - goimports
