# golangci-lint v2; `make lint` runs it.
version: "2"

linters:
  default: standard
  enable:
    - depguard     # import direction: composition roots -> services -> the shared kernel -> pkg
    - errorlint
    - forbidigo    # every UUID is minted by pkg/uuidv7
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        below-cmd:
          files: ["**/internal/**", "**/pkg/**"]
          deny:
            - pkg: finga/cmd
              desc: only a binary and the tests import its composition root
            - pkg: finga/services/account/app
              desc: only a binary and the tests import a service's composition root
            - pkg: finga/services/character/app
              desc: only a binary and the tests import a service's composition root
            - pkg: finga/services/gateway/app
              desc: only a binary and the tests import a service's composition root
            - pkg: finga/services/item/app
              desc: only a binary and the tests import a service's composition root
            - pkg: finga/services/social/app
              desc: only a binary and the tests import a service's composition root
            - pkg: finga/services/world/app
              desc: only a binary and the tests import a service's composition root
        pkg:
          files: ["**/pkg/**"]
          deny:
            - pkg: finga/internal
              desc: pkg never imports internal
            - pkg: finga/services
              desc: pkg never imports a service
        # The shared kernel: code several services run, below every service and never sent between them.
        kernel:
          files: ["**/internal/kernel/**", "**/internal/gamedata/**", "**/internal/sim/**", "**/internal/progression/**"]
          deny:
            - pkg: finga/services
              desc: the shared kernel is below every service
            - pkg: finga/api/gen
              desc: the shared kernel is code both sides run, never a contract type
            - pkg: finga/internal/protocol
              desc: the shared kernel is below protocol
            - pkg: finga/internal/telemetry
              desc: the shared kernel is below telemetry
            - pkg: finga/internal/host
              desc: the shared kernel takes plain values, never configuration or the host
        # A service's inner layers are business logic; only its handler and clients speak the contracts.
        modules:
          files: ["**/services/*/internal/**", "!**/services/*/internal/handler/**", "!**/services/*/internal/clients/**"]
          deny:
            - pkg: google.golang.org/grpc
              desc: a module knows no transport; its handler and clients do
            - pkg: finga/internal/telemetry
              desc: a module declares observer interfaces; telemetry implements them
            - pkg: finga/services/account/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/services/character/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/services/gateway/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/services/item/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/services/social/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/services/world/config
              desc: a module takes option structs; the composition root fills them from configuration
            - pkg: finga/internal/host
              desc: a module knows nothing of how its process runs
        modules-no-contracts:
          files: ["**/services/*/internal/**", "!**/services/*/internal/handler/**", "!**/services/*/internal/clients/**", "!**/services/gateway/internal/model/**", "!**/services/gateway/internal/application/**"]
          deny:
            - pkg: finga/api/gen
              desc: a module returns its own types; its handler turns them into the contract's
        # The client protocol is the gateway's model vocabulary; the services' contracts stay its clients'.
        gateway-no-service-contracts:
          files: ["**/services/gateway/internal/model/**", "**/services/gateway/internal/application/**"]
          deny:
            - pkg: finga/api/gen/account
              desc: the gateway's clients turn a service's contract into the gateway's model
            - pkg: finga/api/gen/character
              desc: the gateway's clients turn a service's contract into the gateway's model
            - pkg: finga/api/gen/item
              desc: the gateway's clients turn a service's contract into the gateway's model
            - pkg: finga/api/gen/social
              desc: the gateway's clients turn a service's contract into the gateway's model
            - pkg: finga/api/gen/world
              desc: the gateway's clients turn a service's contract into the gateway's model
        services-no-client-protocol:
          files: ["**/services/**", "!**/services/gateway/**"]
          deny:
            - pkg: finga/api/gen/client
              desc: only the gateway speaks the client protocol
            - pkg: finga/internal/protocol
              desc: only the gateway speaks the client protocol
        # The gateway's model and use cases know no socket and no HTTP; the handlers adapt both.
        gateway-application:
          files: ["**/services/gateway/internal/model/**", "**/services/gateway/internal/application/**"]
          deny:
            - pkg: finga/pkg/wsconn
              desc: the WebSocket handler adapts the socket to the application's Conn
            - pkg: finga/pkg/wsrouter
              desc: the WebSocket handler routes messages to the use cases; the application exposes the use cases
            - pkg: golang.org/x/time/rate
              desc: per-message rate limits are the WebSocket handler's
            - pkg: finga/services/gateway/internal/handler
              desc: the handler calls the application, never the reverse
        gateway-application-no-http:
          files: ["**/services/gateway/internal/application/**"]
          deny:
            - pkg: net/http
              desc: the REST handler speaks HTTP; the Lobby takes plain values
        # Only a service's repository layer and sqlc's output talk to the database.
        services-no-sql:
          files: ["**/services/*/internal/**", "!**/internal/repository/**", "!**/repository.go", "!**/internal/db/**", "!$test"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: only the repository layer talks to the database
            - pkg: finga/pkg/dbx
              desc: only the repository layer opens transactions
        # A service's layers import inward, to model; depguard has no wildcard, so each rule names every service.
        layer-model:
          files: ["**/services/*/internal/model/**"]
          deny:
            - pkg: finga/services/account/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/character/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/gateway/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/item/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/social/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/world/internal/application
              desc: model is the innermost layer; application uses it, never the reverse
            - pkg: finga/services/account/internal/repository
              desc: model knows no storage
            - pkg: finga/services/character/internal/repository
              desc: model knows no storage
            - pkg: finga/services/gateway/internal/repository
              desc: model knows no storage
            - pkg: finga/services/item/internal/repository
              desc: model knows no storage
            - pkg: finga/services/social/internal/repository
              desc: model knows no storage
            - pkg: finga/services/world/internal/repository
              desc: model knows no storage
            - pkg: finga/services/account/internal/handler
              desc: model knows no transport
            - pkg: finga/services/character/internal/handler
              desc: model knows no transport
            - pkg: finga/services/gateway/internal/handler
              desc: model knows no transport
            - pkg: finga/services/item/internal/handler
              desc: model knows no transport
            - pkg: finga/services/social/internal/handler
              desc: model knows no transport
            - pkg: finga/services/world/internal/handler
              desc: model knows no transport
            - pkg: finga/services/account/internal/clients
              desc: model knows no other service
            - pkg: finga/services/character/internal/clients
              desc: model knows no other service
            - pkg: finga/services/gateway/internal/clients
              desc: model knows no other service
            - pkg: finga/services/item/internal/clients
              desc: model knows no other service
            - pkg: finga/services/social/internal/clients
              desc: model knows no other service
            - pkg: finga/services/world/internal/clients
              desc: model knows no other service
        layer-application:
          files: ["**/services/*/internal/application/**"]
          deny:
            - pkg: finga/services/account/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/character/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/gateway/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/item/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/social/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/world/internal/repository
              desc: application declares its Store; the repository implements it, and the composition root wires it in
            - pkg: finga/services/account/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/character/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/gateway/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/item/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/social/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/world/internal/handler
              desc: the handler calls application, never the reverse
            - pkg: finga/services/account/internal/clients
              desc: application declares a port for each service it calls; clients implement it
            - pkg: finga/services/character/internal/clients
              desc: application declares a port for each service it calls; clients implement it
            - pkg: finga/services/gateway/internal/clients
              desc: application declares a port for each service it calls; clients implement it
            - pkg: finga/services/item/internal/clients
              desc: application declares a port for each service it calls; clients implement it
            - pkg: finga/services/social/internal/clients
              desc: application declares a port for each service it calls; clients implement it
            - pkg: finga/services/world/internal/clients
              desc: application declares a port for each service it calls; clients implement it
        layer-repository:
          files: ["**/services/*/internal/repository/**"]
          deny:
            - pkg: finga/services/account/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/character/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/gateway/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/item/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/social/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/world/internal/handler
              desc: the repository implements application's ports and knows no transport
            - pkg: finga/services/account/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/services/character/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/services/gateway/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/services/item/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/services/social/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/services/world/internal/clients
              desc: the repository implements application's ports and calls no service
            - pkg: finga/api/gen
              desc: the repository maps rows to model's types, never to the contract's
            - pkg: google.golang.org/grpc
              desc: the repository knows no transport
        # A handler's tests may wire the real application and clients over fake services.
        layer-handler:
          files: ["**/services/*/internal/handler/**", "!$test"]
          deny:
            - pkg: finga/services/account/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/character/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/gateway/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/item/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/social/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/world/internal/repository
              desc: the handler calls application; storage is behind its ports
            - pkg: finga/services/account/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: finga/services/character/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: finga/services/gateway/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: finga/services/item/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: finga/services/social/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: finga/services/world/internal/clients
              desc: the handler calls application; other services are behind its ports
            - pkg: github.com/jackc/pgx
              desc: the handler never touches the database
            - pkg: finga/pkg/dbx
              desc: the handler never touches the database
        layer-clients:
          files: ["**/services/*/internal/clients/**"]
          deny:
            - pkg: finga/services/account/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/character/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/gateway/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/item/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/social/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/world/internal/repository
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/account/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/character/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/gateway/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/item/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/social/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: finga/services/world/internal/handler
              desc: clients implement application's ports over gRPC, nothing else
            - pkg: github.com/jackc/pgx
              desc: clients never touch the database
            - pkg: finga/pkg/dbx
              desc: clients never touch the database
        gateway-no-database:
          files: ["**/services/gateway/**"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: the gateway holds no database
            - pkg: finga/pkg/dbx
              desc: the gateway holds no database
            - pkg: finga/pkg/outbox
              desc: the gateway holds no database
            - pkg: finga/pkg/idempotency
              desc: the gateway holds no database
            - pkg: finga/pkg/pgtest
              desc: the gateway's tests need no database
        # Go's internal/ rule covers a service's internals; these cover the rest.
        gateway-alone:
          files: ["**/services/gateway/**"]
          deny:
            - pkg: finga/services/account
              desc: a service reaches another only through its generated client
            - pkg: finga/services/character
              desc: a service reaches another only through its generated client
            - pkg: finga/services/item
              desc: a service reaches another only through its generated client
            - pkg: finga/services/social
              desc: a service reaches another only through its generated client
            - pkg: finga/services/world
              desc: a service reaches another only through its generated client
        account-alone:
          files: ["**/services/account/**"]
          deny:
            - pkg: finga/services/character
              desc: a service reaches another only through its generated client
            - pkg: finga/services/gateway
              desc: a service reaches another only through its generated client
            - pkg: finga/services/item
              desc: a service reaches another only through its generated client
            - pkg: finga/services/social
              desc: a service reaches another only through its generated client
            - pkg: finga/services/world
              desc: a service reaches another only through its generated client
        character-alone:
          files: ["**/services/character/**"]
          deny:
            - pkg: finga/services/account
              desc: a service reaches another only through its generated client
            - pkg: finga/services/gateway
              desc: a service reaches another only through its generated client
            - pkg: finga/services/item
              desc: a service reaches another only through its generated client
            - pkg: finga/services/social
              desc: a service reaches another only through its generated client
            - pkg: finga/services/world
              desc: a service reaches another only through its generated client
        item-alone:
          files: ["**/services/item/**"]
          deny:
            - pkg: finga/services/account
              desc: a service reaches another only through its generated client
            - pkg: finga/services/character
              desc: a service reaches another only through its generated client
            - pkg: finga/services/gateway
              desc: a service reaches another only through its generated client
            - pkg: finga/services/social
              desc: a service reaches another only through its generated client
            - pkg: finga/services/world
              desc: a service reaches another only through its generated client
        world-alone:
          files: ["**/services/world/**"]
          deny:
            - pkg: finga/services/account
              desc: a service reaches another only through its generated client
            - pkg: finga/services/character
              desc: a service reaches another only through its generated client
            - pkg: finga/services/gateway
              desc: a service reaches another only through its generated client
            - pkg: finga/services/item
              desc: a service reaches another only through its generated client
            - pkg: finga/services/social
              desc: a service reaches another only through its generated client
        social-alone:
          files: ["**/services/social/**"]
          deny:
            - pkg: finga/services/account
              desc: a service reaches another only through its generated client
            - pkg: finga/services/character
              desc: a service reaches another only through its generated client
            - pkg: finga/services/gateway
              desc: a service reaches another only through its generated client
            - pkg: finga/services/item
              desc: a service reaches another only through its generated client
            - pkg: finga/services/world
              desc: a service reaches another only through its generated client
        support:
          files: ["**/internal/telemetry/**", "**/internal/protocol/**", "**/internal/host/**"]
          deny:
            - pkg: finga/services
              desc: support packages never import a service
        gin-at-the-edge:
          files: ["$all", "!**/services/gateway/internal/handler/**", "!**/services/gateway/app/**"]
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: Gin stays in the gateway's handlers and composition root (TD-26)
        zap-behind-slog:
          files: ["$all", "!**/pkg/logger/**"]
          deny:
            - pkg: go.uber.org/zap
              desc: everything logs through log/slog; zap is pkg/logger's backend (TD-28)
        # A binary's configuration is its keys and checks: the host's sections, the database's and the log's.
        config:
          list-mode: strict
          files: ["**/services/*/config/**", "**/cmd/migrate/config/**", "!$test"]
          allow:
            - $gostd
            - finga/internal/host
            - finga/pkg/dbx
            - finga/pkg/logger
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^uuid\.New
          pkg: ^github\.com/google/uuid$
          msg: mint UUIDs with finga/pkg/uuidv7, so every ID is a UUIDv7
    sloglint:
      static-msg: true
      kv-only: true
      no-global: all
      context: scope
      key-naming-case: snake
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters: [unparam]
      - path: pkg/uuidv7/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
