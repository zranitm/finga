# The output in api/gen is committed; clean empties it first, so a removed contract leaves no stale code.
# The generators are Go tools pinned in go.mod, so a laptop and CI produce the same bytes.
version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: api/gen
    opt: module=finga/api/gen
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: api/gen
    opt: module=finga/api/gen
