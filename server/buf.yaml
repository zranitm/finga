# buf runs as a Go tool pinned in go.mod: `go tool buf lint`, `go tool buf generate`.
version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
breaking:
  # WIRE while in development: fields may be renamed in place, since the binary protocol carries numbers and the game and the client ship on one commit; move back to WIRE_JSON or FILE before a public launch.
  use:
    - WIRE
