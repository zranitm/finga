syntax = "proto3";

package internal.social.v1;

option go_package = "finga/api/gen/social/v1;socialv1";

// SocialService owns parties, invites and chat, in memory; a failure carries a Reason in google.rpc.ErrorInfo.
service SocialService {
  // Deliver streams Subscribed, then the party events of every character online through that gateway.
  rpc Deliver(DeliverRequest) returns (stream DeliverResponse);
  // Online records a character as connected through a gateway and sends them their party, an empty one without, telling the rest of it too; again through the same connection, it keeps what UpdateMember reported.
  rpc Online(OnlineRequest) returns (OnlineResponse);
  // Offline marks a character as disconnected; their party keeps them.
  rpc Offline(OfflineRequest) returns (OfflineResponse);
  // Retired, answering Unimplemented: a login's party comes from Online, in order with the party's changes.
  rpc PartyOf(PartyOfRequest) returns (PartyOfResponse) {
    option deprecated = true;
  }
  // Invite asks a character on the same map to join; an inviter without a party leads the new one.
  rpc Invite(InviteRequest) returns (InviteResponse);
  rpc Respond(RespondRequest) returns (RespondResponse);
  rpc LeaveParty(LeavePartyRequest) returns (LeavePartyResponse);
  // Kick removes a member; only the leader may.
  rpc Kick(KickRequest) returns (KickResponse);
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  // Chat cleans a line and charges the sender's limit; a map line is returned for the world to deliver.
  rpc Chat(ChatRequest) returns (ChatResponse);
  // WatchParties streams Subscribed, every current membership, then each change.
  rpc WatchParties(WatchPartiesRequest) returns (stream WatchPartiesResponse);
  // UpdateMember records what the world saw of a member: map, level, HP.
  rpc UpdateMember(UpdateMemberRequest) returns (UpdateMemberResponse);
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_NOT_PARTY_LEADER = 1;
  REASON_PARTY_FULL = 2;
  REASON_ALREADY_IN_PARTY = 3;
  REASON_NO_PARTY = 4;
  REASON_NOT_PARTY_MEMBER = 5;
  REASON_TARGET_NOT_ON_MAP = 6;
  REASON_ALREADY_INVITED = 7;
  REASON_INVITE_EXPIRED = 8;
  REASON_INVITE_SELF = 9;
  REASON_CHAT_EMPTY = 10;
  REASON_CHAT_TOO_LONG = 11;
  REASON_BAD_CHAT_CHANNEL = 12;
  REASON_CHAT_NO_PARTY = 13;
  REASON_CHAT_RATE_LIMITED = 14;
  // Never sent: chat always has the party module; buf's FILE rules keep a published value.
  REASON_PARTY_CHAT_UNAVAILABLE = 15 [deprecated = true];
  REASON_BAD_ID = 16;
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_MAP = 1;
  CHAT_CHANNEL_PARTY = 2;
}

message Member {
  string id = 1;
  string name = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  string map_id = 6;
  bool online = 7;
}

// Party is the leader and the members in join order.
message Party {
  string leader_id = 1;
  repeated Member members = 2;
}

message DeliverRequest {
  // The subscribing gateway node; a second subscription with the same ID replaces the first.
  string gateway_id = 1;
}

// DeliverResponse is one event for one character.
message DeliverResponse {
  // Empty only for Subscribed.
  string character_id = 1;
  oneof event {
    Subscribed subscribed = 2;
    PartyState party_state = 3;
    PartyInvited party_invited = 4;
    ChatLine chat_line = 5;
  }
}

// Subscribed is a stream's first message.
message Subscribed {
  // Random per process start: a new value means the service restarted and every party is gone.
  string boot_id = 1;
}

// PartyState is the character's party after a change; unset when it has none.
message PartyState {
  Party party = 1;
}

message PartyInvited {
  string invite_id = 1;
  string from_id = 2;
  string from_name = 3;
}

// ChatLine is a party chat line.
message ChatLine {
  string sender_id = 1;
  string sender_name = 2;
  string text = 3;
}

message OnlineRequest {
  string gateway_id = 1;
  Member member = 2;
  // The player's connection, on that gateway; an Offline naming another one is stale.
  string connection_id = 3;
  // The world's sequence of the join behind the connection; an Online with a lower one than the member's is an ended tab's late registration. Required.
  uint64 join_seq = 4;
}

message OnlineResponse {}

message OfflineRequest {
  string character_id = 1;
  // The connection that closed; if the character is online through a newer one, nothing changes.
  string connection_id = 2;
}

message OfflineResponse {}

message PartyOfRequest {
  string character_id = 1;
}

message PartyOfResponse {
  // Unset when the character has no party.
  Party party = 1;
}

message InviteRequest {
  string character_id = 1;
  string target_id = 2;
}

message InviteResponse {
  string invite_id = 1;
}

message RespondRequest {
  string character_id = 1;
  string invite_id = 2;
  bool accept = 3;
}

message RespondResponse {}

message LeavePartyRequest {
  string character_id = 1;
}

message LeavePartyResponse {}

message KickRequest {
  string character_id = 1;
  string target_id = 2;
}

message KickResponse {}

message PromoteRequest {
  string character_id = 1;
  string target_id = 2;
}

message PromoteResponse {}

message ChatRequest {
  string sender_id = 1;
  string sender_name = 2;
  ChatChannel channel = 3;
  string text = 4;
}

message ChatResponse {
  ChatChannel channel = 1;
  // The cleaned line.
  string text = 2;
}

message WatchPartiesRequest {
  // The subscribing world node; a second subscription with the same ID replaces the first.
  string world_id = 1;
}

message WatchPartiesResponse {
  oneof event {
    Subscribed subscribed = 1;
    Membership membership = 2;
  }
}

// Membership sets each listed character's party to members (empty: none).
message Membership {
  repeated string character_ids = 1;
  repeated string members = 2;
}

message UpdateMemberRequest {
  string character_id = 1;
  string map_id = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
}

message UpdateMemberResponse {}
