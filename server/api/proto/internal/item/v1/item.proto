syntax = "proto3";

package internal.item.v1;

option go_package = "finga/api/gen/item/v1;itemv1";

// ItemService owns items and inventories, each change one transaction under an idempotency key; a failure carries a Reason in google.rpc.ErrorInfo.
service ItemService {
  // Inventory lists a character's items, by tab and slot.
  rpc Inventory(InventoryRequest) returns (InventoryResponse);
  // Add fills the first stack with room, then the first free slot; a pickup's key is its drop ID.
  rpc Add(AddRequest) returns (AddResponse);
  // AddMany adds up to 32 drops for one owner in one transaction, each under its own key as Add would take it; a drop a rule refuses changes nothing and stores no reply, and the others carry on.
  rpc AddMany(AddManyRequest) returns (AddManyResponse);
  // Move moves an item to a slot of its tab, merging into a stack of the same item there.
  rpc Move(MoveRequest) returns (MoveResponse);
  // Discard destroys an item or part of a stack.
  rpc Discard(DiscardRequest) returns (DiscardResponse);
  // DiscardMany destroys whole items or stacks in one transaction, all of them or none: one to a tab's 24, each once, none worn, under one key.
  rpc DiscardMany(DiscardManyRequest) returns (DiscardManyResponse);
  // GrantStarter gives a new character the start class's starter items once, keyed by the character ID.
  rpc GrantStarter(GrantStarterRequest) returns (GrantStarterResponse);
  // Equip wears an inventory item in an equip slot; a worn item there swaps into the slot the new one left. The world sends the live level and class.
  rpc Equip(EquipRequest) returns (EquipResponse);
  // Unequip puts a worn item back in the Equip tab.
  rpc Unequip(UnequipRequest) returns (UnequipResponse);
  // HandIn takes the items a quest asks for and gives its rewards, in one transaction: all of it, or nothing when either side fails. Each completion of a quest is handed in once and kept for good: a repeat gets its stored reply.
  rpc HandIn(HandInRequest) returns (HandInResponse);
  // HandedIn is which of a character's quest completions were handed in, each with its stored reply, so a world that missed the reply can finish the quest.
  rpc HandedIn(HandedInRequest) returns (HandedInResponse);
  // Use takes one of a usable item, such as a potion, from its stack; the world applies what it does.
  rpc Use(UseRequest) returns (UseResponse);
}

// Reason names a failure a caller can meet; retrying the same request cannot help.
enum Reason {
  // 4 was one INVENTORY_FULL for every tab, 23 one STATS_TOO_LOW for every stat; each is split by tab or stat below.
  reserved 4, 23;
  reserved "REASON_INVENTORY_FULL", "REASON_STATS_TOO_LOW";

  REASON_UNSPECIFIED = 0;
  REASON_ITEM_NOT_FOUND = 1;
  REASON_SLOT_TAKEN = 2;
  REASON_SLOT_HOLDS_OTHER_ITEM = 3;
  REASON_IDEMPOTENCY_KEY_REUSED = 5;
  REASON_BAD_QUANTITY = 6;
  REASON_BAD_SLOT = 7;
  REASON_WRONG_TAB = 8;
  REASON_UNKNOWN_ITEM = 9;
  REASON_BAD_ID = 10;
  REASON_UNKNOWN_CLASS = 11;
  // A move onto a stack of the same item with no room left.
  REASON_STACK_FULL = 12;
  // An idempotency key that is not a UUID, with or without the client's k- prefix.
  REASON_BAD_IDEMPOTENCY_KEY = 13;
  // A cause with no type, or one this service does not know; a hand-in with no quest or a completion below 1.
  REASON_BAD_CAUSE = 14;
  // Equipment added without a roll or with a stat outside its template's range, or anything else added with a roll.
  REASON_BAD_ROLL = 15;
  // A move or discard of a worn item, or an equip of one: it must be unequipped first.
  REASON_ITEM_WORN = 16;
  REASON_LEVEL_TOO_LOW = 17;
  REASON_WRONG_CLASS = 18;
  // An equip slot the item's kind doesn't fit, or one the game data doesn't have.
  REASON_WRONG_EQUIP_SLOT = 19;
  REASON_NOT_EQUIPMENT = 20;
  REASON_NOTHING_WORN = 21;
  // An AddMany with no drops, or with more than it takes; a HandIn with more lines than it takes; a DiscardMany with no items, more than a tab's 24, or one item twice.
  REASON_BAD_BATCH_SIZE = 22;
  // A hand-in asking for more of an item than the inventory's stacks hold; worn items never count.
  REASON_NOT_ENOUGH_ITEMS = 24;
  // No free slot in the tab an added or unequipped item goes to: an add, a hand-in's reward, or an unequip.
  REASON_EQUIP_TAB_FULL = 25;
  REASON_USE_TAB_FULL = 26;
  REASON_ETC_TAB_FULL = 27;
  // An equip whose item requires more of this primary stat than the character's own stats, without gear, have; the first short in STR, DEX, INT, AGI, VIT order.
  REASON_STR_TOO_LOW = 28;
  REASON_DEX_TOO_LOW = 29;
  REASON_INT_TOO_LOW = 30;
  REASON_AGI_TOO_LOW = 31;
  REASON_VIT_TOO_LOW = 32;
  // A use of an item that isn't the template the caller named, or of a template that can't be used.
  REASON_NOT_USABLE = 33;
}

// Grant is what became of one drop of an AddMany.
enum Grant {
  GRANT_UNSPECIFIED = 0;
  // Added by this call.
  GRANT_GRANTED = 1;
  // Added before under its key, by Add or an earlier batch: its stored reply comes back.
  GRANT_ALREADY_GRANTED = 2;
  // A rule refused it, as Add would have: nothing of it changed, and nothing is stored under its key.
  GRANT_REFUSED = 3;
}

enum CauseType {
  CAUSE_TYPE_UNSPECIFIED = 0;
  CAUSE_TYPE_DROP = 1;
  CAUSE_TYPE_PLAYER = 2;
  CAUSE_TYPE_STARTER = 3;
  // A trainer's gift at a promotion; the cause ID is the gift's key.
  CAUSE_TYPE_PROMOTION = 4;
}

// Actor is who acts: the account scopes the idempotency keys, the character owns the items.
message Actor {
  string account_id = 1;
  string character_id = 2;
}

message Cause {
  CauseType type = 1;
  // The drop or request, when there is one.
  string id = 2;
}

// Item is an item instance in an inventory.
message Item {
  string id = 1;
  string template_id = 2;
  // equip, use or etc.
  string tab = 3;
  int32 slot = 4;
  int32 quantity = 5;
  // What it rolled when it dropped; set for equipment only.
  ItemStats stats = 6;
  // The equip slot it is worn in; empty in the inventory, where tab and slot say where it is.
  string equip_slot = 7;
}

// An equipment roll, or what a character wears: the five primary stats and the sixteen derived, rates, crit damage and penetration in tenths of a percent, regen in tenths of a point a second.
message ItemStats {
  // 19 was attack speed, which the game no longer has.
  reserved 19;
  reserved "attack_speed";
  // 13 and 18 were MP: there is no MP.
  reserved 13, 18;
  reserved "max_mp", "mp_regen";

  int32 physical_attack = 1;
  int32 physical_defense = 2;
  int32 str = 3;
  int32 dex = 4;
  int32 int = 5;
  int32 agi = 6;
  int32 vit = 7;
  int32 accuracy = 8;
  int32 evasion = 9;
  int32 crit_rate = 10;
  int32 crit_damage = 11;
  int32 max_hp = 12;
  int32 magic_attack = 14;
  int32 magic_defense = 15;
  int32 penetration = 16;
  int32 hp_regen = 17;
  int32 cooldown_speed = 20;
  int32 move_speed = 21;
}

// A character's own primary stats: their class's starting stats and the points they spent, without gear.
message PrimaryStats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 agi = 4;
  int32 vit = 5;
}

// Slot is one changed inventory slot; item is unset when it emptied.
message Slot {
  string tab = 1;
  int32 slot = 2;
  Item item = 3;
}

// EquipSlot is one changed equip slot; item is unset when it emptied.
message EquipSlot {
  string equip_slot = 1;
  Item item = 2;
}

message InventoryRequest {
  string character_id = 1;
}

message InventoryResponse {
  // The inventory's items, then the worn ones.
  repeated Item items = 1;
  // The inventory's revision these items show: the count of its changes, so a higher one is newer.
  uint64 revision = 2;
}

message AddRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID, or the drop's ID); scoped by account.
  string idempotency_key = 2;
  string template_id = 3;
  int32 quantity = 4;
  Cause cause = 5;
  // The drop's roll: required for equipment, each stat within its template's range, and refused on anything else.
  ItemStats stats = 6;
}

message AddResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay; 0 when nothing changed, or when the reply replayed was stored before revisions.
  uint64 revision = 2;
}

message AddManyRequest {
  // The owner of every drop; its account scopes their keys.
  Actor actor = 1;
  repeated AddManyDrop drops = 2;
}

// AddManyDrop is one drop of a batch, with what Add would take for it.
message AddManyDrop {
  // The drop's own key, as Add would take it: a UUID, optionally prefixed k-.
  string idempotency_key = 1;
  string template_id = 2;
  int32 quantity = 3;
  Cause cause = 4;
  // The drop's roll: required for equipment, refused on anything else.
  ItemStats stats = 5;
}

message AddManyResponse {
  // One per drop, in the request's order.
  repeated DropOutcome outcomes = 1;
  // The slots this call's grants changed, each as it stands after the last of them.
  repeated Slot changed = 2;
  // The inventory's revision after this call's grants; 0 when it granted nothing.
  uint64 revision = 3;
}

// DropOutcome is one drop's: granted now, granted before, or refused by a rule.
message DropOutcome {
  Grant grant = 1;
  // Why a refused drop was refused.
  Reason reason = 2;
  // An already granted drop's stored reply: the slots its grant changed, at the revision it took, as Add would replay them.
  repeated Slot changed = 3;
  uint64 revision = 4;
}

message MoveRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID, or the drop's ID); scoped by account.
  string idempotency_key = 2;
  string item_id = 3;
  string tab = 4;
  int32 slot = 5;
}

message MoveResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay; 0 when nothing changed, or when the reply replayed was stored before revisions.
  uint64 revision = 2;
}

message DiscardRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID, or the drop's ID); scoped by account.
  string idempotency_key = 2;
  string item_id = 3;
  int32 quantity = 4;
}

message DiscardResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay; 0 when nothing changed, or when the reply replayed was stored before revisions.
  uint64 revision = 2;
}

message DiscardManyRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID); scoped by account.
  string idempotency_key = 2;
  repeated string item_ids = 3;
}

message DiscardManyResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay.
  uint64 revision = 2;
}

message GrantStarterRequest {
  Actor actor = 1;
  // Every character starts as the same class, so the items are that class's.
  reserved 2;
  reserved "class";
}

message GrantStarterResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay; 0 when nothing changed, or when the reply replayed was stored before revisions.
  uint64 revision = 2;
}

message EquipRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID); scoped by account.
  string idempotency_key = 2;
  string item_id = 3;
  // Needed for rings only: empty, an item takes the first empty slot of its kind, else the first slot of it.
  string equip_slot = 4;
  // The character's live level and class, which the item's requirements are checked against; a retry after a level-up is the same request.
  int32 level = 5;
  string class = 6;
  // The character's own stats, which the item's stat requirements are checked against; a retry after spending points is the same request.
  PrimaryStats stats = 7;
}

// EquipResponse is what the equip changed, and everything worn after it, so the world can replace its sum.
message EquipResponse {
  repeated Slot changed = 1;
  repeated EquipSlot equipment = 2;
  repeated Item worn = 3;
  // The inventory's revision after this change, which equipment shares.
  uint64 revision = 4;
}

message UnequipRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID); scoped by account.
  string idempotency_key = 2;
  string equip_slot = 3;
  // The Equip-tab slot to put it in; unset, the first free one.
  optional int32 to_slot = 4;
}

// UnequipResponse is what the unequip changed, and everything worn after it.
message UnequipResponse {
  repeated Slot changed = 1;
  repeated EquipSlot equipment = 2;
  repeated Item worn = 3;
  // The inventory's revision after this change, which equipment shares.
  uint64 revision = 4;
}

message HandInRequest {
  Actor actor = 1;
  // The quest handed in, which the history of every item taken or given names.
  string quest_id = 2;
  // The completion this hand-in makes, 1 the first time; a repeat of one handed in gets its stored reply, whatever its lines.
  int32 completion = 3;
  // What the quest's collect objectives ask for, taken from the smallest stacks first.
  repeated HandInTake take = 4;
  // The quest's item rewards, each placed as Add would place it.
  repeated HandInGive give = 5;
}

message HandInTake {
  string template_id = 1;
  int32 quantity = 2;
}

message HandInGive {
  string template_id = 1;
  int32 quantity = 2;
  // Equipment's roll, one per line; refused on anything else. A repeat may roll again and still gets the stored reply.
  ItemStats stats = 3;
}

message HandInResponse {
  // The slots the hand-in emptied, shrank or filled, each as it stands after it.
  repeated Slot changed = 1;
  // The inventory's revision after this change, kept by a replay.
  uint64 revision = 2;
}

message HandedInRequest {
  string character_id = 1;
  // The completions asked about; at most 32.
  repeated QuestCompletion completions = 2;
}

message QuestCompletion {
  string quest_id = 1;
  int32 completion = 2;
}

message HandedInResponse {
  // The completions asked about that were handed in; one not handed in is left out.
  repeated HandedInQuest handed_in = 1;
}

message HandedInQuest {
  string quest_id = 1;
  int32 completion = 2;
  // The slots the hand-in changed and the revision after it, as HandIn answered.
  repeated Slot changed = 3;
  uint64 revision = 4;
}

message UseRequest {
  Actor actor = 1;
  // A UUID, optionally prefixed k- (the client's request ID); scoped by account.
  string idempotency_key = 2;
  string item_id = 3;
  // What the caller believes the item is, which decided what it restores; any other item is refused.
  string template_id = 4;
}

message UseResponse {
  repeated Slot changed = 1;
  // The inventory's revision after this change.
  uint64 revision = 2;
  // An earlier call under the key took the item, and this is its reply: nothing was taken now.
  bool replayed = 3;
}
