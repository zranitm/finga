syntax = "proto3";

package internal.character.v1;

import "google/protobuf/timestamp.proto";

option go_package = "finga/api/gen/character/v1;characterv1";

// CharacterService owns characters, their progression and the world's checkpoints; a failure carries a Reason in google.rpc.ErrorInfo.
service CharacterService {
  // Create makes a level 1 character in the town, then grants its starter items idempotently.
  rpc Create(CreateRequest) returns (CreateResponse);
  // List is an account's characters, oldest first.
  rpc List(ListRequest) returns (ListResponse);
  // Load is one of the account's characters, with its quests; someone else's is REASON_CHARACTER_NOT_FOUND.
  rpc Load(LoadRequest) returns (LoadResponse);
  // SaveCheckpoint saves position, HP, MP, the whole progression and every quest; the world saves a level-up with it too.
  rpc SaveCheckpoint(SaveCheckpointRequest) returns (SaveCheckpointResponse);
  // SaveLevelUp saves a level-up. The world no longer calls it; buf's FILE rules keep a published RPC.
  rpc SaveLevelUp(SaveLevelUpRequest) returns (SaveLevelUpResponse) {
    option deprecated = true;
  }
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  REASON_CHARACTER_NOT_FOUND = 1;
  REASON_NAME_TAKEN = 2;
  REASON_BAD_CHARACTER_NAME = 3;
  // A stored character's class the game data doesn't have.
  REASON_CLASS_UNAVAILABLE = 4;
  REASON_CHARACTER_SLOTS_FULL = 5;
  REASON_BAD_ID = 6;
  // Never sent: an unknown class answers REASON_CLASS_UNAVAILABLE; buf's FILE rules keep a published value.
  REASON_UNKNOWN_CLASS = 7 [deprecated = true];
  // A checkpoint's quest with no ID or one listed twice, an unknown status, a negative count, or finished without a completion.
  REASON_BAD_QUEST = 8;
  REASON_BAD_SKILL = 9;
}

// QuestStatus is where a character stands with a quest.
enum QuestStatus {
  QUEST_STATUS_UNSPECIFIED = 0;
  // Accepted and not handed in yet.
  QUEST_STATUS_ACTIVE = 1;
  // Handed in, and not active again.
  QUEST_STATUS_FINISHED = 2;
}

// Quest is a character's state of one quest.
message Quest {
  string quest_id = 1;
  QuestStatus status = 2;
  // One count per objective, in the quest's order; empty when finished.
  repeated int32 progress = 3;
  // Completions so far; a repeatable quest active again keeps its count.
  int32 times_finished = 4;
}

// Stats are a number per primary stat: the points spent in each, or the own stats.
message Stats {
  int32 strength = 1;
  int32 dexterity = 2;
  int32 intelligence = 3;
  int32 agility = 4;
  int32 vitality = 5;
}

// Character is a character as stored, with its derived own stats and maximum HP and MP.
message Character {
  string id = 1;
  string account_id = 2;
  string name = 3;
  // A class in the game data's tree: beginner until a promotion.
  string class = 4;
  int32 level = 5;
  // EXP within the current level.
  int64 exp = 6;
  // The points spent in each stat; the own stats are the class's starting stats plus these.
  Stats points = 7;
  int32 unspent_points = 8;
  int32 hp = 9;
  int32 max_hp = 10;
  int32 mp = 11;
  int32 max_mp = 12;
  string map_id = 13;
  // Feet centre, map pixels.
  double x = 14;
  double y = 15;
  google.protobuf.Timestamp updated_at = 16;
  // Whether the one free reset of the points is used.
  bool free_reset_used = 17;
  // The class's starting stats plus the points, without gear.
  Stats own_stats = 18;
  // Skill points not yet invested in a skill.
  int32 unspent_skill_points = 19;
}

// SkillPoints are the points invested in one skill; a skill with none isn't listed.
message SkillPoints {
  string skill_id = 1;
  int32 points = 2;
}

// CreateRequest is a new character: every one starts as the class at the root of the tree, so there is no class to ask for.
message CreateRequest {
  string account_id = 1;
  string name = 2;
  reserved 3;
  reserved "class";
}

message CreateResponse {
  Character character = 1;
}

message ListRequest {
  string account_id = 1;
}

message ListResponse {
  repeated Character characters = 1;
}

message LoadRequest {
  string character_id = 1;
  // The owner the caller claims; the character must belong to it.
  string account_id = 2;
}

message LoadResponse {
  Character character = 1;
  // Its active and finished quests.
  repeated Quest quests = 2;
  // Its skills with points, by ID.
  repeated SkillPoints skills = 3;
}

message SaveCheckpointRequest {
  string character_id = 1;
  // The map the character is on, or is moving to on a map change.
  string map_id = 2;
  double x = 3;
  double y = 4;
  int32 hp = 5;
  int32 mp = 6;
  int64 exp = 7;
  // The whole progression, so any checkpoint repairs a level-up save that was lost: the level, the points spent and unspent, and the free reset.
  int32 level = 8;
  Stats points = 9;
  int32 unspent_points = 10;
  bool free_reset_used = 11;
  // Every quest the character has, active and finished, so any checkpoint repairs one that was lost: a stored quest not listed goes, as one abandoned before it was ever finished does.
  repeated Quest quests = 12;
  int32 unspent_skill_points = 13;
  // Every skill with points; points are never taken back, so a stored skill not listed keeps its own.
  repeated SkillPoints skills = 14;
}

message SaveCheckpointResponse {}

message SaveLevelUpRequest {
  string character_id = 1;
  int32 level = 2;
  int64 exp = 3;
  Stats points = 4;
  int32 hp = 5;
  int32 mp = 6;
}

message SaveLevelUpResponse {}
