syntax = "proto3";

package internal.world.v1;

option go_package = "finga/api/gen/world/v1;worldv1";

// WorldService runs the map instances at its tick rate, which Join reports; commands return once queued, their effects arrive on Deliver, and a failure carries a Reason in google.rpc.ErrorInfo. Equip and Unequip return once applied, their refusals carrying the item service's Reason.
service WorldService {
  // Deliver streams Subscribed, then every event for the players who joined through that gateway; one that falls behind loses the stream and its players, so it resubscribes and rejoins them.
  rpc Deliver(DeliverRequest) returns (stream DeliverResponse);
  // Join loads the account's character, grants missing starter items, and joins it to its map.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Leave removes a player who joined through that connection and saves a checkpoint.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // Input queues held keys with their sequence number (one per tick).
  rpc Input(InputRequest) returns (InputResponse);
  // Attack queues a basic attack the way the character faces.
  rpc Attack(AttackRequest) returns (AttackResponse);
  // PickUp does nothing: drops fly to their owners by themselves. It answers for a gateway that still routes the key.
  rpc PickUp(PickUpRequest) returns (PickUpResponse) {
    option deprecated = true;
  }
  // EnterPortal takes the portal the character stands in, if any.
  rpc EnterPortal(EnterPortalRequest) returns (EnterPortalResponse);
  // Say is a map chat line, already cleaned by the social service.
  rpc Say(SayRequest) returns (SayResponse);
  // Equip wears an inventory item, checked against the character's live level and class; it answers once the new stats apply, with InventoryChanged and StatsChanged on Deliver.
  rpc Equip(EquipRequest) returns (EquipResponse);
  // Unequip puts a worn item back in the Equip tab; it answers once the new stats apply.
  rpc Unequip(UnequipRequest) returns (UnequipResponse);
  // SpendPoints adds unspent points to the character's stats; it answers once the new stats apply, with StatsChanged on Deliver.
  rpc SpendPoints(SpendPointsRequest) returns (SpendPointsResponse);
  // ResetPoints returns every spent point to unspent, using the one free reset; it answers once the new stats apply.
  rpc ResetPoints(ResetPointsRequest) returns (ResetPointsResponse);
  // SpendSkillPoints invests unspent skill points in skills the character's class can learn; it answers once the new sheet applies, with StatsChanged on Deliver.
  rpc SpendSkillPoints(SpendSkillPointsRequest) returns (SpendSkillPointsResponse);
  // Talk opens the dialog of an NPC within reach on the character's map; it answers once the NpcDialog is queued on Deliver.
  rpc Talk(TalkRequest) returns (TalkResponse);
  // AcceptQuest takes a quest the NPC within reach gives, once the character meets its conditions; it answers once the quest is in the log, with QuestChanged on Deliver, and saved.
  rpc AcceptQuest(AcceptQuestRequest) returns (AcceptQuestResponse);
  // AbandonQuest drops an active quest and its progress, and saves; one not active is left as it is.
  rpc AbandonQuest(AbandonQuestRequest) returns (AbandonQuestResponse);
  // HandInQuest hands a ready quest in to the NPC within reach that takes it: the item service takes what it asks to collect and gives its item rewards, then the world awards its EXP. It answers once applied, an item service refusal carrying that service's Reason.
  rpc HandInQuest(HandInQuestRequest) returns (HandInQuestResponse);
  // UseItem drinks a potion: the item service takes one from its stack, then the world restores its HP or MP. It answers once applied, with InventoryChanged and StatsChanged on Deliver, an item service refusal carrying that service's Reason.
  rpc UseItem(UseItemRequest) returns (UseItemResponse);
  // UseSkill uses an active skill the character has points in, the way it faces; it answers once the tick resolves it, with SkillUsed, Damage and StatsChanged on Deliver.
  rpc UseSkill(UseSkillRequest) returns (UseSkillResponse);
  // Promote moves the character to the class the NPC within reach trains, once their class is its parent and they meet every condition: the item service gives the trainer's weapon, then the class changes. It answers once applied, with Promoted on Deliver, an item service refusal carrying that service's Reason.
  rpc Promote(PromoteRequest) returns (PromoteResponse);
}

enum Reason {
  REASON_UNSPECIFIED = 0;
  // The world cannot take the player now (an instance's inbox is full).
  REASON_BUSY = 1;
  // The character is on a map the world does not run.
  REASON_NO_MAP = 2;
  REASON_STOPPED = 3;
  // No Deliver stream is open for the gateway.
  REASON_NOT_SUBSCRIBED = 4;
  // Retired with PickUp: nothing answers them.
  REASON_PICKUPS_UNAVAILABLE = 5 [deprecated = true];
  REASON_PICKUP_BUSY = 6 [deprecated = true];
  REASON_BAD_ID = 7;
  // The character's class has no formulas in the game data.
  REASON_CLASS_UNAVAILABLE = 8;
  // A dead character can't change what it wears.
  REASON_CHARACTER_DEAD = 9;
  // The character's unspent points are not the count the request expected: an earlier spend or a level-up came first.
  REASON_POINTS_CHANGED = 10;
  // The points add up to more than the character has unspent.
  REASON_NOT_ENOUGH_POINTS = 11;
  // The one free reset is used.
  REASON_NO_FREE_RESET = 12;
  // A negative number of points, or none at all.
  REASON_BAD_POINTS = 13;
  // The NPC isn't on the character's map, or is farther than the talk reach.
  REASON_NPC_OUT_OF_REACH = 14;
  // The NPC doesn't give, or take back, that quest.
  REASON_QUEST_UNAVAILABLE = 15;
  REASON_QUEST_CONDITIONS_UNMET = 16;
  REASON_QUEST_ALREADY_ACTIVE = 17;
  // A one-time quest the character has finished.
  REASON_QUEST_ALREADY_FINISHED = 18;
  // The character has the most active quests already.
  REASON_TOO_MANY_QUESTS = 19;
  // The quest isn't active, or a kill, talk or level objective is left.
  REASON_QUEST_NOT_READY = 20;
  // An HP potion at full HP, or an MP potion at full MP: nothing would be restored, so nothing is spent.
  REASON_HP_FULL = 21;
  REASON_MP_FULL = 22;
  // A template the game data has no potion of.
  REASON_NOT_USABLE = 23;
  REASON_SKILL_POINTS_CHANGED = 24;
  REASON_NOT_ENOUGH_SKILL_POINTS = 25;
  // A skill the character's class, and every class above it, doesn't teach.
  REASON_SKILL_NOT_LEARNABLE = 26;
  // Skill points below one in all, or any negative.
  REASON_BAD_SKILL_POINTS = 27;
  // No points in the skill, a skill the game data doesn't have, or one the character's class can't learn.
  REASON_SKILL_NOT_LEARNED = 28;
  // A passive skill is always on and can't be used.
  REASON_SKILL_PASSIVE = 29;
  // A damaging skill in a town.
  REASON_NOT_IN_TOWN = 30;
  REASON_SKILL_COOLING_DOWN = 31;
  REASON_NOT_ENOUGH_MP = 32;
  // Another skill use already waits for the character's next action turn.
  REASON_SKILL_WAITING = 33;
  // A promotion condition the character doesn't meet.
  REASON_PROMOTION_CONDITIONS_UNMET = 34;
  // A class the NPC doesn't train, or one whose parent isn't the character's class.
  REASON_NOT_YOUR_NEXT_CLASS = 35;
}

// Presence routes a command to the map the caller believes the character is on.
message Presence {
  string character_id = 1;
  // Ignored: the world knows each character's map; buf's FILE rules keep a published field.
  string map_id = 2 [deprecated = true];
  // The connection the character joined through; a command from any other is ignored.
  string connection_id = 3;
}

message Keys {
  bool left = 1;
  bool right = 2;
  bool up = 3;
  bool down = 4;
  bool jump = 5;
}

// Stats are a character's base stats; the same fields as the character service's, owned here.
message Stats {
  int32 strength = 1;
  int32 dexterity = 2;
  int32 intelligence = 3;
  int32 agility = 4;
  int32 vitality = 5;
}

// CharacterView is the player's own character, for Welcome and LevelUp.
message CharacterView {
  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  int64 exp = 5;
  Stats stats = 6;
  int32 hp = 7;
  int32 max_hp = 8;
  int32 mp = 9;
  int32 max_mp = 10;
  string map_id = 11;
  double x = 12;
  double y = 13;
  // The totals with what is worn, and the equipment's share.
  StatSheet sheet = 14;
}

// StatSheet is what the character window shows: the totals, and the equipment's share of each, the totals less those without it; the points; and the basic attack's length in ticks.
message StatSheet {
  Stats primary = 1;
  Stats primary_worn = 2;
  DerivedStats derived = 3;
  DerivedStats derived_worn = 4;
  Points points = 5;
  uint32 attack_length_ticks = 6;
  // What the passive skills add, as primary_worn and derived_worn are what the equipment adds.
  Stats primary_skills = 7;
  DerivedStats derived_skills = 8;
  SkillPoints skills = 9;
}

// SkillPoints are the skill points: those not yet invested, and those invested in each skill.
message SkillPoints {
  int32 unspent = 1;
  // By skill ID; a skill with none isn't listed.
  map<string, int32> invested = 2;
}

// Points are the stat points: those not yet spent, those spent in each stat, and whether the free reset is left.
message Points {
  int32 unspent = 1;
  Stats spent = 2;
  bool free_reset_left = 3;
}

// DerivedStats are the computed stats: rates, crit damage and penetration as fractions, regen in points a second.
message DerivedStats {
  double physical_attack = 1;
  double physical_defense = 2;
  double accuracy = 3;
  double evasion = 4;
  double crit_rate = 5;
  double crit_damage = 6;
  int32 max_hp = 7;
  int32 max_mp = 8;
  double magic_attack = 9;
  double magic_defense = 10;
  double penetration = 11;
  double hp_regen = 12;
  double mp_regen = 13;
  double attack_speed = 14;
  double cooldown_speed = 15;
  double move_speed = 16;
}

message DeliverRequest {
  // The subscribing gateway node; a second subscription with the same ID replaces the first.
  string gateway_id = 1;
}

// DeliverResponse is one event for one player, or a Frame for the gateway's players on a map.
message DeliverResponse {
  // Empty for Subscribed and Frame, as is connection_id.
  string character_id = 1;
  // The connection the character joined through; the gateway routes by it.
  string connection_id = 15;
  // The instance's tick when the event happened.
  uint64 tick = 2;
  oneof event {
    Subscribed subscribed = 3;
    Snapshot snapshot = 4;
    // Replaced by frame, which carries each tick's Delta once for all the gateway's players on the map.
    Delta delta = 5 [deprecated = true];
    Teleport teleport = 6;
    Damage damage = 7;
    Died died = 8;
    Respawned respawned = 9;
    ExpGained exp_gained = 10;
    LevelUp level_up = 11;
    Chat chat = 12;
    InventoryChanged inventory_changed = 13;
    // Retired with PickUp: never sent.
    PickupFailed pickup_failed = 14 [deprecated = true];
    Detached detached = 16;
    Frame frame = 17;
    StatsChanged stats_changed = 18;
    Loot loot = 19;
    NpcDialog npc_dialog = 20;
    QuestChanged quest_changed = 21;
    SkillUsed skill_used = 22;
    Promoted promoted = 23;
    FieldBoss field_boss = 24;
    FieldBossGone field_boss_gone = 25;
  }
}

// Frame is a map's Delta for one tick, sent once to each gateway with players there, each recipient getting it with its own ack_seq.
message Frame {
  // What changed on the map; its ack_seq is unset.
  Delta delta = 1;
  repeated Recipient recipients = 2;
}

// Recipient is a player a Frame goes to.
message Recipient {
  string character_id = 1;
  // The connection the character joined through; the gateway routes by it.
  string connection_id = 2;
  // The latest input sequence applied for this player.
  uint32 ack_seq = 3;
}

// Detached is the character off every map through this connection, as a portal's transfer or a login elsewhere failed; the gateway joins it again, where it was last saved.
message Detached {}

// Subscribed is a stream's first message.
message Subscribed {
  // Random per process start: a new value means the service restarted.
  string boot_id = 1;
}

// PlayerView is a player as everyone on the map sees it.
message PlayerView {
  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  int32 hp = 5;
  int32 max_hp = 6;
  bool dead = 7;
  bool invulnerable = 8;
  double x = 9;
  double y = 10;
  double vx = 11;
  double vy = 12;
  int32 facing = 13;
  bool on_ground = 14;
  bool climbing = 15;
}

// MobView is a mob as everyone on the map sees it.
message MobView {
  uint64 id = 1;
  string type = 2;
  double x = 3;
  double y = 4;
  int32 facing = 5;
  int32 hp = 6;
  int32 max_hp = 7;
}

// DropView is an item on the ground.
message DropView {
  uint64 id = 1;
  string template = 2;
  int32 quantity = 3;
  double x = 4;
  double y = 5;
  // The character it flies to once collected.
  string owner_id = 6;
}

// Snapshot is the whole map, sent on join.
message Snapshot {
  string map_id = 1;
  repeated PlayerView players = 2;
  repeated MobView mobs = 3;
  repeated DropView drops = 4;
  // The map's field boss, while one is up.
  FieldBoss field_boss = 5;
}

// Delta is what changed in one tick, for one player.
message Delta {
  // The latest input sequence applied for this player.
  uint32 ack_seq = 1;
  repeated PlayerView players = 2;
  repeated MobView mobs = 3;
  repeated DropView drops = 4;
  repeated string removed_players = 5;
  // Mobs gone: killed, or a field boss that left unbeaten.
  repeated uint64 removed_mobs = 6;
  // Drops gone without reaching an inventory: expired or lost.
  repeated uint64 removed_drops = 7;
  // Drops that left the ground for their owners' inventories.
  repeated uint64 collected_drops = 8;
}

// Teleport moves the player to another map; the target instance sends the Snapshot.
message Teleport {
  string map_id = 1;
  double x = 2;
  double y = 3;
}

message EntityRef {
  oneof ref {
    string character_id = 1;
    uint64 mob_id = 2;
  }
}

// Damage is one resolved hit.
message Damage {
  EntityRef source = 1;
  EntityRef target = 2;
  int32 amount = 3;
  bool crit = 4;
  bool miss = 5;
}

// FieldBoss says the map's field boss is up: as it appears, and in the Snapshot of anyone joining while it is.
message FieldBoss {
  // Its mob, which frames carry as any other.
  uint64 mob_id = 1;
  // Its mob type in game data.
  string type = 2;
  // How long until it leaves unbeaten, from the event's tick.
  int64 leaves_in_ms = 3;
}

// FieldBossGone says the map's field boss fell, or left unbeaten.
message FieldBossGone {
  uint64 mob_id = 1;
  bool beaten = 2;
}

// SkillUsed says a character used a skill at a stage, an index into its stages in game data, facing 1 right or -1 left.
message SkillUsed {
  string caster = 1;
  string skill = 2;
  int32 stage = 3;
  int32 facing = 4;
}

message Died {
  string character_id = 1;
  double x = 2;
  double y = 3;
}

message Respawned {
  string character_id = 1;
  string map_id = 2;
  double x = 3;
  double y = 4;
  int32 hp = 5;
}

// ExpGained is EXP awarded (negative for the death penalty) and the total after it.
message ExpGained {
  int64 amount = 1;
  int64 exp = 2;
}

// LevelUp carries the player's new level, stats, and restored HP and MP.
message LevelUp {
  CharacterView character = 1;
}

// Promoted carries the player's character in its new class, with HP and MP restored and the new sheet.
message Promoted {
  CharacterView character = 1;
}

// Chat is a map line.
message Chat {
  string sender_id = 1;
  string sender_name = 2;
  string text = 3;
}

// InventoryChanged is the slots and equip slots a committed grant, equip or unequip changed.
message InventoryChanged {
  repeated Slot slots = 1;
  // The inventory's revision these slots show, from the item service; 0 when it gave none.
  uint64 revision = 2;
  repeated EquipSlot equipment = 3;
}

// EquipSlot is one changed equip slot, item unset when it emptied.
message EquipSlot {
  string equip_slot = 1;
  Item item = 2;
}

// StatsChanged is the player's HP and MP after gear, points, regen or a potion changed them. The sheet comes only when it changed (gear, points, skill points); unset, the gateway passes it on unset.
message StatsChanged {
  StatSheet sheet = 1;
  int32 hp = 2;
  int32 max_hp = 3;
  int32 mp = 4;
  int32 max_mp = 5;
}

// Slot is one changed inventory slot, item unset when it emptied: the same fields as the item service's, owned here.
message Slot {
  string tab = 1;
  int32 slot = 2;
  Item item = 3;
}

// Item is one stack in a slot, or an item worn.
message Item {
  string id = 1;
  string template_id = 2;
  // equip, use or etc; empty when worn.
  string tab = 3;
  int32 slot = 4;
  int32 quantity = 5;
  // What it rolled when it dropped; set for equipment only.
  ItemStats stats = 6;
}

// ItemStats are what one equipment item gives, the same fields as the item service's, owned here: the five primary stats and the sixteen derived, rates, crit damage and penetration in tenths of a percent, regen in tenths of a point a second.
message ItemStats {
  int32 physical_attack = 1;
  int32 physical_defense = 2;
  int32 str = 3;
  int32 dex = 4;
  int32 int = 5;
  int32 agi = 6;
  int32 vit = 7;
  int32 accuracy = 8;
  int32 evasion = 9;
  int32 crit_rate = 10;
  int32 crit_damage = 11;
  int32 max_hp = 12;
  int32 max_mp = 13;
  int32 magic_attack = 14;
  int32 magic_defense = 15;
  int32 penetration = 16;
  int32 hp_regen = 17;
  int32 mp_regen = 18;
  int32 attack_speed = 19;
  int32 cooldown_speed = 20;
  int32 move_speed = 21;
}

// LootKind is what became of a drop.
enum LootKind {
  LOOT_KIND_UNSPECIFIED = 0;
  // In its owner's inventory.
  LOOT_KIND_COLLECTED = 1;
  // On the ground until its owner has room.
  LOOT_KIND_WAITING = 2;
  // Gone at the end of its life, never collected.
  LOOT_KIND_LOST = 3;
}

// Loot tells a player what became of a drop: collected goes to its owner and the party members on the map, waiting and lost to the owner only.
message Loot {
  LootKind kind = 1;
  // The map whose drop it is: drop IDs are a map's own.
  string map_id = 2;
  uint64 drop_id = 3;
  string owner_id = 4;
  string owner_name = 5;
  string template = 6;
  int32 quantity = 7;
}

// PickupFailed said why a pickup did not happen. Retired with PickUp.
message PickupFailed {
  // The proto package of the service whose Reason this is.
  string error_domain = 1;
  // The Reason's value name, such as REASON_EQUIP_TAB_FULL; empty when unexpected.
  string error_reason = 2;
}

message JoinRequest {
  string gateway_id = 1;
  // The gateway's connection; a later Leave must name the same one.
  string connection_id = 2;
  string account_id = 3;
  string character_id = 4;
}

message JoinResponse {
  CharacterView character = 1;
  // The world's ticks per second; the client times its prediction and interpolation by it.
  uint32 tick_rate_hz = 2;
  // Rises with each join, across restarts too, so the character's later login has the higher one; social orders logins by it.
  uint64 join_seq = 3;
  // The quest log: active quests with their counts, and finished ones with how often.
  repeated QuestState quests = 4;
  // The skills' cooldowns and buffs still running, carried from the last checkpoint.
  repeated SkillTimer timers = 5;
}

// SkillTimer is the time left on one of a skill's cooldown or buff.
message SkillTimer {
  string skill_id = 1;
  SkillTimerKind kind = 2;
  int64 left_ms = 3;
  // The points a buff was used with; 0 for a cooldown.
  int32 points = 4;
}

enum SkillTimerKind {
  SKILL_TIMER_KIND_UNSPECIFIED = 0;
  SKILL_TIMER_KIND_COOLDOWN = 1;
  SKILL_TIMER_KIND_BUFF = 2;
}

message LeaveRequest {
  Presence presence = 1;
  // Ignored: the presence names the connection; buf's FILE rules keep a published field.
  string connection_id = 2 [deprecated = true];
}

message LeaveResponse {}

message InputRequest {
  Presence presence = 1;
  uint32 seq = 2;
  Keys keys = 3;
}

message InputResponse {}

message AttackRequest {
  Presence presence = 1;
}

message AttackResponse {}

message PickUpRequest {
  Presence presence = 1;
}

message PickUpResponse {}

message EnterPortalRequest {
  Presence presence = 1;
}

message EnterPortalResponse {}

message SayRequest {
  Presence presence = 1;
  string sender_name = 2;
  string text = 3;
}

message SayResponse {}

message EquipRequest {
  Presence presence = 1;
  // The client's request ID, the item service's idempotency key.
  string idempotency_key = 2;
  string item_id = 3;
  // Needed for rings only.
  string equip_slot = 4;
}

message EquipResponse {}

message UnequipRequest {
  Presence presence = 1;
  // The client's request ID, the item service's idempotency key.
  string idempotency_key = 2;
  string equip_slot = 3;
  // The Equip-tab slot to put it in; unset, the first free one.
  optional int32 to_slot = 4;
}

message UnequipResponse {}

message SpendPointsRequest {
  Presence presence = 1;
  // The unspent count the client saw; any other refuses the spend, so a retried one lands once.
  int32 expected_unspent = 2;
  // How many points go to each stat.
  Stats points = 3;
}

message SpendPointsResponse {}

message SpendSkillPointsRequest {
  Presence presence = 1;
  // The unspent count the client saw; any other refuses the spend, so a retried one lands once.
  int32 expected_unspent = 2;
  // How many points go to each skill, by skill ID.
  map<string, int32> points = 3;
}

message SpendSkillPointsResponse {}

message UseSkillRequest {
  Presence presence = 1;
  // The skill ID.
  string skill = 2;
}

message PromoteRequest {
  Presence presence = 1;
  string npc_id = 2;
  // The class the NPC trains, as its dialog offered it.
  string class = 3;
}

message PromoteResponse {}

message UseSkillResponse {}

message ResetPointsRequest {
  Presence presence = 1;
  // The unspent count the client saw; any other refuses the reset.
  int32 expected_unspent = 2;
}

message ResetPointsResponse {}

message TalkRequest {
  Presence presence = 1;
  string npc_id = 2;
}

message TalkResponse {}

// NpcDialog is what an NPC offers the character now, from its live state, so it agrees with what the world would allow.
message NpcDialog {
  string npc_id = 1;
  // The quests it gives, in npcs.yaml's order.
  repeated QuestOffer gives = 2;
  // The character's active quests it takes back.
  repeated QuestTurnIn takes = 3;
  // Set when the NPC trains a class whose parent is the character's.
  PromotionOffer promotion = 4;
}

// PromotionOffer is a trainer's promotion: each condition, with what the character has.
message PromotionOffer {
  string class = 1;
  repeated PromotionCondition conditions = 2;
}

// PromotionCondition is one thing a promotion asks, met when have reaches need.
message PromotionCondition {
  PromotionConditionKind kind = 1;
  // The stat (str, dex, int, agi or vit), skill or quest it names; empty for the level.
  string id = 2;
  int32 need = 3;
  int32 have = 4;
}

enum PromotionConditionKind {
  PROMOTION_CONDITION_KIND_UNSPECIFIED = 0;
  PROMOTION_CONDITION_KIND_LEVEL = 1;
  // Own stat points, without gear.
  PROMOTION_CONDITION_KIND_STAT = 2;
  // Points invested in the skill.
  PROMOTION_CONDITION_KIND_SKILL = 3;
  // The quest finished: need 1, and have 1 once it is.
  PROMOTION_CONDITION_KIND_QUEST = 4;
}

// QuestOfferState is where a quest an NPC gives stands for the character.
enum QuestOfferState {
  QUEST_OFFER_STATE_UNSPECIFIED = 0;
  QUEST_OFFER_STATE_AVAILABLE = 1;
  QUEST_OFFER_STATE_ACTIVE = 2;
  // A one-time quest already finished.
  QUEST_OFFER_STATE_FINISHED = 3;
  // The character doesn't meet its conditions yet; unmet lists them.
  QUEST_OFFER_STATE_CONDITIONS_UNMET = 4;
}

message QuestOffer {
  string quest_id = 1;
  QuestOfferState state = 2;
  QuestConditions unmet = 3;
}

// QuestConditions are what a character lacks to accept a quest; an unset field is met.
message QuestConditions {
  // The least level, when the character's is lower.
  int32 level = 1;
  // The class it asks for, when the character is another.
  string class = 2;
  // The quests to finish first.
  repeated string quests = 3;
}

// QuestTurnIn is an active quest an NPC takes back: ready once every kill, talk and level objective is done; the item service counts what it asks to collect.
message QuestTurnIn {
  string quest_id = 1;
  bool ready = 2;
}

message AcceptQuestRequest {
  Presence presence = 1;
  string npc_id = 2;
  string quest_id = 3;
}

message AcceptQuestResponse {}

message AbandonQuestRequest {
  Presence presence = 1;
  string quest_id = 2;
}

message AbandonQuestResponse {}

message HandInQuestRequest {
  Presence presence = 1;
  string npc_id = 2;
  string quest_id = 3;
}

message HandInQuestResponse {}

message UseItemRequest {
  Presence presence = 1;
  // The client's request ID, the item service's idempotency key.
  string idempotency_key = 2;
  string item_id = 3;
  // The template the client saw, which says what the potion restores; the item service checks the item is one.
  string template = 4;
}

message UseItemResponse {}

// QuestStatus is where a character stands with a quest of its log.
enum QuestStatus {
  // Not in the log: abandoned before it was ever finished.
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_ACTIVE = 1;
  QUEST_STATUS_FINISHED = 2;
}

// QuestState is one quest of a character's log.
message QuestState {
  string quest_id = 1;
  QuestStatus status = 2;
  // One count per objective, in the quest's order; empty when finished. A collect objective's count is the inventory's, which the client reads itself.
  repeated int32 progress = 3;
  // Completions so far; a repeatable quest active again keeps its count.
  int32 times_finished = 4;
}

// QuestChange is what happened to a quest, for the combat channel's line.
enum QuestChange {
  QUEST_CHANGE_UNSPECIFIED = 0;
  QUEST_CHANGE_PROGRESSED = 1;
  QUEST_CHANGE_ACCEPTED = 2;
  QUEST_CHANGE_HANDED_IN = 3;
  QUEST_CHANGE_ABANDONED = 4;
}

// QuestChanged is one quest of the player's log after a tick, which merges that tick's changes to it.
message QuestChanged {
  QuestChange change = 1;
  QuestState quest = 2;
}
