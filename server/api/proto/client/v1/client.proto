syntax = "proto3";

// The browser's WebSocket protocol: one ClientMessage or ServerMessage per frame, binary over subprotocol finga.v1.proto, protojson with these field names over finga.v1.json.
package client.v1;

option go_package = "finga/api/gen/client/v1;clientv1";

// ClientMessage is one frame from the browser. Hot messages take field numbers below 16, a one-byte tag.
message ClientMessage {
  // Input, Attack and EnterPortal carry the input sequence number.
  uint32 seq = 1;
  // A command that wants a Response sets req; the Response carries it back.
  string req = 2;
  oneof body {
    Input input = 3;
    Attack attack = 4;
    // Retired: drops fly to their owners. The gateway ignores it, so an older client's press does nothing.
    PickUp pick_up = 5 [deprecated = true];
    EnterPortal enter_portal = 6;
    Ping ping = 7;
    ChatSend chat_send = 8;
    InventoryMove inventory_move = 9;
    InventoryDiscard inventory_discard = 10;
    PartyInvite party_invite = 11;
    PartyRespond party_respond = 12;
    PartyLeave party_leave = 13;
    PartyKick party_kick = 14;
    PartyPromote party_promote = 15;
    Hello hello = 16;
    Equip equip = 17;
    Unequip unequip = 18;
    SpendPoints spend_points = 19;
    ResetPoints reset_points = 20;
    Talk talk = 21;
    AcceptQuest accept_quest = 22;
    AbandonQuest abandon_quest = 23;
    HandInQuest hand_in_quest = 24;
  }
}

// ServerMessage is one frame to the browser.
message ServerMessage {
  // The req of the command a Response answers.
  string req = 1;
  // The map instance's tick for world events; 32 bits last 6.8 years at 20 Hz.
  uint32 tick = 2;
  oneof body {
    Delta delta = 3;
    Damage damage = 4;
    Correction correction = 5;
    Pong pong = 6;
    Response response = 7;
    InventoryChanged inventory_changed = 8;
    ExpGained exp_gained = 9;
    Died died = 10;
    Respawned respawned = 11;
    ChatMessage chat_message = 12;
    Snapshot snapshot = 13;
    MapChange map_change = 14;
    PartyState party_state = 15;
    PartyInvited party_invited = 16;
    LevelUp level_up = 17;
    Welcome welcome = 18;
    Kicked kicked = 19;
    StatsChanged stats_changed = 20;
    Loot loot = 21;
    NpcDialog npc_dialog = 22;
    QuestChanged quest_changed = 23;
    QuestLog quest_log = 24;
  }
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_MAP = 1;
  CHAT_CHANNEL_PARTY = 2;
}

// KickReason says why the server is about to close the connection.
enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  KICK_REASON_LOGGED_IN_ELSEWHERE = 1;
  KICK_REASON_OUTDATED_PROTOCOL = 2;
  KICK_REASON_SERVER_RESTART = 3;
  KICK_REASON_ABUSE = 4;
  KICK_REASON_UNAUTHENTICATED = 5;
  // The session ended: expired, logged out, or its token was reused.
  KICK_REASON_SESSION_EXPIRED = 6;
}

// Hello is the first message, within 5 seconds of connecting.
message Hello {
  string token = 1;
  int32 protocol_version = 2;
  string character_id = 3;
}

// Input is the held keys.
message Input {
  bool left = 1;
  bool right = 2;
  bool up = 3;
  bool down = 4;
  bool jump = 5;
}

// Attack swings or shoots the way the character faces.
message Attack {}

// PickUp took the nearest eligible drop in range. Retired: drops fly to their owners.
message PickUp {}

// EnterPortal uses the portal the character stands in.
message EnterPortal {}

// ChatSend is a chat line, up to 120 characters.
message ChatSend {
  ChatChannel channel = 1;
  string text = 2;
}

// PartyInvite invites a character on the same map.
message PartyInvite {
  string character_id = 1;
}

message PartyRespond {
  string invite_id = 1;
  bool accept = 2;
}

message PartyLeave {}

// PartyKick removes a member (leader only).
message PartyKick {
  string character_id = 1;
}

// PartyPromote hands leadership over (leader only).
message PartyPromote {
  string character_id = 1;
}

// InventoryMove moves an item to a slot of its tab.
message InventoryMove {
  string idempotency_key = 1;
  string item_id = 2;
  string tab = 3;
  int32 slot = 4;
}

// InventoryDiscard destroys some or all of an item.
message InventoryDiscard {
  string idempotency_key = 1;
  string item_id = 2;
  int32 quantity = 3;
}

// Equip wears an Equip-tab item; a worn item in that slot swaps into the slot it left.
message Equip {
  string idempotency_key = 1;
  string item_id = 2;
  // Needed for rings only: empty, an item takes the first empty slot of its kind, else the first.
  string equip_slot = 3;
}

// Unequip puts a worn item back in the Equip tab.
message Unequip {
  string idempotency_key = 1;
  string equip_slot = 2;
  // The Equip-tab slot to put it in; unset, the first free one.
  optional int32 to_slot = 3;
}

// SpendPoints adds unspent points to the stats; answered once they apply, with StatsChanged before the Response.
message SpendPoints {
  // The unspent count the client saw; any other is refused with points_changed, so a retried Apply lands once.
  int32 expected_unspent = 1;
  // How many points go to each stat.
  Stats points = 2;
}

// ResetPoints returns every spent point to unspent, using the one free reset.
message ResetPoints {
  // The unspent count the client saw; any other is refused with points_changed.
  int32 expected_unspent = 1;
}

// Talk opens the dialog of an NPC within talk reach; an NpcDialog follows on its own, and the Response says whether one comes.
message Talk {
  string npc_id = 1;
}

// AcceptQuest takes a quest the NPC within reach gives; a QuestChanged follows.
message AcceptQuest {
  string npc_id = 1;
  string quest_id = 2;
}

// AbandonQuest drops an active quest and its progress; one not active is left as it is.
message AbandonQuest {
  string quest_id = 1;
}

// HandInQuest hands a ready quest in to the NPC within reach that takes it; InventoryChanged, QuestChanged and ExpGained follow.
message HandInQuest {
  string npc_id = 1;
  string quest_id = 2;
}

message Ping {
  // Unix milliseconds.
  int64 client_time = 1;
}

message Stats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 agi = 4;
  int32 vit = 5;
}

// CharacterView is the player's own character.
message CharacterView {
  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  int64 exp = 5;
  Stats stats = 6;
  int32 hp = 7;
  int32 max_hp = 8;
  int32 mp = 9;
  int32 max_mp = 10;
  // The totals with what is worn, and the equipment's share.
  StatSheet sheet = 11;
}

// StatSheet is what the character window shows: the totals, and the equipment's share of each, the totals less those without it, so a capped rate shows what the equipment really adds; the points; and the basic attack's cooldown, which the attack gate counts.
message StatSheet {
  Stats primary = 1;
  Stats primary_worn = 2;
  DerivedStats derived = 3;
  DerivedStats derived_worn = 4;
  Points points = 5;
  uint32 attack_cooldown_ticks = 6;
}

// Points are the stat points: those not yet spent, those spent in each stat, and whether the free reset is left.
message Points {
  int32 unspent = 1;
  Stats spent = 2;
  bool free_reset_left = 3;
}

// DerivedStats are the computed stats: rates, crit damage and penetration as fractions, regen in points a second.
message DerivedStats {
  double physical_attack = 1;
  double physical_defense = 2;
  double accuracy = 3;
  double evasion = 4;
  double crit_rate = 5;
  double crit_damage = 6;
  int32 max_hp = 7;
  int32 max_mp = 8;
  double magic_attack = 9;
  double magic_defense = 10;
  double penetration = 11;
  double hp_regen = 12;
  double mp_regen = 13;
  double attack_speed = 14;
  double cooldown_speed = 15;
  double move_speed = 16;
}

// ItemView is one inventory slot's item, or a worn one.
message ItemView {
  string item_id = 1;
  string template = 2;
  // Empty when worn.
  string tab = 3;
  int32 slot = 4;
  int32 quantity = 5;
  // What it rolled when it dropped; set for equipment only.
  ItemStats stats = 6;
}

// ItemStats are what one equipment item gives, a whole number per stat: rates, crit damage and penetration in tenths of a percent, regen in tenths of a point a second.
message ItemStats {
  int32 physical_attack = 1;
  int32 physical_defense = 2;
  int32 str = 3;
  int32 dex = 4;
  int32 int = 5;
  int32 agi = 6;
  int32 vit = 7;
  int32 accuracy = 8;
  int32 evasion = 9;
  int32 crit_rate = 10;
  int32 crit_damage = 11;
  int32 max_hp = 12;
  int32 max_mp = 13;
  int32 magic_attack = 14;
  int32 magic_defense = 15;
  int32 penetration = 16;
  int32 hp_regen = 17;
  int32 mp_regen = 18;
  int32 attack_speed = 19;
  int32 cooldown_speed = 20;
  int32 move_speed = 21;
}

// EquipSlot is one equip slot and what it holds; item is unset when it is empty.
message EquipSlot {
  string equip_slot = 1;
  ItemView item = 2;
}

message PartyMember {
  string character_id = 1;
  string name = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  string map_id = 6;
  bool online = 7;
}

message PartyView {
  string leader = 1;
  repeated PartyMember members = 2;
}

// Welcome answers Hello.
message Welcome {
  // The rotated session token, used from now on.
  string token = 1;
  CharacterView character = 2;
  repeated ItemView inventory = 3;
  // Never set: the party follows Welcome in a PartyState, in order with every later party change.
  PartyView party = 4 [deprecated = true];
  string map_id = 5;
  uint32 tick = 6;
  // Unix milliseconds.
  int64 server_time = 7;
  // The world's ticks per second: each tick holds a whole number of movement steps (data/movement.yaml dt). 0 from an older server means 20.
  uint32 tick_rate_hz = 8;
  // The inventory's revision these items show, so an older InventoryChanged arriving later leaves them be.
  uint64 inventory_revision = 9;
  // What is worn, one entry per filled equip slot, at inventory_revision too.
  repeated EquipSlot equipment = 10;
  // The quest log: active quests with their counts, and finished ones with how often.
  repeated QuestState quests = 11;
}

// PlayerView is a character on the map as everyone sees it.
message PlayerView {
  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  double x = 5;
  double y = 6;
  double vx = 7;
  double vy = 8;
  // -1 left, 1 right.
  sint32 facing = 9;
  bool on_ground = 10;
  bool climbing = 11;
  int32 hp = 12;
  int32 max_hp = 13;
  bool dead = 14;
  // Set for a second after contact damage.
  bool invulnerable = 15;
}

// Mob and drop IDs count up within one map instance.
message MobView {
  uint32 id = 1;
  string type = 2;
  double x = 3;
  double y = 4;
  sint32 facing = 5;
  int32 hp = 6;
  int32 max_hp = 7;
}

// DropView is an item on the ground.
message DropView {
  uint32 id = 1;
  string template = 2;
  int32 quantity = 3;
  double x = 4;
  double y = 5;
  // The character it flies to once collected.
  string owner_id = 6;
}

// Snapshot is everything on the map, on join and map change.
message Snapshot {
  repeated PlayerView players = 1;
  repeated MobView mobs = 2;
  repeated DropView drops = 3;
}

// Delta is what changed this tick: new or changed entities, and the IDs that left.
message Delta {
  // The latest input sequence applied.
  uint32 ack_seq = 1;
  repeated PlayerView players = 2;
  repeated MobView mobs = 3;
  repeated DropView drops = 4;
  repeated string removed_players = 5;
  // A mob leaves the map only by dying, so these are the mobs killed this tick.
  repeated uint32 removed_mobs = 6;
  // Drops gone without reaching an inventory: expired or lost.
  repeated uint32 removed_drops = 7;
  // Drops that left the ground for their owners' inventories: each flies to its owner.
  repeated uint32 collected_drops = 8;
}

// Correction tells the client its prediction diverged at seq.
message Correction {
  uint32 seq = 1;
  double x = 2;
  double y = 3;
  double vx = 4;
  double vy = 5;
  bool on_ground = 6;
  bool climbing = 7;
}

// Damage is one resolved hit; source and target are "p:<character id>" or "m:<mob id>".
message Damage {
  string source = 1;
  string target = 2;
  int32 amount = 3;
  bool crit = 4;
  bool miss = 5;
}

message Died {
  string character_id = 1;
  double x = 2;
  double y = 3;
}

message Respawned {
  string character_id = 1;
  string map_id = 2;
  double x = 3;
  double y = 4;
  int32 hp = 5;
}

// ExpGained is EXP awarded (negative for the death penalty) and the total within the level after it.
message ExpGained {
  int64 amount = 1;
  int64 exp = 2;
}

// LevelUp carries the new level and stats.
message LevelUp {
  CharacterView character = 1;
}

// InventorySlot is a slot after a change; item is unset when it emptied.
message InventorySlot {
  string tab = 1;
  int32 slot = 2;
  ItemView item = 3;
}

// InventoryChanged is slots and equip slots as they stood at the inventory's revision: each keeps the newest view it got, so an older one arriving late is skipped.
message InventoryChanged {
  repeated InventorySlot slots = 1;
  // The count of the inventory's and equipment's changes; 0 is a change stored before revisions, applied as it comes.
  uint64 revision = 2;
  repeated EquipSlot equipment = 3;
}

// LootKind is what became of a drop.
enum LootKind {
  LOOT_KIND_UNSPECIFIED = 0;
  // In its owner's inventory.
  LOOT_KIND_COLLECTED = 1;
  // On the ground until its owner has room.
  LOOT_KIND_WAITING = 2;
  // Gone at the end of its life, never collected.
  LOOT_KIND_LOST = 3;
}

// Loot tells what became of a drop: collected goes to its owner and the party members on the map, waiting and lost to the owner only.
message Loot {
  LootKind kind = 1;
  // The map whose drop it is: drop IDs are a map's own.
  string map_id = 2;
  uint32 drop_id = 3;
  string owner_id = 4;
  string owner_name = 5;
  string template = 6;
  int32 quantity = 7;
}

// StatsChanged is the player's stats after what it wears changed.
message StatsChanged {
  StatSheet sheet = 1;
  int32 hp = 2;
  int32 max_hp = 3;
  int32 mp = 4;
  int32 max_mp = 5;
}

// MapChange follows a portal.
message MapChange {
  string map_id = 1;
  double x = 2;
  double y = 3;
}

// ChatMessage is a line from a player, the sender's own echo included.
message ChatMessage {
  ChatChannel channel = 1;
  string sender = 2;
  string sender_name = 3;
  string text = 4;
}

// PartyState is the whole party after any change; party is unset when there is none.
message PartyState {
  PartyView party = 1;
}

message PartyInvited {
  string invite_id = 1;
  string from = 2;
  string from_name = 3;
}

// Response answers a command that carried a req, or reports a refused one without.
message Response {
  bool ok = 1;
  // An error code from server/testdata/errors/codes.json; empty when ok.
  string code = 2;
  string message = 3;
}

// Kicked precedes a server-side close.
message Kicked {
  KickReason reason = 1;
}

message Pong {
  int64 client_time = 1;
  int64 server_time = 2;
}

// NpcDialog is what an NPC offers the character now, as the server would allow it.
message NpcDialog {
  string npc_id = 1;
  // The quests it gives, in npcs.yaml's order.
  repeated QuestOffer gives = 2;
  // The character's active quests it takes back.
  repeated QuestTurnIn takes = 3;
}

// QuestOfferState is where a quest an NPC gives stands for the character.
enum QuestOfferState {
  QUEST_OFFER_STATE_UNSPECIFIED = 0;
  QUEST_OFFER_STATE_AVAILABLE = 1;
  QUEST_OFFER_STATE_ACTIVE = 2;
  // A one-time quest already finished.
  QUEST_OFFER_STATE_FINISHED = 3;
  // The character doesn't meet its conditions yet; unmet lists them.
  QUEST_OFFER_STATE_CONDITIONS_UNMET = 4;
}

message QuestOffer {
  string quest_id = 1;
  QuestOfferState state = 2;
  QuestConditions unmet = 3;
}

// QuestConditions are what a character lacks to accept a quest; an unset field is met.
message QuestConditions {
  // The least level, when the character's is lower.
  int32 level = 1;
  // The class it asks for, when the character is another.
  string class = 2;
  // The quests to finish first.
  repeated string quests = 3;
}

// QuestTurnIn is an active quest an NPC takes back: ready once every kill, talk and level objective is done; what it asks to collect is counted at hand-in.
message QuestTurnIn {
  string quest_id = 1;
  bool ready = 2;
}

// QuestStatus is where a character stands with a quest of its log.
enum QuestStatus {
  // Not in the log: abandoned before it was ever finished.
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_ACTIVE = 1;
  QUEST_STATUS_FINISHED = 2;
}

// QuestState is one quest of the character's log.
message QuestState {
  string quest_id = 1;
  QuestStatus status = 2;
  // One count per objective, in the quest's order; empty when finished. A collect objective's count stays 0: the client counts its inventory.
  repeated int32 progress = 3;
  // Completions so far; a repeatable quest active again keeps its count.
  int32 times_finished = 4;
}

// QuestChange is what happened to a quest, for the combat channel's line.
enum QuestChange {
  QUEST_CHANGE_UNSPECIFIED = 0;
  QUEST_CHANGE_PROGRESSED = 1;
  QUEST_CHANGE_ACCEPTED = 2;
  QUEST_CHANGE_HANDED_IN = 3;
  QUEST_CHANGE_ABANDONED = 4;
}

// QuestChanged is one quest of the log after a server tick, which merges that tick's changes to it.
message QuestChanged {
  QuestChange change = 1;
  QuestState quest = 2;
}

// QuestLog replaces the whole log after the server joined the character again on its own, as after the world restarted, since changes made meanwhile may be lost; Welcome carries it otherwise.
message QuestLog {
  repeated QuestState quests = 1;
}
