syntax = "proto3";

// The browser's WebSocket protocol: one ClientMessage or ServerMessage per frame, binary over subprotocol finga.v1.proto, protojson with these field names over finga.v1.json.
package client.v1;

option go_package = "finga/api/gen/client/v1;clientv1";

// ClientMessage is one frame from the browser. Hot messages take field numbers below 16, a one-byte tag.
message ClientMessage {
  // 5 was PickUp, retired when drops flew to their owners; pouches are taken with TakeLoot.
  reserved 5;
  reserved "pick_up";

  // Input, Attack, UseSkill, EnterPortal, Teleport and SwitchChannel carry the input sequence number.
  uint32 seq = 1;
  // A command that wants a Response sets req; the Response carries it back.
  string req = 2;
  oneof body {
    Input input = 3;
    Attack attack = 4;
    EnterPortal enter_portal = 6;
    Ping ping = 7;
    ChatSend chat_send = 8;
    InventoryMove inventory_move = 9;
    InventoryDiscard inventory_discard = 10;
    PartyInvite party_invite = 11;
    PartyRespond party_respond = 12;
    PartyLeave party_leave = 13;
    PartyKick party_kick = 14;
    PartyPromote party_promote = 15;
    Hello hello = 16;
    Equip equip = 17;
    Unequip unequip = 18;
    SpendPoints spend_points = 19;
    ResetPoints reset_points = 20;
    Talk talk = 21;
    AcceptQuest accept_quest = 22;
    AbandonQuest abandon_quest = 23;
    HandInQuest hand_in_quest = 24;
    UseItem use_item = 25;
    SpendSkillPoints spend_skill_points = 26;
    UseSkill use_skill = 27;
    Promote promote = 28;
    InventoryDiscardMany inventory_discard_many = 29;
    Teleport teleport = 30;
    ChooseTrait choose_trait = 31;
    PvpQueue pvp_queue = 32;
    PvpLeaveQueue pvp_leave_queue = 33;
    PvpAnswer pvp_answer = 34;
    PvpForfeit pvp_forfeit = 35;
    AddToWardrobe add_to_wardrobe = 36;
    SetLook set_look = 37;
    TakeLoot take_loot = 38;
    SwitchChannel switch_channel = 39;
    Channels channels = 40;
  }
}

// ServerMessage is one frame to the browser.
message ServerMessage {
  // 5 was Correction, which the server never sent: a Delta's state and ack_seq correct the client.
  reserved 5;
  reserved "correction";
  // 28 was Announcement, news of a boss for every player online; a boss's map hears FieldBoss alone now.
  reserved 28;
  reserved "announcement";

  // The req of the command a Response answers.
  string req = 1;
  // The map instance's tick for world events; 32 bits last 6.8 years at 20 Hz.
  uint32 tick = 2;
  oneof body {
    Delta delta = 3;
    Damage damage = 4;
    Pong pong = 6;
    Response response = 7;
    InventoryChanged inventory_changed = 8;
    ExpGained exp_gained = 9;
    Died died = 10;
    Respawned respawned = 11;
    ChatMessage chat_message = 12;
    Snapshot snapshot = 13;
    MapChange map_change = 14;
    PartyState party_state = 15;
    PartyInvited party_invited = 16;
    LevelUp level_up = 17;
    Welcome welcome = 18;
    Kicked kicked = 19;
    StatsChanged stats_changed = 20;
    Loot loot = 21;
    NpcDialog npc_dialog = 22;
    QuestChanged quest_changed = 23;
    SkillUsed skill_used = 24;
    Promoted promoted = 25;
    FieldBoss field_boss = 26;
    FieldBossGone field_boss_gone = 27;
    AttackUsed attack_used = 29;
    MobAttacked mob_attacked = 30;
    TeleportCancelled teleport_cancelled = 31;
    PvpQueued pvp_queued = 32;
    PvpUnqueued pvp_unqueued = 33;
    PvpOffer pvp_offer = 34;
    PvpOfferGone pvp_offer_gone = 35;
    MatchState match_state = 36;
    MatchEnded match_ended = 37;
    PartySpots party_spots = 38;
    AreaEntered area_entered = 39;
    ArenaBar arena_bar = 40;
    WaypointFound waypoint_found = 41;
  }
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_MAP = 1;
  CHAT_CHANNEL_PARTY = 2;
}

// KickReason says why the server is about to close the connection.
enum KickReason {
  KICK_REASON_UNSPECIFIED = 0;
  KICK_REASON_LOGGED_IN_ELSEWHERE = 1;
  KICK_REASON_OUTDATED_PROTOCOL = 2;
  KICK_REASON_SERVER_RESTART = 3;
  KICK_REASON_ABUSE = 4;
  KICK_REASON_UNAUTHENTICATED = 5;
  // The session ended: expired, logged out, or its token was reused.
  KICK_REASON_SESSION_EXPIRED = 6;
}

// Hello is the first message, within 5 seconds of connecting.
message Hello {
  string token = 1;
  int32 protocol_version = 2;
  string character_id = 3;
}

// Input is the held keys.
message Input {
  bool left = 1;
  bool right = 2;
  bool up = 3;
  bool down = 4;
  bool jump = 5;
  // The server tick of the mobs the client drew, which the world blocks this input against.
  uint32 view = 6;
  // Walk mode, which never sprints, sent with every input as the sim steps it as Input.Walk (large-regions.md section 7).
  bool walk = 7;
}

// Attack swings or shoots the way the character faces.
message Attack {
  // The yaw it aims along, in radians from north toward east.
  float aim = 1;
  // 2 was the locked mob's id, before a lock could be a player.
  reserved 2;
  // The locked mob or enemy, "m:<id>" or "p:<id>", empty for none: hit first when the attack's shape reaches it, else the nearest it reaches.
  string target = 3;
}

// TakeLoot takes items from the player's own pouches within reach; its Response answers each pick.
message TakeLoot {
  repeated LootPick picks = 1;
}

// LootPick is one item of one of the player's pouches.
message LootPick {
  uint32 pouch = 1;
  // The item's id within its pouch.
  uint32 item = 2;
}

// PickAnswer is what one pick of a TakeLoot came to: taken when code is 0, else the code of why not.
message PickAnswer {
  LootPick pick = 1;
  int32 code = 2;
}

// EnterPortal uses the portal the character stands in.
message EnterPortal {}

// Teleport starts a channel to a waypoint, or to one of the old maps, answered as it starts; at its end a MapChange follows, as for a portal, unless a TeleportCancelled says what ended it first.
message Teleport {
  // One of the old maps, which have no waypoints, till the last is retired; a region is reached by its waypoints alone. Read only when waypoint is empty.
  string map_id = 1;
  // A waypoint's id across every region: one the character has found, or one in a region's main town. When set, it's the target.
  string waypoint = 2;
}

// SwitchChannel starts a 3-second channel, cancelled as a teleport's is, that moves the player to the same spot in another channel of their region: one open with room, as the Channels list shows. The Response comes once it starts; the MapChange and a Snapshot naming the channel, or a TeleportCancelled, come at its end. It carries the input sequence number.
message SwitchChannel {
  uint32 channel = 1;
}

// Channels asks for the open channels of the player's region; the Response carries them.
message Channels {}

// ChatSend is a chat line, up to chat.yaml's line_max characters after cleaning.
message ChatSend {
  ChatChannel channel = 1;
  string text = 2;
}

// PartyInvite invites a character on the same map.
message PartyInvite {
  string character_id = 1;
}

message PartyRespond {
  string invite_id = 1;
  bool accept = 2;
}

message PartyLeave {}

// PartyKick removes a member (leader only).
message PartyKick {
  string character_id = 1;
}

// PartyPromote hands leadership over (leader only).
message PartyPromote {
  string character_id = 1;
}

// InventoryMove moves an item to a slot of its tab.
message InventoryMove {
  string idempotency_key = 1;
  string item_id = 2;
  string tab = 3;
  int32 slot = 4;
}

// InventoryDiscard destroys some or all of an item.
message InventoryDiscard {
  string idempotency_key = 1;
  string item_id = 2;
  int32 quantity = 3;
}

// AddToWardrobe takes one of an item that holds a piece and adds the piece, the item's piece.<id>, to the account's wardrobe; answered with the changed slot as InventoryChanged.
message AddToWardrobe {
  string idempotency_key = 1;
  string item_id = 2;
}

// SetLook wears a look of collected pieces, alive and out of combat; answered once the world applied it, which every view then carries.
message SetLook {
  string idempotency_key = 1;
  Look look = 2;
}

// InventoryDiscardMany destroys several whole items or stacks at once, all or none: one to a tab's 24, each once, none worn.
message InventoryDiscardMany {
  string idempotency_key = 1;
  repeated string item_ids = 2;
}

// Equip wears an Equip-tab item; a worn item in that slot swaps into the slot it left.
message Equip {
  string idempotency_key = 1;
  string item_id = 2;
  // Needed for rings only: empty, an item takes the first empty slot of its kind, else the first.
  string equip_slot = 3;
}

// UseItem drinks a potion from the Use tab; answered once its HP applies. InventoryChanged and StatsChanged come on the world's stream, before or after the Response.
message UseItem {
  string idempotency_key = 1;
  string item_id = 2;
  // The template the client sees there, which says what it restores; the item service refuses the use when the item is another.
  string template = 3;
}

// Unequip puts a worn item back in the Equip tab.
message Unequip {
  string idempotency_key = 1;
  string equip_slot = 2;
  // The Equip-tab slot to put it in; unset, the first free one.
  optional int32 to_slot = 3;
}

// SpendPoints adds unspent points to the stats; answered once they apply. StatsChanged comes on the world's stream, before or after the Response.
message SpendPoints {
  // The unspent count the client saw; any other is refused with points_changed, so a retried Apply lands once.
  int32 expected_unspent = 1;
  // How many points go to each stat.
  Stats points = 2;
}

// SpendSkillPoints invests unspent skill points in skills the character's class can learn; answered once they apply. StatsChanged, whose sheet carries the skill points, comes on the world's stream, before or after the Response.
message SpendSkillPoints {
  // The unspent count the client saw; any other is refused with skill_points_changed, so a retried Apply lands once.
  int32 expected_unspent = 1;
  // How many points go to each skill, by skill ID.
  map<string, int32> points = 2;
}

// ChooseTrait sets the trait a skill the character has points in is used with: its default, or its extra once its points reach its last stage. Refused in combat; answered once it applies, and StatsChanged carries the sheet with it.
message ChooseTrait {
  string skill = 1;
  // The trait's ID, the default's included.
  string trait = 2;
}

// UseSkill uses an active skill the character has points in, the way it faces; answered once the tick resolves it. Its damage comes as Damage, its energy spent in the Delta, and SkillUsed tells the map.
message UseSkill {
  // The skill ID.
  string skill = 1;
  // The yaw it aims along, in radians from north toward east.
  float aim = 2;
  // 3 was the locked mob's id, before a lock could be a player.
  reserved 3;
  // The locked mob or enemy, "m:<id>" or "p:<id>", empty for none: a damage skill hits it first when its shape reaches it, else the nearest it reaches.
  string target = 6;
  // A moving skill's way, as the client worked it out as the skill started; unset for a skill that doesn't move.
  SkillWay way = 4;
  // The root of the key it was pressed on: the skill itself on its own key, or the root whose follow-up it is, which the world checks against its class's chains.
  string chain_root = 5;
}

// SkillWay is where a moving skill goes: along the unit vector (x, z), east and north, for length metres. The world refuses a vector more than 1e-6 off unit length, and holds the length to the skill's distance.
message SkillWay {
  double x = 1;
  double z = 2;
  double length = 3;
}

// Promote moves the character to the class the NPC within reach trains, as its dialog offered it; a Promoted follows, and the Response says whether it applied.
message Promote {
  string npc_id = 1;
  string class = 2;
}

// ResetPoints returns every spent point to unspent, using the one free reset.
message ResetPoints {
  // The unspent count the client saw; any other is refused with points_changed.
  int32 expected_unspent = 1;
}

// Talk opens the dialog of an NPC within talk reach; an NpcDialog follows on its own, and the Response says whether one comes.
message Talk {
  string npc_id = 1;
}

// AcceptQuest takes a quest the NPC within reach gives; a QuestChanged follows.
message AcceptQuest {
  string npc_id = 1;
  string quest_id = 2;
}

// AbandonQuest drops an active quest and its progress; one not active is left as it is.
message AbandonQuest {
  string quest_id = 1;
}

// HandInQuest hands a ready quest in to the NPC within reach that takes it; InventoryChanged, QuestChanged and ExpGained follow.
message HandInQuest {
  string npc_id = 1;
  string quest_id = 2;
}

message Ping {
  // Unix milliseconds.
  int64 client_time = 1;
}

message Stats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 agi = 4;
  int32 vit = 5;
}

// CharacterView is the player's own character.
message CharacterView {
  // 10 was max_mp: there is no MP.
  reserved 10;
  reserved "max_mp";

  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  int64 exp = 5;
  Stats stats = 6;
  int32 hp = 7;
  int32 max_hp = 8;
  // Energy as the player joins, from 0 to the game data's max; unset in LevelUp and Promoted, which leave it as it was, and each Delta carries it after.
  uint32 energy = 9;
  // The totals with what is worn, and the equipment's share.
  StatSheet sheet = 11;
}

// StatSheet is what the character window shows: the totals, and the equipment's share of each, the totals less those without it, so a capped rate shows what the equipment really adds; the points; and the basic attack's length, which the action clock counts.
message StatSheet {
  Stats primary = 1;
  Stats primary_worn = 2;
  DerivedStats derived = 3;
  DerivedStats derived_worn = 4;
  Points points = 5;
  uint32 attack_length_ticks = 6;
  // What the passive skills add, as primary_worn and derived_worn are what the equipment adds.
  Stats primary_skills = 7;
  DerivedStats derived_skills = 8;
  SkillPoints skills = 9;
  // The buffs running on the character, each from a skill: its own or a party member's.
  repeated BuffView buffs = 10;
}

// BuffView is one buff on the character: its skill, what's left of it as the sheet goes out, the points it was used with, and the character who used it, empty for the character's own or one whose giver was forgotten at a join.
message BuffView {
  string skill = 1;
  int64 left_ms = 2;
  int32 points = 3;
  string from = 4;
}

// SkillPoints are the skill points: those not yet invested, those invested in each skill, and each skill's chosen trait. A skill's stage comes from its points and the game data.
message SkillPoints {
  int32 unspent = 1;
  // By skill ID; a skill with none isn't listed.
  map<string, int32> invested = 2;
  // The chosen trait's ID by skill ID; a skill on its default isn't listed.
  map<string, string> traits = 3;
}

// Points are the stat points: those not yet spent, those spent in each stat, and whether the free reset is left.
message Points {
  int32 unspent = 1;
  Stats spent = 2;
  bool free_reset_left = 3;
}

// DerivedStats are the computed stats: rates, crit damage and penetration as fractions, regen in points a second.
message DerivedStats {
  // 14 was attack speed, which the game no longer has.
  reserved 14;
  reserved "attack_speed";
  // 8 and 13 were MP: there is no MP.
  reserved 8, 13;
  reserved "max_mp", "mp_regen";

  double physical_attack = 1;
  double physical_defense = 2;
  double accuracy = 3;
  double evasion = 4;
  double crit_rate = 5;
  double crit_damage = 6;
  int32 max_hp = 7;
  double magic_attack = 9;
  double magic_defense = 10;
  double penetration = 11;
  double hp_regen = 12;
  double cooldown_speed = 15;
  double move_speed = 16;
}

// ItemView is one inventory slot's item, or a worn one.
message ItemView {
  string item_id = 1;
  string template = 2;
  // Empty when worn.
  string tab = 3;
  int32 slot = 4;
  int32 quantity = 5;
  // What it rolled when it dropped; set for equipment only.
  ItemStats stats = 6;
}

// ItemStats are what one equipment item gives, a whole number per stat: rates, crit damage and penetration in tenths of a percent, regen in tenths of a point a second.
message ItemStats {
  // 19 was attack speed, which the game no longer has.
  reserved 19;
  reserved "attack_speed";
  // 13 and 18 were MP: there is no MP.
  reserved 13, 18;
  reserved "max_mp", "mp_regen";

  int32 physical_attack = 1;
  int32 physical_defense = 2;
  int32 str = 3;
  int32 dex = 4;
  int32 int = 5;
  int32 agi = 6;
  int32 vit = 7;
  int32 accuracy = 8;
  int32 evasion = 9;
  int32 crit_rate = 10;
  int32 crit_damage = 11;
  int32 max_hp = 12;
  int32 magic_attack = 14;
  int32 magic_defense = 15;
  int32 penetration = 16;
  int32 hp_regen = 17;
  int32 cooldown_speed = 20;
  int32 move_speed = 21;
}

// EquipSlot is one equip slot and what it holds; item is unset when it is empty.
message EquipSlot {
  string equip_slot = 1;
  ItemView item = 2;
}

message PartyMember {
  string character_id = 1;
  string name = 2;
  int32 level = 3;
  int32 hp = 4;
  int32 max_hp = 5;
  string map_id = 6;
  bool online = 7;
  string class = 8;
  // The region's channel, from 1, so the party frame says who's in another; 0 off regions.
  uint32 channel = 9;
}

message PartyView {
  string leader = 1;
  repeated PartyMember members = 2;
}

// Welcome answers Hello, and comes again after the server joined the character again on its own, as after the world restarted: the whole state the screen needs at once, as the server has it, since pushes in between may be lost. Data a window opens on demand loads with that window, never here.
message Welcome {
  // The rotated session token, used from now on; empty on a Welcome after such a rejoin, where the client keeps the one it has.
  string token = 1;
  CharacterView character = 2;
  repeated ItemView inventory = 3;
  // Never set: the party follows Welcome in a PartyState, in order with every later party change.
  PartyView party = 4 [deprecated = true];
  string map_id = 5;
  uint32 tick = 6;
  // Unix milliseconds.
  int64 server_time = 7;
  // The world's ticks per second: each tick holds a whole number of movement steps (data/movement.yaml dt). 0 from an older server means 20.
  uint32 tick_rate_hz = 8;
  // The inventory's revision these items show, so an older InventoryChanged arriving later leaves them be.
  uint64 inventory_revision = 9;
  // What is worn, one entry per filled equip slot, at inventory_revision too.
  repeated EquipSlot equipment = 10;
  // The quest log: active quests with their counts, and finished ones with how often.
  repeated QuestState quests = 11;
  // The skills' cooldowns and buffs still running, which a reload or reconnect keeps.
  repeated SkillTimer skill_timers = 12;
  // The ids of every waypoint the character has found, in any region.
  repeated string waypoints = 13;
}

// SkillTimer is the time left on one of a skill's cooldown or buff.
message SkillTimer {
  string skill = 1;
  SkillTimerKind kind = 2;
  int64 left_ms = 3;
  // The points a buff was used with, which give its bonus; 0 for a cooldown.
  int32 points = 4;
  // The extra trait a buff was used with, empty for the default and for a cooldown.
  string trait = 5;
}

enum SkillTimerKind {
  SKILL_TIMER_KIND_UNSPECIFIED = 0;
  SKILL_TIMER_KIND_COOLDOWN = 1;
  SKILL_TIMER_KIND_BUFF = 2;
}

// PlayerView is a character on the map as everyone sees it, in metres: x east, y up, z north.
message PlayerView {
  string id = 1;
  string name = 2;
  string class = 3;
  int32 level = 4;
  double x = 5;
  double y = 6;
  double vx = 7;
  double vy = 8;
  reserved 9, 11;
  reserved "facing", "climbing";
  bool on_ground = 10;
  int32 hp = 12;
  int32 max_hp = 13;
  bool dead = 14;
  // Set for the hit guard after a mob's hit.
  bool invulnerable = 15;
  reserved 16;
  reserved "casting";
  double z = 17;
  double vz = 18;
  // The unit heading it faces, east and north.
  double hx = 19;
  double hz = 20;
  // The yaw its latest attack or skill aimed along.
  float aim = 21;
  // A skill's dash or leap under way, so a reconcile resumes it; unset when none.
  SkillMove move = 22;
  // Set while a skill's dodge runs: enemies' attacks pass through.
  bool dodging = 23;
  // What's left of its shields, which take enemies' damage before HP.
  int32 shield = 24;
  // Sub-steps left of a status holding it, which the sim steps as State.Held; 0 when none.
  int32 held = 25;
  // A status slowing its walk, which the sim steps as State.Slow; unset when none.
  SlowWalk slow = 26;
  // Its statuses, sent when they change.
  repeated StatusView statuses = 27;
  reserved 28;
  reserved "immune";
  // Its side in a match, 1 or 2; 0 outside one, where no player is anyone's enemy.
  int32 team = 29;
  // A bot fighting in a match, which no one plays.
  bool bot = 30;
  // Sub-steps walked toward a sprint, which the sim steps as State.Sprint, held at movement.yaml's sprint.after once there: from the next, it sprints; 0 when none.
  int32 sprint = 31;
  // The mode it last stepped in, State.Walk: walk mode, or sprint mode when false; the player's own reconcile replays from it.
  bool walk = 32;
  // Its look, in every view: the client draws what this says, as it does the class.
  Look look = 33;
}

// Look is a player's picks from the wardrobe, each a piece id in outfits.yaml; empty keeps the class's own, and for wings is none.
message Look {
  string outfit = 1;
  string headwear = 2;
  string face = 3;
  string weapon = 4;
  // The headwear stays off, the class's own and a piece alike.
  bool hide_headwear = 5;
  string wings = 6;
}

// SlowWalk is a status slowing a player's walk: factor × the walk speed for left more sub-steps.
message SlowWalk {
  int32 left = 1;
  double factor = 2;
}

// StatusView is a status on a player or mob: its id in statuses.yaml and the tick it ends at, the latest of its kind's.
message StatusView {
  string id = 1;
  uint32 ends = 2;
}

// SkillMove is a dash or leap under way: (vx, vz) in m/s replaces the walk for left more sub-steps. With stop it ends at a mob's body; with through it passes mobs, and if it runs out inside one it ends at (clear_x, clear_z), the farthest point it reached that no mob's body held.
message SkillMove {
  double vx = 1;
  double vz = 2;
  int32 left = 3;
  bool stop = 4;
  bool through = 5;
  double clear_x = 6;
  double clear_z = 7;
}

// Mob and drop IDs count up within one map instance.
message MobView {
  uint32 id = 1;
  string type = 2;
  double x = 3;
  double y = 4;
  reserved 5;
  reserved "facing";
  int32 hp = 6;
  int32 max_hp = 7;
  MobPose pose = 8;
  double z = 9;
  // The yaw it faces.
  float yaw = 10;
  // Its statuses, sent when they change.
  repeated StatusView statuses = 11;
  reserved 12;
  reserved "immune";
}

// MobPose is how a mob takes the blows that land on it. It's resent when it changes, so a player who joins sees a downed mob.
enum MobPose {
  // Standing as usual.
  MOB_POSE_UNSPECIFIED = 0;
  // Stopped a moment by a blow.
  MOB_POSE_FLINCH = 1;
  // Knocked down: it neither moves nor attacks.
  MOB_POSE_DOWN = 2;
  // Up again, in super armor for a moment.
  MOB_POSE_RISING = 3;
}

// PouchView is a pouch or a boss's box of the player's own, which nobody else sees.
message PouchView {
  uint32 id = 1;
  PouchKind kind = 2;
  double x = 3;
  double y = 4;
  // Metres north.
  double z = 5;
  // What it still holds, items being taken included.
  repeated PouchItem items = 6;
  // How long until it's gone, from the message's tick.
  int64 gone_in_ms = 7;
}

// PouchKind is what a pouch is.
enum PouchKind {
  POUCH_KIND_UNSPECIFIED = 0;
  // A kill's.
  POUCH_KIND_POUCH = 1;
  // A field boss's, one for each player who earned it.
  POUCH_KIND_BOX = 2;
}

// PouchItem is an item in a pouch.
message PouchItem {
  // Its id within its pouch, which a LootPick names.
  uint32 item = 1;
  string template = 2;
  int32 quantity = 3;
  // Equipment's roll; unset for anything else.
  ItemStats stats = 4;
}

// Snapshot is what the player sees of the map, the cells round them, on join and map change.
message Snapshot {
  // 3 was the drops on the ground, which everyone saw.
  reserved 3;
  reserved "drops";

  repeated PlayerView players = 1;
  repeated MobView mobs = 2;
  // The player's own pouches.
  repeated PouchView pouches = 6;
  // The map's field boss, while one is up.
  FieldBoss field_boss = 4;
  // The map's field boss while it's beaten, with when it's back.
  FieldBossGone field_boss_gone = 5;
  // The field boss as it stands, wherever on the map, for its bar; it's drawn only from mobs, once it's among the cells round the player.
  MobView boss = 7;
  // The region's channel the player is in, from 1; 0 on any other map. A join and every map change send a snapshot, so the client always knows it.
  uint32 channel = 8;
  // The region's area the player stands in, by its id in the region's plan; empty on any other map. AreaEntered tells each change after.
  string area = 9;
}

// FieldBoss says the map's field boss is up: as it appears, which its map's players hear of, and in the Snapshot of a player joining while it is. It stays until it's beaten.
message FieldBoss {
  // Its mob, which deltas carry as any other.
  uint32 mob_id = 1;
  // Its mob type in game data, which names it.
  string type = 2;
  // 3 was how long until it left unbeaten; a boss stays until it's beaten.
  reserved 3;
  reserved "leaves_in_ms";
}

// FieldBossGone says the map's field boss is beaten: as it falls, and in the Snapshot of a player joining while it's down. The client counts down to its return.
message FieldBossGone {
  // 2 said whether it was beaten; it only ever is now.
  reserved 2;
  reserved "beaten";

  // The mob it was.
  uint32 mob_id = 1;
  // Its mob type in game data, which names it.
  string type = 3;
  // How long until it's back at its spot, from the message's tick.
  int64 back_in_ms = 4;
}

// Delta is what changed this tick: new or changed entities, and the IDs that left.
message Delta {
  // 4, 7 and 8 were the drops on the ground, which everyone saw.
  reserved 4, 7, 8;
  reserved "drops", "removed_drops", "collected_drops";

  // The latest input sequence applied.
  uint32 ack_seq = 1;
  repeated PlayerView players = 2;
  repeated MobView mobs = 3;
  repeated string removed_players = 5;
  // Mobs gone this tick: killed.
  repeated uint32 removed_mobs = 6;
  // The player's energy as of ack_seq, set on the ticks it changes and on the first Delta after a join.
  optional uint32 energy = 9;
  // The player's own pouches new or changed this tick, which no other player's Delta carries.
  repeated PouchView pouches = 10;
  // The player's own pouches gone this tick: emptied, or their life ended.
  repeated uint32 pouches_gone = 11;
  // What the player stopped seeing this tick: still on the map, out of the cells round them.
  Unseen unseen = 12;
  // The field boss as it changed this tick, to every player on the map wherever it stands, for its bar; it's drawn only from mobs.
  MobView boss = 13;
}

// Unseen are entities the player no longer sees, though still on the map: the client drops them, with no death.
message Unseen {
  repeated string players = 1;
  repeated uint32 mobs = 2;
}

// Damage is one resolved hit; source and target are "p:<character id>" or "m:<mob id>".
message Damage {
  string source = 1;
  string target = 2;
  int32 amount = 3;
  bool crit = 4;
  bool miss = 5;
  // An enemy's attack that passed through a player's dodge: no damage, knockback or hit guard.
  bool dodge = 6;
  // Set on a damage-over-time tick: the status dealing it.
  string status_id = 7;
  // What of amount a player's shields took; the rest came off their HP.
  int32 shielded = 8;
  // An enemy's attack a player's block stopped: no damage, knockback, status or hit guard.
  bool block = 9;
}

// SkillUsed says a character used a skill, for drawing its stage's shape; the stage is an index into the skill's stages in game data, and a trait replaces it with the trait's.
message SkillUsed {
  string caster = 1;
  string skill = 2;
  int32 stage = 3;
  reserved 4;
  reserved "facing";
  // The yaw it aims along.
  float aim = 5;
  // 6 was the mob's id, before a lock could be a player.
  reserved 6;
  // The mob or enemy it was aimed at, "m:<id>" or "p:<id>", empty for none; an area at the lock centres on it when it's within reach.
  string target = 8;
  // The extra trait it was used with, empty for the default.
  string trait = 7;
}

// AttackUsed says a character's basic attack started, for drawing its beats and its slash or shot; its damage comes as Damage.
message AttackUsed {
  string attacker = 1;
  reserved 2;
  reserved "facing";
  // Its length in the world's ticks, the class's.
  uint32 length_ticks = 3;
  // The yaw it aims along.
  float aim = 4;
}

// MobAttacked says a mob's attack began its windup at the message's tick, for drawing it; its damage comes as Damage.
message MobAttacked {
  uint32 mob = 1;
  // An index into the mob type's attacks in game data.
  uint32 attack = 2;
  reserved 3;
  reserved "facing";
  // Where its hit goes: a leap's landing or a rush's end, stopped by solids and portals; for other kinds, where the mob stands.
  double to_x = 4;
  // The yaw it faces.
  float yaw = 5;
  double to_y = 6;
  double to_z = 7;
}

message Died {
  string character_id = 1;
  double x = 2;
  double y = 3;
  // Metres north.
  double z = 4;
}

message Respawned {
  string character_id = 1;
  string map_id = 2;
  double x = 3;
  double y = 4;
  int32 hp = 5;
  // Metres north.
  double z = 6;
  // The yaw it faces.
  float yaw = 7;
}

// ExpGained is EXP awarded (negative for the death penalty) and the total within the level after it.
message ExpGained {
  int64 amount = 1;
  int64 exp = 2;
}

// LevelUp carries the new level and stats.
message LevelUp {
  CharacterView character = 1;
}

// Promoted carries the character in its new class, with HP restored and the new sheet; energy stays as it was.
message Promoted {
  CharacterView character = 1;
}

// InventorySlot is a slot after a change; item is unset when it emptied.
message InventorySlot {
  string tab = 1;
  int32 slot = 2;
  ItemView item = 3;
}

// InventoryChanged is slots and equip slots as they stood at the inventory's revision: each keeps the newest view it got, so an older one arriving late is skipped.
message InventoryChanged {
  repeated InventorySlot slots = 1;
  // The count of the inventory's and equipment's changes; 0 is a change stored before revisions, applied as it comes.
  uint64 revision = 2;
  repeated EquipSlot equipment = 3;
}

// LootKind is what became of a pouch's items.
enum LootKind {
  // 2 was a drop waiting for room; an item that doesn't fit stays in its pouch.
  reserved 2;
  reserved "LOOT_KIND_WAITING";

  LOOT_KIND_UNSPECIFIED = 0;
  // In the owner's inventory.
  LOOT_KIND_TAKEN = 1;
  // Still in the pouch when its life ended.
  LOOT_KIND_LEFT = 3;
}

// Loot is a combat line about a pouch: taken goes to its owner and the party members on the map, left to the owner only.
message Loot {
  // 3, 6 and 7 were a drop's, one item each.
  reserved 3, 6, 7;
  reserved "drop_id", "template", "quantity";

  LootKind kind = 1;
  // The map whose pouch it is: pouch IDs are a map's own.
  string map_id = 2;
  uint32 pouch_id = 8;
  string owner_id = 4;
  string owner_name = 5;
  repeated LootItem items = 9;
}

// LootItem is an item a Loot names.
message LootItem {
  string template = 1;
  int32 quantity = 2;
}

// StatsChanged is the player's HP after gear, points, regen or a potion changed it. The sheet comes only when it changed (gear, points, skill points); unset, the client keeps its last one.
message StatsChanged {
  // 4 and 5 were MP: there is no MP.
  reserved 4, 5;
  reserved "mp", "max_mp";

  StatSheet sheet = 1;
  int32 hp = 2;
  int32 max_hp = 3;
  // Set when they replace every cooldown and buff the client holds: going into a match and back out, and at each round's reset.
  SkillTimers timers = 6;
}

// SkillTimers are a player's cooldowns and buffs, all of them.
message SkillTimers {
  repeated SkillTimer timers = 1;
}

// MapChange follows a portal or a teleport.
message MapChange {
  string map_id = 1;
  double x = 2;
  double y = 3;
  // Metres north.
  double z = 4;
  // The yaw it faces.
  float yaw = 5;
}

// ChatMessage is a line from a player, the sender's own echo included.
message ChatMessage {
  ChatChannel channel = 1;
  string sender = 2;
  string sender_name = 3;
  string text = 4;
}

// PartyState is the whole party after any change; party is unset when there is none.
message PartyState {
  PartyView party = 1;
}

// AreaEntered tells the player they stepped into another of the region's areas, by its id in the region's plan: the client reads its name, levels and kind from the region's bake. A hunting area's field boss comes with it, as a Snapshot's does, and only those in its area hear of it after.
message AreaEntered {
  string area = 1;
  // The area's field boss, while it is up.
  FieldBoss field_boss = 2;
  // The area's field boss while it's beaten, with when it's back.
  FieldBossGone field_boss_gone = 3;
}

// WaypointFound tells the player they found a waypoint, coming within 12 m of its stone: its id across every region, whose name the client reads from the game data. It's theirs for good, and arrives in Welcome after.
message WaypointFound {
  string waypoint = 1;
}

// PartySpots is where the player's party members on their map stand that the frames don't bring, once a second to a player in a party on a map cut by cells, empty when none are out of sight; a member it doesn't list isn't here.
message PartySpots {
  repeated PartySpot spots = 1;
}

// PartySpot is a party member where they stand.
message PartySpot {
  string character_id = 1;
  float x = 2;
  float z = 3;
}

message PartyInvited {
  string invite_id = 1;
  string from = 2;
  string from_name = 3;
}

// Response answers a command that carried a req, or reports a refused one without.
message Response {
  // 2 was the code as text and 3 a message for the player; the client words the code itself.
  reserved 2, 3;
  reserved "message";

  bool ok = 1;
  // A six-digit code from server/testdata/errors/codes.json, which says exactly what happened; 0 when ok.
  int32 code = 4;
  // A TakeLoot's answer to each pick, in its order, once the item module answered them.
  repeated PickAnswer picks = 5;
  // A Channels' answer.
  ChannelList channels = 6;
}

// ChannelList is the open channels of the player's region, by number, and how full each is against cap, the players a channel takes before joins pass it.
message ChannelList {
  repeated ChannelLoad channels = 1;
  uint32 cap = 2;
}

// ChannelLoad is a channel and its players, those on their way included.
message ChannelLoad {
  uint32 channel = 1;
  uint32 players = 2;
}

// TeleportCancelled says the player's teleport channel ended before it took them.
message TeleportCancelled {
  TeleportCancelReason reason = 1;
}

// TeleportCancelReason is what ended a teleport channel.
enum TeleportCancelReason {
  TELEPORT_CANCEL_REASON_UNSPECIFIED = 0;
  // A movement or jump key held in an input after the press.
  TELEPORT_CANCEL_REASON_MOVED = 1;
  // An attack or a skill of theirs started.
  TELEPORT_CANCEL_REASON_ACTED = 2;
  // A mob's hit landed; a MISS doesn't cancel.
  TELEPORT_CANCEL_REASON_HIT = 3;
  // They died.
  TELEPORT_CANCEL_REASON_DIED = 4;
}

// Kicked precedes a server-side close.
message Kicked {
  KickReason reason = 1;
}

message Pong {
  int64 client_time = 1;
  int64 server_time = 2;
}

// NpcDialog is what an NPC offers the character now, as the server would allow it.
message NpcDialog {
  string npc_id = 1;
  // The quests it gives, in npcs.yaml's order.
  repeated QuestOffer gives = 2;
  // The character's active quests it takes back.
  repeated QuestTurnIn takes = 3;
  // Set when the NPC trains a class whose parent is the character's.
  PromotionOffer promotion = 4;
}

// PromotionOffer is a trainer's promotion: each condition, with what the character has.
message PromotionOffer {
  string class = 1;
  repeated PromotionCondition conditions = 2;
}

// PromotionCondition is one thing a promotion asks, met when have reaches need.
message PromotionCondition {
  PromotionConditionKind kind = 1;
  // The stat (str, dex, int, agi or vit), skill or quest it names; empty for the level.
  string id = 2;
  int32 need = 3;
  int32 have = 4;
}

enum PromotionConditionKind {
  PROMOTION_CONDITION_KIND_UNSPECIFIED = 0;
  PROMOTION_CONDITION_KIND_LEVEL = 1;
  // Own stat points, without gear.
  PROMOTION_CONDITION_KIND_STAT = 2;
  // Points invested in the skill.
  PROMOTION_CONDITION_KIND_SKILL = 3;
  // The quest finished: need 1, and have 1 once it is.
  PROMOTION_CONDITION_KIND_QUEST = 4;
}

// QuestOfferState is where a quest an NPC gives stands for the character.
enum QuestOfferState {
  QUEST_OFFER_STATE_UNSPECIFIED = 0;
  QUEST_OFFER_STATE_AVAILABLE = 1;
  QUEST_OFFER_STATE_ACTIVE = 2;
  // A one-time quest already finished.
  QUEST_OFFER_STATE_FINISHED = 3;
  // The character doesn't meet its conditions yet; unmet lists them.
  QUEST_OFFER_STATE_CONDITIONS_UNMET = 4;
}

message QuestOffer {
  string quest_id = 1;
  QuestOfferState state = 2;
  QuestConditions unmet = 3;
}

// QuestConditions are what a character lacks to accept a quest; an unset field is met.
message QuestConditions {
  // The least level, when the character's is lower.
  int32 level = 1;
  // The class it asks for, when the character is another.
  string class = 2;
  // The quests to finish first.
  repeated string quests = 3;
}

// QuestTurnIn is an active quest an NPC takes back: ready once every kill, talk and level objective is done; what it asks to collect is counted at hand-in.
message QuestTurnIn {
  string quest_id = 1;
  bool ready = 2;
}

// QuestStatus is where a character stands with a quest of its log.
enum QuestStatus {
  // Not in the log: abandoned before it was ever finished.
  QUEST_STATUS_UNSPECIFIED = 0;
  QUEST_STATUS_ACTIVE = 1;
  QUEST_STATUS_FINISHED = 2;
}

// QuestState is one quest of the character's log.
message QuestState {
  string quest_id = 1;
  QuestStatus status = 2;
  // One count per objective, in the quest's order; empty when finished. A collect objective's count stays 0: the client counts its inventory.
  repeated int32 progress = 3;
  // Completions so far; a repeatable quest active again keeps its count.
  int32 times_finished = 4;
}

// QuestChange is what happened to a quest, for the combat channel's line.
enum QuestChange {
  QUEST_CHANGE_UNSPECIFIED = 0;
  QUEST_CHANGE_PROGRESSED = 1;
  QUEST_CHANGE_ACCEPTED = 2;
  QUEST_CHANGE_HANDED_IN = 3;
  QUEST_CHANGE_ABANDONED = 4;
}

// QuestChanged is one quest of the log after a server tick, which merges that tick's changes to it.
message QuestChanged {
  QuestChange change = 1;
  QuestState quest = 2;
}

// PvpQueue joins a mode's queue (data/pvp.yaml modes: duel, team, battle); a party's leader queues the party. Answered when the queue takes it, with PvpQueued to each member.
message PvpQueue {
  string mode = 1;
}

// PvpLeaveQueue leaves the queue, the whole ticket for a party.
message PvpLeaveQueue {}

// PvpAnswer accepts or declines a PvpOffer.
message PvpAnswer {
  string offer = 1;
  bool accept = 2;
}

// PvpForfeit leaves the match under way as a loss: in 1v1 the other side wins at once, in a team mode a bot takes the leaver's body.
message PvpForfeit {}

// PvpQueued says the player is in a mode's queue: on joining, to each member of a party ticket, and again each time waiting_room flips.
message PvpQueued {
  string mode = 1;
  // How long the ticket has waited as this is sent; the client counts on from it.
  uint32 since_ms = 2;
  // The ticket's characters: the player alone, or their party.
  repeated string members = 3;
  // Their match is found but waits for the server to have room for its bots ("Waiting for room"); sent again, false, before its offer.
  bool waiting_room = 4;
}

// PvpUnqueued says the player's ticket left the queue without a match.
message PvpUnqueued {
  PvpUnqueueReason reason = 1;
  // The ticket's members whose answer took it out: the one who declined, or those who let the offer lapse; empty for any other reason.
  repeated string by = 2;
}

enum PvpUnqueueReason {
  PVP_UNQUEUE_REASON_UNSPECIFIED = 0;
  // The player, or their party's leader, left the queue.
  PVP_UNQUEUE_REASON_LEFT = 1;
  // The player declined an offer.
  PVP_UNQUEUE_REASON_DECLINED = 2;
  // The player let an offer lapse.
  PVP_UNQUEUE_REASON_LAPSED = 3;
  // The party behind a party ticket changed.
  PVP_UNQUEUE_REASON_PARTY_CHANGED = 4;
}

// PvpOffer says a match was found; every player in it must accept with PvpAnswer before it lapses.
message PvpOffer {
  string offer = 1;
  string mode = 2;
  // How many of the match's places bots fill.
  int32 bots = 3;
  // How long until it lapses, as this is sent; the client counts down from it.
  uint32 until_ms = 4;
}

// PvpOfferGone says an offer ended without a match: someone declined it or let it lapse.
message PvpOfferGone {
  string offer = 1;
  PvpOfferGoneReason reason = 2;
  // Whether this player is back in the queue, their wait kept: those who accepted are, those who declined or let it lapse aren't.
  bool requeued = 3;
}

enum PvpOfferGoneReason {
  PVP_OFFER_GONE_REASON_UNSPECIFIED = 0;
  PVP_OFFER_GONE_REASON_DECLINED = 1;
  PVP_OFFER_GONE_REASON_LAPSED = 2;
}

// MatchState is the match's state: sent on entry and at each change of phase, round or score, and each second in 15v15 while points move.
message MatchState {
  string match = 1;
  string mode = 2;
  MatchPhase phase = 3;
  // The round under way or next, from 1; 0 in 15v15.
  int32 round = 4;
  // Rounds won by side 1 and side 2; empty in 15v15.
  repeated int32 wins = 5;
  // How long the phase has left, as this is sent; the client counts down from it.
  uint32 ends_in_ms = 6;
  // Side 1 then side 2.
  repeated MatchSide sides = 7;
  // Side 1's and side 2's score in 15v15; empty in a round mode.
  repeated int32 score = 8;
  // The 15v15 capture points; empty in a round mode.
  repeated CapturePoint points = 9;
}

enum MatchPhase {
  MATCH_PHASE_UNSPECIFIED = 0;
  // Before the first round or the battle: the prep wall stands, and attacks and skills are refused.
  MATCH_PHASE_PREP = 1;
  // The count into a round: the prep wall stands, and nobody moves or acts.
  MATCH_PHASE_COUNTDOWN = 2;
  MATCH_PHASE_FIGHT = 3;
  // Between rounds.
  MATCH_PHASE_BETWEEN = 4;
  // The match is over; everyone goes back when it ends.
  MATCH_PHASE_RESULT = 5;
}

// MatchSide is one side's fighters.
message MatchSide {
  repeated MatchFighter fighters = 1;
}

// MatchFighter is a player or a bot in a match; a bot's id is its own, never a character's.
message MatchFighter {
  string id = 1;
  string name = 2;
  string class = 3;
  bool bot = 4;
}

// CapturePoint is a 15v15 point as the world has it now; the client moves its ring between updates at the rate data/pvp.yaml gives.
message CapturePoint {
  string id = 1;
  // The side holding it, 0 for none.
  int32 holder = 2;
  // From -1, side 1's, through 0, no one's, to 1, side 2's.
  double progress = 3;
  // Both sides stand in it, so it holds still.
  bool contested = 4;
}

// ArenaBar is the bar the match puts on this player at a countdown, eight keys, "" for an empty one: from then their skills go from its keys alone, and the client shows it on the skill bar. Its traits come in the StatsChanged sent with it.
message ArenaBar {
  repeated string skill_bar = 1;
}

// MatchEnded is the match's outcome for this player, as its result phase starts.
message MatchEnded {
  MatchOutcome result = 1;
  // Rounds won by side 1 and side 2; empty in 15v15.
  repeated int32 wins = 2;
  // Side 1's and side 2's score in 15v15; empty in a round mode.
  repeated int32 score = 3;
  // The rated mode's rating change; unset for 15v15, or when the match had no result to rate.
  PvpRatingChange rating = 4;
  // The match's mode, as PvpQueue names it.
  string mode = 5;
  // The player left before the outcome, so lost whatever their side did; in a team mode the match ran on without them.
  bool left = 6;
}

enum MatchOutcome {
  MATCH_OUTCOME_UNSPECIFIED = 0;
  MATCH_OUTCOME_WIN = 1;
  MATCH_OUTCOME_LOSS = 2;
  MATCH_OUTCOME_DRAW = 3;
}

// PvpRatingChange is a mode's shown rating and rank before and after a match.
message PvpRatingChange {
  int32 before = 1;
  int32 after = 2;
  // Rank ids from data/pvp.yaml ranks.
  string rank_before = 3;
  string rank_after = 4;
  // Placement matches still to play, 0 once placed.
  int32 placement_left = 5;
}
