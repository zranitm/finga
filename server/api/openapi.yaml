openapi: 3.1.0
info:
  title: Finga REST API
  version: 0.1.0
  description: |
    Accounts, sessions, characters and settings.
    Gameplay runs over the WebSocket at /ws, described in proto/client/v1/client.proto.
    Errors return an HTTP status and a body with `code` and `message`. The
    status is the class of failure (400 bad input, 401, 404, 409 a rule the
    request ran into, 429, 503, 500). The code, six digits, names the exact
    failure: two digits for the area (10 requests, 11 accounts and sessions,
    12 characters, 22 items, 33 the world and quests, 44 parties and chat),
    then four for the case. The client words each code itself; the message
    is for developers. testdata/errors/codes.json lists every code with its
    name, status and message. Authenticated calls send `Authorization: Bearer TOKEN`.
    Each account's authenticated calls draw on one bucket, whichever route
    and token: by default 10 at once, refilled 2 a second (config.yaml's
    rest). Past it, a call answers 429 RATE_LIMITED. The web client's
    busiest moment sends 5 at once, and a whole session of its calls fits the
    bucket with none refilled. Logging in has its own limit, per username.
servers:
  - url: http://localhost:8080
paths:
  /api/accounts:
    post:
      summary: Sign up
      description: Username 3 to 16 characters (letters, digits, underscore); password 8 to 128 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/sessions:
    post:
      summary: Log in
      description: Returns an opaque token and revokes any older session. Rate-limited per username and per IP (5 per minute).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Session created; the token is shown only here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Log out everywhere
      description: Ends every session of the account and closes its game connections.
      security: [{ bearer: [] }]
      responses:
        "204": { description: Every session revoked }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/sessions/current:
    delete:
      summary: Log out
      security: [{ bearer: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/characters:
    get:
      summary: List my characters
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account's characters, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Characters" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a character
      description: Name 3 to 12 characters (letters and digits, starting with a letter), unique ignoring case. Every new character is a Beginner, and picks a class later at a trainer. At most 3 characters per account in Stage 1.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCharacterRequest" }
      responses:
        "201":
          description: Created, at level 1 in the town
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/characters/{id}/skill-bar:
    put:
      summary: Save a character's skill bar
      description: The skill on each of the bar's eight keys, "" for none. Each is empty or an active skill in the game data; the world refuses one the character hasn't learned when it's used.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SkillBar" }
      responses:
        "200":
          description: The saved skill bar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SkillBar" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/characters/{id}/pvp:
    get:
      summary: A character's PvP profile
      description: Each rated mode's shown rating, rank, placement matches left, record and place on the board, 0 before placement; and the arena build, the world bar's copy until one is saved (pvp.md section 10).
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PvpProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/characters/{id}/pvp-build:
    put:
      summary: Save a character's arena build
      description: Eight keys, each empty or one of the class's active skills, none twice, and a trait of its own for skills on it (pvp.md section 6); only a promoted character has one. A match the character is in fights with it from its next round's countdown.
      security: [{ bearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaBuild" }
      responses:
        "200":
          description: The saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaBuild" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/pvp/leaderboard:
    get:
      summary: A rated mode's leaderboard
      description: The top 100 placed characters by shown rating, a tie sharing its place; the same for every caller and read again at most every 30 s. The caller's own place is in their profile.
      security: [{ bearer: [] }]
      parameters:
        - { name: mode, in: query, required: true, schema: { type: string, enum: [duel, team] } }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/wardrobe:
    get:
      summary: The account's wardrobe
      description: Every piece the account collected, oldest first, each with what gave it; its characters share it (outfits.md section 4).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account's pieces
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wardrobe" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/settings:
    get:
      summary: Read settings
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The account's settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    put:
      summary: Save settings
      description: Replaces every setting; a flag left out is false, and keys left out are the defaults. No key may hold two actions.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error with its code and a message for developers
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Account:
      type: object
      required: [id, username, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        created_at: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    Session:
      type: object
      required: [token]
      properties:
        token: { type: string }
    CreateCharacterRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    Stats:
      type: object
      required: [str, dex, int, agi, vit]
      properties:
        str: { type: integer }
        dex: { type: integer }
        int: { type: integer }
        agi: { type: integer }
        vit: { type: integer }
    Character:
      type: object
      required: [id, name, class, level, exp, stats, hp, map_id, skill_bar]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        class: { type: string, description: "A class in the game data's tree; beginner until a promotion" }
        level: { type: integer }
        exp: { type: integer, description: EXP within the current level }
        stats: { $ref: "#/components/schemas/Stats" }
        hp: { type: integer }
        map_id: { type: string }
        skill_bar:
          type: array
          description: The skill on each of the bar's eight keys, "" for none
          items: { type: string }
          minItems: 8
          maxItems: 8
    SkillBar:
      type: object
      required: [slots]
      properties:
        slots:
          type: array
          description: The skill on each of the bar's eight keys, "" for none
          items: { type: string }
          minItems: 8
          maxItems: 8
    ArenaBuild:
      type: object
      required: [skill_bar, traits]
      properties:
        skill_bar:
          type: array
          description: The skill on each of the eight keys, "" for none
          items: { type: string }
          minItems: 8
          maxItems: 8
        traits:
          type: object
          description: The trait chosen by skill, for any of the class's active skills, a follow-up's off the bar too; one left out is the skill's default
          additionalProperties: { type: string }
    PvpStanding:
      type: object
      required: [mode, shown, rank, placement_left, wins, losses, draws, place]
      properties:
        mode: { type: string }
        shown: { type: integer, description: "The shown rating: 1000 + 40 × (mu − 3 sigma), at least 0" }
        rank: { type: string }
        placement_left: { type: integer, description: The placement matches still to play; the board lists only those with none }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        place: { type: integer, description: "1 + those placed above, 0 before placement" }
    PvpProfile:
      type: object
      required: [standings, build]
      properties:
        standings:
          type: array
          description: Each rated mode, in pvp.yaml's order
          items: { $ref: "#/components/schemas/PvpStanding" }
        build: { $ref: "#/components/schemas/ArenaBuild" }
    Leaderboard:
      type: object
      required: [mode, rows]
      properties:
        mode: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardRow" }
    LeaderboardRow:
      type: object
      required: [place, character_id, name, class, shown, rank, wins, losses, draws]
      properties:
        place: { type: integer }
        character_id: { type: string, format: uuid }
        name: { type: string }
        class: { type: string }
        shown: { type: integer }
        rank: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
    Characters:
      type: object
      required: [characters]
      properties:
        characters:
          type: array
          items: { $ref: "#/components/schemas/Character" }
    Wardrobe:
      type: object
      required: [pieces]
      properties:
        pieces:
          type: array
          description: Oldest first; [] for none, never null.
          items: { $ref: "#/components/schemas/Piece" }
    Piece:
      type: object
      required: [id, cause, added_at]
      properties:
        id: { type: string, description: "A piece in outfits.yaml" }
        cause: { type: string, enum: [item, rank, quest, feat], description: "What gave it; step 1 adds from items alone" }
        item_id: { type: string, format: uuid, description: "The item added, for an item cause alone" }
        added_at: { type: string, format: date-time }
    Settings:
      type: object
      properties:
        auto_assign_points: { type: boolean, default: false, description: "The client spends each level's points by the class's split; left out of a PUT, false" }
        chat_pinned: { type: boolean, default: false, description: "The chat stays open while the player isn't typing; left out of a PUT, false" }
        hide_minimap: { type: boolean, default: false, description: "The minimap is hidden; left out of a PUT, false, so the minimap shows" }
        zoom: { type: number, minimum: 0, maximum: 1, default: 0, description: "How far the camera has pulled back, 0 close to 1 far; left out of a PUT, 0. Anything else is BAD_ZOOM." }
        walk: { type: boolean, default: false, description: "Walk mode, which never sprints, instead of sprint mode; left out of a PUT, sprint mode." }
        keys:
          type: object
          description: The key bindings that differ from the client's defaults, an action to a KeyboardEvent.code; always present in a read, {} for the defaults, and left out of a PUT, the defaults. The server checks the shape, not the actions. Anything else is BAD_KEY_BINDINGS.
          maxProperties: 64
          propertyNames: { pattern: "^[A-Za-z0-9]{1,32}$" }
          additionalProperties:
            type: string
            pattern: "^[A-Za-z0-9]{1,32}$"
            not: { enum: [Escape, Enter, NumpadEnter, MetaLeft, MetaRight, ContextMenu, F5, F11, F12] }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: "The exact failure, six digits, for example 120002 (NAME_TAKEN); testdata/errors/codes.json lists them all" }
        message: { type: string, description: "For developers; the client words the code itself" }
