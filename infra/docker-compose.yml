# make up / make down: host ports come from .env here (see .env.example), the binaries' overrides from ../server/.env, and the environment entries below win over it.
name: finga

x-database: &database
  FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable

# Empty exports nothing; make up OBS=1 and production point it at Alloy (obs/compose.yml).
x-tracing: &tracing
  FINGA_TRACING_OTLP_ENDPOINT: ${FINGA_TRACING_OTLP_ENDPOINT:-}

# The game probes itself (/readyz on its ops listener): the distroless image has no probe tool.
x-healthcheck: &healthcheck
  test: ["CMD", "/app/app", "-healthcheck"]
  start_period: 60s    # probed every start_interval until up, then every interval
  start_interval: 2s
  interval: 30s
  timeout: 4s
  retries: 3

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    command: ["postgres", "-c", "max_connections=100"]   # the game's pool of 60 (database.max_conns), migrate's 2, and room for psql and the backups
    ports:
      - "127.0.0.1:${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 2s
      retries: 3
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: migrate
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  # The game, every module in one process: REST under /api and the WebSocket at /ws on 8080, ops on 9100,
  # and the admin API make testers writes through on 9200, on the stack's own network only.
  finga:
    restart: unless-stopped
    stop_grace_period: 25s   # shutdown_grace (10s), world's flush_timeout (10s), the last trace flush (2s) and a margin, before SIGKILL
    build:
      context: ../server
      dockerfile: Dockerfile
      target: finga
      args:
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    ports:
      - "127.0.0.1:${FINGA_PORT:-8080}:8080"   # this machine only; players come through web
      - "127.0.0.1:${FINGA_OPS_PORT:-9100}:9100"
    environment:
      <<: [*database, *tracing]
      FINGA_HTTP_CORS_ORIGINS: http://localhost:5173
      FINGA_ADMIN_ENABLED: "true"
      FINGA_ADMIN_ADDR: ":9200"   # published nowhere: testers reaches it as finga:9200
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # make testers: the test accounts, kept on this stack from its own network (server/cmd/testers). The tools profile keeps it out of up.
  testers:
    profiles: [tools]
    build:
      context: ../server
      dockerfile: Dockerfile
      target: testers
      args:
        VERSION: ${VERSION:-dev}
    environment:
      FINGA_GATEWAY: http://finga:8080
      FINGA_ADMIN: http://finga:9200

  # The client on nginx, passing /api and /ws to the game so the browser sees one origin.
  web:
    restart: unless-stopped
    build:
      context: ../web
      additional_contexts:
        gamedata: ../server/data
        errors: ../server/testdata/errors
        proto: ../server/api/proto
        edge: ./nginx
    ports:
      - "${FINGA_WEB_PORT:-4173}:80"
    depends_on:
      finga:
        condition: service_healthy

volumes:
  pgdata:
