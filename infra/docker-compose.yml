# make up / make down: host ports come from .env here (see .env.example), the binaries' overrides from ../server/.env, and the environment entries below win over it.
name: finga

x-database: &database
  FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable

# Empty exports nothing; make up OBS=1 and production point it at Alloy (obs/compose.yml).
x-tracing: &tracing
  FINGA_TRACING_OTLP_ENDPOINT: ${FINGA_TRACING_OTLP_ENDPOINT:-}

# Each binary probes itself (gRPC health, or /readyz for the gateway): the distroless image has no probe tool.
x-healthcheck: &healthcheck
  test: ["CMD", "/app/app", "-healthcheck"]
  start_period: 60s    # probed every start_interval until up, then every interval
  start_interval: 2s
  interval: 30s
  timeout: 4s
  retries: 3

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      start_period: 60s
      start_interval: 2s
      interval: 30s
      timeout: 2s
      retries: 3
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  # gRPC on 9001, ops on 9101.
  account:
    restart: unless-stopped
    stop_grace_period: 15s   # shutdown_grace (10s), the last trace flush (2s) and a margin, before SIGKILL
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: account
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    environment:
      <<: [*database, *tracing]
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9002, ops on 9102.
  character:
    restart: unless-stopped
    stop_grace_period: 15s   # shutdown_grace (10s), the last trace flush (2s) and a margin
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: character
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    environment:
      <<: [*database, *tracing]
      FINGA_DEPENDENCIES_ITEM: item:9003
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9003, ops on 9103 (published for make bots).
  item:
    restart: unless-stopped
    stop_grace_period: 15s   # shutdown_grace (10s), the last trace flush (2s) and a margin
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: item
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    ports:
      - "127.0.0.1:${FINGA_ITEM_OPS_PORT:-9103}:9103"
    environment:
      <<: [*database, *tracing]
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9005, ops on 9105; parties live in memory, so no database.
  social:
    restart: unless-stopped
    stop_grace_period: 15s   # shutdown_grace (10s), the last trace flush (2s) and a margin
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: social
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    environment: *tracing
    env_file:
      - path: ../server/.env
        required: false

  # gRPC on 9004, ops on 9104 (published for make bots); it saves through character and item.
  world:
    restart: unless-stopped
    stop_grace_period: 25s   # shutdown_grace (10s), flush_timeout (10s), the last trace flush (2s) and a margin
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: world
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    ports:
      - "127.0.0.1:${FINGA_WORLD_OPS_PORT:-9104}:9104"
    environment:
      <<: *tracing
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      character:
        condition: service_healthy
      item:
        condition: service_healthy
      social:
        condition: service_healthy

  # REST under /api and the WebSocket at /ws on 8080, ops on 9100.
  gateway:
    restart: unless-stopped
    stop_grace_period: 15s   # shutdown_grace (10s), the last trace flush (2s) and a margin
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
        VERSION: ${VERSION:-dev}
    healthcheck: *healthcheck
    ports:
      - "127.0.0.1:${FINGA_PORT:-8080}:8080"   # this machine only; players come through web
      - "127.0.0.1:${FINGA_GATEWAY_OPS_PORT:-9100}:9100"
    environment:
      <<: *tracing
      FINGA_HTTP_CORS_ORIGINS: http://localhost:5173
      FINGA_DEPENDENCIES_ACCOUNT: account:9001
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_WORLD: world:9004
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      account:
        condition: service_healthy
      character:
        condition: service_healthy
      item:
        condition: service_healthy
      world:
        condition: service_healthy
      social:
        condition: service_healthy

  # The client on nginx, passing /api and /ws to the gateway so the browser sees one origin.
  web:
    restart: unless-stopped
    build:
      context: ../web
      additional_contexts:
        gamedata: ../server/data
        proto: ../server/api/proto
        edge: ./nginx
    ports:
      - "${FINGA_WEB_PORT:-4173}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
