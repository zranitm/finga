# make up / make down. Postgres with a health check, the migrations as a
# one-shot job, the six services (Low-level design, page 10), each built
# from ../server with the one Dockerfile and its SERVICE argument, and web:
# nginx serving the built client on :4173 and passing /api and /ws to the
# gateway, the only public entry of the game. Host ports come from .env next
# to this file (git-ignored; see .env.example). The binaries' overrides go in
# ../server/.env, passed in whole as env_file; the environment entries below
# win over it. Each binary reads only its own file and keys (page 11), so
# each service below sets only its own: the database for the ones that have
# one, and where it dials the services it calls on the Compose network.
name: finga

x-database: &database
  FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  # The account service: gRPC on 9001, /healthz /readyz /metrics on 9101.
  account:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: account
        VERSION: ${VERSION:-dev}
    environment: *database
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The character service: gRPC on 9002, /healthz /readyz /metrics on 9102.
  # It calls the item service for a new character's starter items.
  character:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: character
        VERSION: ${VERSION:-dev}
    environment:
      <<: *database
      FINGA_DEPENDENCIES_ITEM: item:9003
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The item service: gRPC on 9003, /healthz /readyz /metrics on 9103.
  item:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: item
        VERSION: ${VERSION:-dev}
    environment: *database
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The social service: gRPC on 9005, /healthz /readyz /metrics on 9105.
  # Parties live in memory, so it needs no database and no migration.
  social:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: social
        VERSION: ${VERSION:-dev}
    env_file:
      - path: ../server/.env
        required: false

  # The world service: gRPC on 9004, /healthz /readyz /metrics on 9104,
  # published so make bots can read the tick percentiles. It saves through
  # the character and item services, so it needs no database.
  world:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: world
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_WORLD_OPS_PORT:-9104}:9104"
    environment:
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      character:
        condition: service_started
      item:
        condition: service_started
      social:
        condition: service_started

  # The gateway: REST under /api and the WebSocket gateway at /ws, with
  # /healthz, /readyz and /metrics, on 8080. It holds no database and no game
  # rules; on SIGTERM it tells every connection to reconnect, then stops.
  gateway:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_PORT:-8080}:8080"
    environment:
      FINGA_HTTP_CORS_ORIGINS: http://localhost:5173
      FINGA_DEPENDENCIES_ACCOUNT: account:9001
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_WORLD: world:9004
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      account:
        condition: service_started
      character:
        condition: service_started
      item:
        condition: service_started
      world:
        condition: service_started
      social:
        condition: service_started

  # The client: the production build served by nginx, with /api and /ws
  # passed to the gateway, so the browser sees one origin (page 3). The game
  # is at http://localhost:4173, or the machine's LAN address for testers.
  web:
    build:
      context: ../web
      additional_contexts:
        gamedata: ../server/data
        edge: ./nginx
    ports:
      - "${FINGA_WEB_PORT:-4173}:80"
    depends_on:
      gateway:
        condition: service_started

volumes:
  pgdata:
