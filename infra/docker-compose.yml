# make up / make down. Postgres with a health check, the migrations as a
# one-shot job, then the services (Low-level design, page 10) and the game
# server, each built from ../server with the one Dockerfile and its SERVICE
# argument. Host ports come from .env next to this file (git-ignored; see
# .env.example). The binaries' overrides go in ../server/.env, passed in
# whole as env_file; the environment entries below win over it. The client
# is served by Vite (make play) for now; a web container joins when it is
# deployed.
name: finga

# Every Go process gets the database and where each service is dialled on
# the Compose network.
x-finga-env: &finga-env
  FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable
  FINGA_SERVICES_ACCOUNT_ADDR: account:9001
  FINGA_SERVICES_CHARACTER_ADDR: character:9002
  FINGA_SERVICES_ITEM_ADDR: item:9003
  FINGA_SERVICES_WORLD_ADDR: world:9004
  FINGA_SERVICES_SOCIAL_ADDR: social:9005

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    environment: *finga-env
    depends_on:
      postgres:
        condition: service_healthy

  # The account service: gRPC on 9001, /healthz /readyz /metrics on 9101.
  account:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: account
        VERSION: ${VERSION:-dev}
    environment: *finga-env
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The character service: gRPC on 9002, /healthz /readyz /metrics on 9102.
  # It calls the item service for a new character's starter items.
  character:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: character
        VERSION: ${VERSION:-dev}
    environment: *finga-env
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The item service: gRPC on 9003, /healthz /readyz /metrics on 9103.
  item:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: item
        VERSION: ${VERSION:-dev}
    environment: *finga-env
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The social service: gRPC on 9005, /healthz /readyz /metrics on 9105.
  # Parties live in memory, so it needs no database and no migration.
  social:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: social
        VERSION: ${VERSION:-dev}
    environment: *finga-env
    env_file:
      - path: ../server/.env
        required: false

  # The world service: gRPC on 9004, /healthz /readyz /metrics on 9104,
  # published so make bots can read the tick percentiles. It saves through
  # the character and item services, so it needs no database.
  world:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: world
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_WORLD_OPS_PORT:-9104}:9104"
    environment: *finga-env
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      character:
        condition: service_started
      item:
        condition: service_started
      social:
        condition: service_started

  gameserver:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: gameserver
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_PORT:-8080}:8080"
    environment:
      <<: *finga-env
      FINGA_SERVER_CORS_ORIGINS: http://localhost:5173
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      account:
        condition: service_started
      character:
        condition: service_started
      item:
        condition: service_started
      world:
        condition: service_started
      social:
        condition: service_started

volumes:
  pgdata:
