# make up / make down. Host ports come from .env here (see .env.example); ../server/.env holds
# the binaries' overrides, and the environment entries below win over it.
name: finga

x-database: &database
  FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    ports:
      - "${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: migrate
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  # gRPC on 9001, ops on 9101.
  account:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: account
        VERSION: ${VERSION:-dev}
    environment: *database
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9002, ops on 9102.
  character:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: character
        VERSION: ${VERSION:-dev}
    environment:
      <<: *database
      FINGA_DEPENDENCIES_ITEM: item:9003
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9003, ops on 9103.
  item:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: item
        VERSION: ${VERSION:-dev}
    environment: *database
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # gRPC on 9005, ops on 9105; parties live in memory, so no database.
  social:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: social
        VERSION: ${VERSION:-dev}
    env_file:
      - path: ../server/.env
        required: false

  # gRPC on 9004, ops on 9104 (published for make bots); it saves through character and item.
  world:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: world
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_WORLD_OPS_PORT:-9104}:9104"
    environment:
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      character:
        condition: service_started
      item:
        condition: service_started
      social:
        condition: service_started

  # REST under /api, the WebSocket at /ws and ops, all on 8080.
  gateway:
    restart: unless-stopped
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_PORT:-8080}:8080"
    environment:
      FINGA_HTTP_CORS_ORIGINS: http://localhost:5173
      FINGA_DEPENDENCIES_ACCOUNT: account:9001
      FINGA_DEPENDENCIES_CHARACTER: character:9002
      FINGA_DEPENDENCIES_ITEM: item:9003
      FINGA_DEPENDENCIES_WORLD: world:9004
      FINGA_DEPENDENCIES_SOCIAL: social:9005
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      account:
        condition: service_started
      character:
        condition: service_started
      item:
        condition: service_started
      world:
        condition: service_started
      social:
        condition: service_started

  # The client on nginx, passing /api and /ws to the gateway so the browser sees one origin.
  web:
    restart: unless-stopped
    build:
      context: ../web
      additional_contexts:
        gamedata: ../server/data
        proto: ../server/api/proto
        edge: ./nginx
    ports:
      - "${FINGA_WEB_PORT:-4173}:80"
    depends_on:
      gateway:
        condition: service_started

volumes:
  pgdata:
