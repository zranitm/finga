# make up / make down. Postgres with a health check, the migrations as a
# one-shot job, and the game server once they succeeded, built from
# ../server. Overrides for the game server go in ../server/.env (git-ignored;
# see ../server/.env.example). The client is served by Vite (make play) for
# now; a web container joins when it is deployed.
name: finga

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        CMD: migrate
    environment:
      FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  gameserver:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        CMD: gameserver
        VERSION: ${VERSION:-dev}
    ports:
      - "${FINGA_PORT:-8080}:8080"
    environment:
      FINGA_DATABASE_URL: postgres://finga:finga@postgres:5432/finga?sslmode=disable
      FINGA_SERVER_CORS_ORIGINS: http://localhost:5173
    env_file:
      - path: ../server/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
