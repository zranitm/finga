# The listener Cloudflare reaches in Full (strict) mode, included in finga.conf's server block from /etc/nginx/finga.d.
# The Origin CA certificate and key are the ones Terraform stores in SSM and the deploy writes to shared/files/nginx/tls.
listen 443 ssl;
http2 on;

ssl_certificate     /etc/nginx/tls/origin.pem;
ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:finga_tls:10m;
ssl_session_timeout 1d;
