# Serves the client and passes /api and /ws to the gateway, so the browser sees one origin.
# Limits per client address live here; behind a proxy they must key on the real client IP.

# Compose's DNS, asked at request time, so a recreated gateway's new address is followed.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Every gateway request counts against zone gateway; a login POST also against zone login (an empty key is not counted).
# A refusal copies the gateway's own status, code and message.
map $request_method $login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=gateway:10m rate=10r/s;
limit_req_zone $login_key zone=login:10m rate=5r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    set $gateway http://gateway:8080;
    # While the gateway restarts, a quick 502 lets the client's reconnect run instead of hanging.
    proxy_connect_timeout 2s;

    # The browser's Host passes through: the gateway checks the WebSocket Origin against it.
    # A location that sets any proxy header inherits none, so each sets the full list.
    location /api/ {
        limit_req zone=gateway burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5 logins a minute: the first five at once, then one every 12 s.
    location = /api/sessions {
        limit_req zone=gateway burst=20 nodelay;
        limit_req zone=login burst=4 nodelay;
        error_page 429 = @login_rate_limited;
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"slow down"}\n';
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"code":"login_rate_limited","message":"too many login attempts, try again in a minute"}\n';
    }

    location = /ws {
        limit_req zone=gateway burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The gateway pings every 20 s; this only ends a socket gone silent.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The server's Tiled maps; .tmj is JSON.
    location /maps/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Always revalidated, so a rebuilt client reaches every browser on its next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
