# nginx in front of the game under make up (TD-12): the client's built files
# on /, and /api and /ws passed to the gateway, so the browser sees one origin
# and needs no CORS (page 3: the client is static files served by nginx,
# never by the gateway). Stage 2 adds TLS, per-IP limits and Cloudflare's
# real client IP (TD-13). Baked into the web image (web/Dockerfile).

# Compose's DNS, asked at request time: a recreated gateway gets a new
# address, and nginx follows it instead of keeping the one it started with.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    set $gateway http://gateway:8080;
    # Inside Compose a live gateway answers a connect at once; while it
    # restarts, a quick 502 lets the client's reconnect run instead of
    # hanging a minute on the address it had.
    proxy_connect_timeout 2s;

    # The browser's Host passes through: the gateway accepts a WebSocket
    # whose Origin matches the Host it receives. A location that sets any
    # proxy header inherits none from above, so each sets the full list.
    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The gateway pings every 20 s; this only ends a socket gone silent.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The maps the server simulates, copied in at build time (.tmj is JSON).
    location /maps/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Everything is revalidated (a 304 when unchanged), so a rebuilt client
    # reaches every browser on its next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
