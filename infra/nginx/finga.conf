# nginx in front of the game under make up (TD-12): the client's built files
# on /, and /api and /ws passed to the gateway, so the browser sees one origin
# and needs no CORS (page 3: the client is static files served by nginx,
# never by the gateway). It is also where limits per client address live:
# the gateway and the services never read the address (page 4).
# Stage 2 adds TLS and Cloudflare's real client IP (TD-13), which these
# limits must then key on instead of the peer. Baked into the web image
# (web/Dockerfile).

# Compose's DNS, asked at request time: a recreated gateway gets a new
# address, and nginx follows it instead of keeping the one it started with.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Limits per client address (page 4). Every request to the gateway counts
# against the general one; a login (POST /api/sessions, the brute-force
# target) also against its own, at the rate the account service applies
# per username. A request whose key is empty is not counted, so only POST
# is a login. A refusal is the gateway's own: the same status, code and
# message, so the client cannot tell who refused.
map $request_method $login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=gateway:10m rate=10r/s;
limit_req_zone $login_key zone=login:10m rate=5r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;

    set $gateway http://gateway:8080;
    # Inside Compose a live gateway answers a connect at once; while it
    # restarts, a quick 502 lets the client's reconnect run instead of
    # hanging a minute on the address it had.
    proxy_connect_timeout 2s;

    # The browser's Host passes through: the gateway accepts a WebSocket
    # whose Origin matches the Host it receives. A location that sets any
    # proxy header inherits none from above, so each sets the full list.
    location /api/ {
        limit_req zone=gateway burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 5 logins a minute: the first five at once, then one every 12 s.
    location = /api/sessions {
        limit_req zone=gateway burst=20 nodelay;
        limit_req zone=login burst=4 nodelay;
        error_page 429 = @login_rate_limited;
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"slow down"}\n';
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"code":"login_rate_limited","message":"too many login attempts, try again in a minute"}\n';
    }

    # A WebSocket opens with one request, which counts like any other.
    location = /ws {
        limit_req zone=gateway burst=20 nodelay;
        error_page 429 = @rate_limited;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The gateway pings every 20 s; this only ends a socket gone silent.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The maps the server simulates, copied in at build time (.tmj is JSON).
    location /maps/ {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Everything is revalidated (a 304 when unchanged), so a rebuilt client
    # reaches every browser on its next load.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
