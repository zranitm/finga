# Movement constants (Low-level design, page 5). Shared with the client,
# which reads the same values; the vectors in testdata/movement pin them.
dt: 0.016666666666666666   # one sub-step: 1/60 s
walk_speed: 200            # px/s
jump_velocity: 620         # px/s
gravity: 1900              # px/s²
max_fall_speed: 900        # px/s
climb_speed: 140           # px/s
drop_through: 0.25         # s a dropped-through platform is ignored
width: 24                  # character box, px
height: 56
