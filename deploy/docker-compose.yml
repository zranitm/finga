# make up / make down. Postgres only for now; the migrate job, the game server
# and the web container join in later steps. Overrides for the game server go
# in ../.env (git-ignored; see ../.env.example).
name: finga

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${FINGA_POSTGRES_PORT:-5432}:5432"   # host port; set FINGA_POSTGRES_PORT when 5432 is taken
    environment:
      POSTGRES_USER: finga
      POSTGRES_PASSWORD: finga
      POSTGRES_DB: finga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finga -d finga"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
